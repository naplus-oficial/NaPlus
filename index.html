<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NaPlus</title>
<style>
  :root {
    --bg: #141414;
    --surface: #181818;
    --card: #1f1f1f;
    --red: #e50914;
    --text: #ffffff;
    --muted: #b3b3b3;
    --border: rgba(255,255,255,0.12);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(20,20,20,0.95);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--red);
    cursor: pointer;
  }

  .nav {
    display: flex;
    gap: 6px;
    overflow-x: auto;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .nav-btn.active {
    background: var(--red);
    color: #fff;
  }

  /* CONTENEDOR */
  .container {
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .section { display: none; }
  .section.active { display: block; }

  /* BUSCADOR */
  .search-box {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 20px;
  }

  .search-box:focus { border-color: #fff; }

  .title {
    font-size: 1.15rem;
    font-weight: 700;
    margin: 20px 0 12px;
    border-left: 3px solid var(--red);
    padding-left: 10px;
  }

  /* GRILLA */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  @media (min-width: 600px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 900px) {
    .grid { grid-template-columns: repeat(5, 1fr); }
  }

  /* TARJETAS */
  .card {
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border: 1px solid var(--border);
  }

  .card img {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    display: block;
    background: #2a2a2a;
  }

  .card-body {
    padding: 8px;
  }

  .card-title {
    font-size: 0.78rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-sub {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .card-admin {
    display: none;
    position: absolute;
    top: 6px;
    right: 6px;
    gap: 4px;
    z-index: 10;
  }

  body.admin-on .card-admin {
    display: flex;
  }

  .card-admin button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 6px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-size: 0.85rem;
    cursor: pointer;
  }

  /* PANEL */
  .panel {
    background: var(--surface);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 18px;
    border: 1px solid var(--border);
  }

  .panel h3 {
    font-size: 1rem;
    margin-bottom: 12px;
    color: var(--red);
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 12px;
    background: #0f0f0f;
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }

  .btn {
    background: var(--red);
    color: #fff;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }

  .btn:active { opacity: 0.85; }

  /* GÉNEROS */
  .genre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
  }

  .genre-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 12px;
    text-align: center;
    font-weight: 700;
    cursor: pointer;
  }

  .genre-card:active {
    border-color: var(--red);
  }

  /* PLAYER */
  .player-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    flex-direction: column;
  }

  .player-modal.active { display: flex; }

  .player-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: rgba(0,0,0,0.9);
  }

  .btn-close {
    background: none;
    border: none;
    color: #fff;
    font-size: 1.4rem;
    cursor: pointer;
  }

  .player-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .player-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .player-info {
    padding: 18px 16px 24px;
    background: var(--surface);
    max-height: 40vh;
    overflow-y: auto;
  }

  /* EDITOR */
  .editor-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 10000;
    justify-content: flex-end;
  }

  .editor-modal.active { display: flex; }

  .editor-sheet {
    background: var(--surface);
    width: 100%;
    max-height: 92vh;
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 30px;
    overflow-y: auto;
  }

  /* TOAST */
  #toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    z-index: 99999;
    display: none;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    margin-top: 40px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="app.switchTab('home', this)">NaPlus</div>
  <div class="nav">
    <button class="nav-btn active" onclick="app.switchTab('home', this)">Inicio</button>
    <button class="nav-btn" onclick="app.switchTab('movies', this)">Películas</button>
    <button class="nav-btn" onclick="app.switchTab('series', this)">Series</button>
    <button class="nav-btn" onclick="app.switchTab('genres', this)">Géneros</button>
    <button class="nav-btn" onclick="app.switchTab('list', this)">Mi Lista</button>
    <button class="nav-btn" onclick="app.switchTab('settings', this)">Config</button>
  </div>
</header>

<div class="container">
  <!-- INICIO -->
  <div id="tab-home" class="section active">
    <input type="search" class="search-box" id="searchInput" placeholder="🔍 Buscar películas o series..." oninput="app.render()">
    <div class="title">Películas</div>
    <div class="grid" id="movieGrid"></div>
    <div class="title" style="margin-top:28px;">Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <!-- PELÍCULAS -->
  <div id="tab-movies" class="section">
    <div class="title">Todas las Películas</div>
    <div class="grid" id="allMoviesGrid"></div>
  </div>

  <!-- SERIES -->
  <div id="tab-series" class="section">
    <div class="title">Todas las Series</div>
    <div class="grid" id="allSeriesGrid"></div>
  </div>

  <!-- GÉNEROS -->
  <div id="tab-genres" class="section">
    <div class="title">Explorar por Género</div>
    <div class="genre-grid" id="genreGrid"></div>
    <div id="genreResults" style="display:none; margin-top:24px;">
      <div class="title" id="genreTitle"></div>
      <div class="grid" id="genreResultsGrid"></div>
    </div>
  </div>

  <!-- MI LISTA -->
  <div id="tab-list" class="section">
    <div class="title">Mi Lista</div>
    <div class="grid" id="listGrid"></div>
    <p class="empty" id="emptyList" style="display:none;">No guardaste nada todavía.</p>
  </div>

  <!-- CONFIG -->
  <div id="tab-settings" class="section">
    <div class="panel" id="creatorPanel" style="display:none;">
      <h3>✓ Modo Creador Activo</h3>
      <button class="btn" onclick="app.openEditor()">+ Subir Contenido Nuevo</button>
    </div>

    <div class="panel">
      <h3>Activar Modo Creador</h3>
      <div class="field">
        <label>Código (9009) o Token de GitHub</label>
        <input type="password" id="authInput" placeholder="Escribí 9009..." oninput="app.auth(this.value)">
      </div>
      <p style="color:var(--muted); font-size:0.8rem; margin-top:8px;">
        Con el código 9009 podés subir contenido. Con un token de GitHub se publica para todos.
      </p>
    </div>
  </div>
</div>

<!-- REPRODUCTOR -->
<div class="player-modal" id="playerModal">
  <div class="player-top">
    <h3 id="pTitleTop" style="font-size:0.95rem; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h3>
    <button class="btn-close" onclick="app.closePlayer()">✕</button>
  </div>
  <div class="player-screen" id="pScreen"></div>
  <div class="player-info">
    <h2 id="pTitle" style="font-size:1.25rem; margin-bottom:6px;"></h2>
    <p id="pMeta" style="color:var(--red); font-size:0.9rem; margin-bottom:10px;"></p>
    <p id="pDesc" style="color:var(--muted); font-size:0.9rem; line-height:1.45;"></p>
    <button class="btn" id="listBtn" style="margin-top:16px;" onclick="app.toggleMyList()">+ Agregar a Mi Lista</button>
  </div>
</div>

<!-- EDITOR -->
<div class="editor-modal" id="editorModal">
  <div class="editor-sheet">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 id="editorHeading" style="color:var(--red);">Subir Contenido</h3>
      <button class="btn-close" onclick="app.closeEditor()">✕</button>
    </div>
    <form onsubmit="app.saveContent(event)">
      <input type="hidden" id="eId">
      <div class="field">
        <label>Tipo</label>
        <select id="eType">
          <option value="movie">Película</option>
          <option value="series">Serie</option>
        </select>
      </div>
      <div class="field">
        <label>Título</label>
        <input type="text" id="eTitle" required>
      </div>
      <div class="field">
        <label>Género</label>
        <input type="text" id="eGenre" required placeholder="Terror, Acción...">
      </div>
      <div class="field">
        <label>Año</label>
        <input type="number" id="eYear" required value="2025">
      </div>
      <div class="field">
        <label>Sinopsis</label>
        <textarea id="eDesc" rows="3"></textarea>
      </div>
      <div class="field">
        <label>URL de Portada</label>
        <input type="url" id="eCover" required placeholder="https://...">
      </div>
      <div class="field">
        <label>Link de Video (OK.ru)</label>
        <input type="url" id="eVideo" required placeholder="https://ok.ru/video/...">
      </div>
      <button type="submit" class="btn" style="margin-top:8px;">Guardar</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
const DEFAULT_CATALOG = /*CATALOG_START*/[
  {
    "id": 1,
    "type": "movie",
    "title": "[REC]",
    "genre": "Terror",
    "year": "2007",
    "desc": "Película de prueba.",
    "cover": "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400",
    "video": "https://ok.ru/videoembed/237592963750"
  }
]/*CATALOG_END*/;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ADMIN_PASS = '9009';
const isToken = t => /^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(t || '');
const MARK_REGEX = /\/\*CATALOG_START\*\/([\s\S]*?)\/\*CATALOG_END\*\//;
const wrapCatalog = json => '/*CATALOG_START*/' + json + '/*CATALOG_END*/';
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const b64enc = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
};

const storage = {
  get(k) { try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} }
};

function parseOk(url) {
  try {
    const u = new URL(url);
    if (u.hostname.replace(/^(www\.|m\.)/, '') !== 'ok.ru') return null;
    const m = u.pathname.match(/\/(?:video|videoembed)\/(\d+)/);
    return m ? 'https://ok.ru/videoembed/' + m[1] : null;
  } catch(e) { return null; }
}

class NaPlusApp {
  constructor() {
    this.repo = "ignacio12adrian-ux/NaPlus";
    this.file = "index.html";
    this.catalog = DEFAULT_CATALOG.slice();
    this.myList = [];
    try { this.myList = JSON.parse(storage.get('naplus_favs_v2')) || []; } catch(e){}
    this.currentId = null;
    this.isAdmin = false;
  }

  showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2800);
  }

  switchTab(tabName, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    $('tab-' + tabName).classList.add('active');
    if (btn) btn.classList.add('active');
    window.scrollTo(0, 0);

    if (tabName === 'home') this.render();
    if (tabName === 'movies') this.renderMovies();
    if (tabName === 'series') this.renderSeries();
    if (tabName === 'genres') this.renderGenres();
    if (tabName === 'list') this.renderList();
  }

  createCard(item) {
    const div = document.createElement('div');
    div.className = 'card';
    const id = Number(item.id);

    div.onclick = () => this.openPlayer(id);

    div.innerHTML = `
      <div class="card-admin">
        <button onclick="event.stopPropagation(); app.openEditor(${id})">✏️</button>
        <button onclick="event.stopPropagation(); app.deleteItem(${id})">🗑️</button>
      </div>
      <img src="${esc(item.cover)}" alt="" loading="lazy" onerror="this.src='https://placehold.co/300x450/1f1f1f/666?text=Sin+img'">
      <div class="card-body">
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-sub">${esc(item.genre)} · ${item.year}</div>
      </div>
    `;
    return div;
  }

  render() {
    const q = norm($('searchInput').value);
    const mGrid = $('movieGrid');
    const sGrid = $('seriesGrid');
    mGrid.innerHTML = '';
    sGrid.innerHTML = '';

    const filtered = this.catalog.filter(i =>
      norm(i.title).includes(q) || norm(i.genre).includes(q)
    );

    const movies = filtered.filter(i => i.type === 'movie');
    const series = filtered.filter(i => i.type === 'series');

    movies.forEach(i => mGrid.appendChild(this.createCard(i)));
    series.forEach(i => sGrid.appendChild(this.createCard(i)));

    if (!movies.length) mGrid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;grid-column:1/-1;">Sin resultados</p>';
    if (!series.length) sGrid.innerHTML = '<p style="color:var(--muted);font-size:0.85rem;grid-column:1/-1;">Sin resultados</p>';
  }

  renderMovies() {
    const grid = $('allMoviesGrid');
    grid.innerHTML = '';
    const items = this.catalog.filter(i => i.type === 'movie');
    if (!items.length) {
      grid.innerHTML = '<p class="empty">No hay películas</p>';
      return;
    }
    items.forEach(i => grid.appendChild(this.createCard(i)));
  }

  renderSeries() {
    const grid = $('allSeriesGrid');
    grid.innerHTML = '';
    const items = this.catalog.filter(i => i.type === 'series');
    if (!items.length) {
      grid.innerHTML = '<p class="empty">No hay series</p>';
      return;
    }
    items.forEach(i => grid.appendChild(this.createCard(i)));
  }

  renderGenres() {
    const grid = $('genreGrid');
    const results = $('genreResults');
    results.style.display = 'none';
    grid.innerHTML = '';

    const genres = [...new Set(this.catalog.map(i => i.genre).filter(Boolean))].sort();
    if (!genres.length) {
      grid.innerHTML = '<p class="empty">No hay géneros todavía</p>';
      return;
    }

    genres.forEach(g => {
      const card = document.createElement('div');
      card.className = 'genre-card';
      card.textContent = g;
      card.onclick = () => {
        const items = this.catalog.filter(i => i.genre === g);
        $('genreTitle').textContent = g;
        const rGrid = $('genreResultsGrid');
        rGrid.innerHTML = '';
        items.forEach(i => rGrid.appendChild(this.createCard(i)));
        results.style.display = 'block';
      };
      grid.appendChild(card);
    });
  }

  renderList() {
    const grid = $('listGrid');
    const msg = $('emptyList');
    grid.innerHTML = '';
    const items = this.catalog.filter(i => this.myList.includes(Number(i.id)));

    if (!items.length) {
      msg.style.display = 'block';
    } else {
      msg.style.display = 'none';
      items.forEach(i => grid.appendChild(this.createCard(i)));
    }
  }

  openPlayer(id) {
    this.currentId = id;
    const item = this.catalog.find(x => Number(x.id) === id);
    if (!item) return;

    $('pTitleTop').textContent = item.title;
    $('pTitle').textContent = item.title;
    \( ('pMeta').textContent = ` \){item.genre} · ${item.year}`;
    $('pDesc').textContent = item.desc || 'Sin sinopsis.';
    this.updateListBtn();

    const embed = parseOk(item.video);
    $('pScreen').innerHTML = embed
      ? `<iframe src="${esc(embed)}" allowfullscreen allow="autoplay; fullscreen"></iframe>`
      : '<div style="color:var(--red);padding:30px;text-align:center;">Video no disponible</div>';

    $('playerModal').classList.add('active');
  }

  closePlayer() {
    $('pScreen').innerHTML = '';
    $('playerModal').classList.remove('active');
  }

  updateListBtn() {
    const inList = this.myList.includes(this.currentId);
    const btn = $('listBtn');
    btn.textContent = inList ? '✓ En Mi Lista' : '+ Agregar a Mi Lista';
    btn.style.background = inList ? '#333' : 'var(--red)';
  }

  toggleMyList() {
    const idx = this.myList.indexOf(this.currentId);
    if (idx > -1) {
      this.myList.splice(idx, 1);
      this.showToast('Eliminado de Mi Lista');
    } else {
      this.myList.push(this.currentId);
      this.showToast('Agregado a Mi Lista');
    }
    storage.set('naplus_favs_v2', JSON.stringify(this.myList));
    this.updateListBtn();
    this.renderList();
  }

  auth(val) {
    const v = val.trim();
    if (v === ADMIN_PASS || isToken(v)) {
      if (isToken(v)) storage.set('naplus_token', v);
      this.activateAdmin();
    }
  }

  activateAdmin() {
    if (this.isAdmin) return;
    this.isAdmin = true;
    $('creatorPanel').style.display = 'block';
    document.body.classList.add('admin-on');
    this.showToast('Modo Creador activado');
  }

  openEditor(id = null) {
    if (id) {
      const item = this.catalog.find(x => Number(x.id) === id);
      if (!item) return;
      $('editorHeading').textContent = 'Editar Contenido';
      $('eId').value = item.id;
      $('eType').value = item.type;
      $('eTitle').value = item.title;
      $('eGenre').value = item.genre;
      $('eYear').value = item.year;
      $('eDesc').value = item.desc || '';
      $('eCover').value = item.cover;
      $('eVideo').value = item.video;
    } else {
      $('editorHeading').textContent = 'Subir Contenido';
      $('eId').value = '';
      $('eType').value = 'movie';
      $('eTitle').value = '';
      $('eGenre').value = '';
      $('eYear').value = new Date().getFullYear();
      $('eDesc').value = '';
      $('eCover').value = '';
      $('eVideo').value = '';
    }
    $('editorModal').classList.add('active');
  }

  closeEditor() {
    $('editorModal').classList.remove('active');
  }

  async deleteItem(id) {
    if (!confirm('¿Eliminar este título?')) return;
    this.catalog = this.catalog.filter(x => Number(x.id) !== id);
    this.myList = this.myList.filter(x => x !== id);
    storage.set('naplus_favs_v2', JSON.stringify(this.myList));
    this.render();
    this.renderMovies();
    this.renderSeries();
    this.renderGenres();
    this.renderList();
    this.showToast('Eliminado');
    await this.syncGitHub();
  }

  async saveContent(e) {
    e.preventDefault();
    const vUrl = $('eVideo').value.trim();
    if (!parseOk(vUrl)) {
      alert('El enlace debe ser de OK.ru (ejemplo: https://ok.ru/video/...)');
      return;
    }

    const eId = $('eId').value;
    const item = {
      id: eId ? parseInt(eId, 10) : Date.now(),
      type: $('eType').value,
      title: $('eTitle').value.trim(),
      genre: $('eGenre').value.trim(),
      year: String($('eYear').value),
      desc: $('eDesc').value.trim(),
      cover: $('eCover').value.trim(),
      video: vUrl
    };

    const idx = eId ? this.catalog.findIndex(x => Number(x.id) === Number(eId)) : -1;
    if (idx !== -1) this.catalog[idx] = item;
    else this.catalog.unshift(item);

    this.closeEditor();
    this.render();
    this.renderMovies();
    this.renderSeries();
    this.renderGenres();
    this.renderList();
    this.showToast('Guardado con éxito');
    await this.syncGitHub();
  }

  async syncGitHub() {
    let token = storage.get('naplus_token');
    if (!isToken(token)) {
      token = prompt('Ingresá tu Token de GitHub (ghp_...) para publicar globalmente:\n\n(Podés cancelar y el contenido queda solo en este dispositivo)');
      if (isToken(token)) {
        token = token.trim();
        storage.set('naplus_token', token);
        this.activateAdmin();
      } else {
        return;
      }
    }

    this.showToast('Sincronizando...');
    const url = `https://api.github.com/repos/\( {this.repo}/contents/ \){this.file}`;
    const headers = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json'
    };

    try {
      const res = await fetch(url, { headers });
      if (!res.ok) {
        this.showToast('Error de Token');
        return;
      }
      const data = await res.json();
      const code = b64dec(data.content);
      const jsonStr = JSON.stringify(this.catalog, null, 2);
      const newCode = MARK_REGEX.test(code)
        ? code.replace(MARK_REGEX, wrapCatalog(jsonStr))
        : code;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Actualización NaPlus',
          content: b64enc(newCode),
          sha: data.sha
        })
      });

      if (putRes.ok) this.showToast('✅ Publicado en GitHub');
      else this.showToast('❌ Error al publicar');
    } catch (err) {
      this.showToast('❌ Error de red');
    }
  }

  async initCloud() {
    const token = storage.get('naplus_token');
    if (!isToken(token)) return;
    try {
      const res = await fetch(`https://api.github.com/repos/\( {this.repo}/contents/ \){this.file}`, {
        headers: {
          'Authorization': 'Bearer ' + token,
          'Accept': 'application/vnd.github+json'
        }
      });
      if (!res.ok) return;
      const data = await res.json();
      const code = b64dec(data.content);
      const match = code.match(MARK_REGEX);
      if (match) {
        const remote = JSON.parse(match[1]);
        if (Array.isArray(remote) && remote.length) {
          this.catalog = remote;
          this.render();
          this.renderList();
        }
      }
    } catch (e) {}
  }
}

const app = new NaPlusApp();
app.initCloud();
app.render();

if (isToken(storage.get('naplus_token'))) {
  app.activateAdmin();
}
</script>
