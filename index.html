<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #e50914;
      --text-color: #ffffff;
      --text-secondary: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* HEADER / NAVBAR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5%;
      background: rgba(0, 0, 0, 0.85);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 15px;
      border-radius: 20px;
      outline: none;
      width: 200px;
      transition: width 0.3s ease;
    }

    .search-box input:focus {
      width: 280px;
      border-color: var(--accent-color);
    }

    /* BANNER DESTACADO (HERO) */
    .hero {
      position: relative;
      width: 100%;
      height: 60vh;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 40px 5%;
      box-shadow: inset 0 -100px 50px var(--bg-color);
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .hero-title {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .hero-desc {
      font-size: 0.95rem;
      color: #ddd;
      margin-bottom: 20px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    .btn-play {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-play:hover {
      background: #b20710;
    }

    /* SECCIONES Y CONTENEDORES */
    main {
      padding: 20px 5%;
    }

    .section-title {
      font-size: 1.4rem;
      margin: 25px 0 15px 0;
      border-left: 4px solid var(--accent-color);
      padding-left: 10px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    /* TARJETAS DE CONTENIDO */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* MODAL DEL REPRODUCTOR */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 900px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 1.8rem;
      color: #fff;
      cursor: pointer;
      z-index: 10;
    }

    .player-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      background: #000;
    }

    .player-container iframe, 
    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .modal-body {
      padding: 20px;
      max-height: 250px;
      overflow-y: auto;
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 15px;
    }

    .episode-btn {
      background: #2a2a2a;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      text-align: left;
      cursor: pointer;
    }

    .episode-btn:hover {
      background: var(--accent-color);
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">NaPlus 💫</a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar título..." oninput="filtrarCatalogo()">
    </div>
  </header>

  <!-- BANNER PRINCIPAL -->
  <div class="hero" id="heroBanner">
    <div class="hero-content">
      <h1 class="hero-title" id="heroTitle">Cargando...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <button class="btn-play" id="heroPlayBtn">Ver Ahora</button>
    </div>
  </div>

  <main>
    <h2 class="section-title">Novedades y Destacados</h2>
    <div class="grid-container" id="featuredGrid"></div>

    <h2 class="section-title">Películas</h2>
    <div class="grid-container" id="moviesGrid"></div>

    <h2 class="section-title">Series</h2>
    <div class="grid-container" id="seriesGrid"></div>
  </main>

  <!-- MODAL REPRODUCTOR -->
  <div class="modal" id="videoModal">
    <div class="modal-content">
      <span class="close-modal" onclick="cerrarModal()">&times;</span>
      <div class="player-container" id="playerBox"></div>
      <div class="modal-body">
        <h3 id="modalTitle"></h3>
        <p id="modalDesc" style="font-size: 0.85rem; color: #aaa; margin-top: 5px;"></p>
        <div class="episodes-list" id="episodesList"></div>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];

    // Cargar catálogo dinámicamente desde el JSON
    async function cargarCatalogo() {
      try {
        const response = await fetch('database.json');
        catalog = await response.json();
        
        setupHero();
        renderHomeSections();
      } catch (error) {
        console.error('Error al cargar database.json:', error);
      }
    }

    // Configurar Banner Principal
    function setupHero() {
      const featuredItem = catalog.find(item => item.featured) || catalog[0];
      if (!featuredItem) return;

      document.getElementById('heroBanner').style.backgroundImage = `linear-gradient(to top, #121212, transparent), url('${featuredItem.cover}')`;
      document.getElementById('heroTitle').innerText = featuredItem.title;
      document.getElementById('heroDesc').innerText = featuredItem.desc || 'Sin descripción disponible.';
      document.getElementById('heroPlayBtn').onclick = () => abrirReproductor(featuredItem);
    }

    // Renderizar secciones principales
    function renderHomeSections(items = catalog) {
      const moviesGrid = document.getElementById('moviesGrid');
      const seriesGrid = document.getElementById('seriesGrid');
      const featuredGrid = document.getElementById('featuredGrid');

      moviesGrid.innerHTML = '';
      seriesGrid.innerHTML = '';
      featuredGrid.innerHTML = '';

      items.forEach(item => {
        const card = crearTarjeta(item);
        
        if (item.featured) featuredGrid.appendChild(card.cloneNode(true));
        
        if (item.type === 'movie') {
          moviesGrid.appendChild(card);
        } else if (item.type === 'series') {
          seriesGrid.appendChild(card);
        }
      });
    }

    // Crear elemento tarjeta
    function crearTarjeta(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => abrirReproductor(item);

      card.innerHTML = `
        <img src="${item.cover}" alt="${item.title}" loading="lazy">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-meta">${item.year} • ${item.genre}</div>
        </div>
      `;
      return card;
    }

    // Filtrar catálogo por búsqueda
    function filtrarCatalogo() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = catalog.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.genre.toLowerCase().includes(query)
      );
      renderHomeSections(filtrados);
    }

    // Reproductor de Vídeo Dinámico
    function abrirReproductor(item) {
      const modal = document.getElementById('videoModal');
      const playerBox = document.getElementById('playerBox');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');
      const episodesList = document.getElementById('episodesList');

      modalTitle.innerText = item.title;
      modalDesc.innerText = item.desc || '';
      episodesList.innerHTML = '';

      if (item.type === 'movie') {
        cargarIframe(playerBox, item.video);
      } else if (item.type === 'series' && item.seasons && item.seasons.length > 0) {
        // Cargar primer episodio por defecto
        const primerEp = item.seasons[0].episodes[0];
        if (primerEp) cargarIframe(playerBox, primerEp.video);

        // Listar episodios
        item.seasons.forEach(temp => {
          temp.episodes.forEach(ep => {
            const btn = document.createElement('button');
            btn.className = 'episode-btn';
            btn.innerText = `E${ep.num}: ${ep.title}`;
            btn.onclick = () => cargarIframe(playerBox, ep.video);
            episodesList.appendChild(btn);
          });
        });
      }

      modal.style.display = 'flex';
    }

    // Generar embebido de vídeo automáticamente
    function cargarIframe(container, url) {
      if (!url) {
        container.innerHTML = '<p style="color:#fff; text-align:center; padding-top:20%;">Vídeo no disponible.</p>';
        return;
      }

      let embedUrl = url;

      if (url.includes('odysee.com') && !url.includes('/$/embed/')) {
        embedUrl = url.replace('odysee.com/', 'odysee.com/$/embed/');
      }

      container.innerHTML = `
        <iframe src="${embedUrl}" allowfullscreen scrolling="no"></iframe>
      `;
    }

    function cerrarModal() {
      const modal = document.getElementById('videoModal');
      const playerBox = document.getElementById('playerBox');
      modal.style.display = 'none';
      playerBox.innerHTML = ''; // Detener reproducción
    }

    // Inicializar app
    cargarCatalogo();
    autoSyncCatalogFromCloud();
  </script>
</body>
</html>
