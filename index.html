  <script>
    // ... todo tu JavaScript anterior (reproductores, eventos, etc.) ...

    function changeVideoQuality(selectElem) {
      const quality = selectElem.value;
      const videoEl = document.getElementById('customHtmlVideo');
      if (!videoEl) return;
      const isPaused = videoEl.paused;
      console.log("Cambiando calidad de video a: ", quality);
      if (!isPaused) videoEl.play();
    }

    // Cargar la base de datos desde database.json sin alterar el diseño
    async function cargarCatalogo() {
      try {
        const response = await fetch('database.json');
        catalog = await response.json();
        renderHomeSections();
      } catch (error) {
        console.error('Error al cargar database.json:', error);
      }
    }

    cargarCatalogo();
    autoSyncCatalogFromCloud();
  </script>
