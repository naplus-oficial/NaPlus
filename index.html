<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link rel="dns-prefetch" href="https://raw.githubusercontent.com">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7c3aed">

  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    .anim-pop { animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    .nav-item {
      background: none; border: none; color: var(--text-gray);
      font-size: 0.62rem; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; width: 20%;
    }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); }

    .view-section { display: none; padding-bottom: 20px; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList, #viewSearch { padding-top: 75px; }

    .hbo-hero-slider {
      position: relative; width: 100%; height: 460px; background: #000; overflow: hidden; margin-bottom: 15px;
    }
    .hbo-slides-wrapper { display: flex; width: 100%; height: 100%; transition: transform 0.5s ease; }
    .hbo-slide {
      position: relative; min-width: 100%; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px 20px; background-size: cover; background-position: center; flex-shrink: 0; cursor: pointer;
    }
    .hbo-slide-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.5) 60%, var(--bg-dark) 100%);
    }
    .hbo-slide-content { position: relative; z-index: 3; text-align: left; }
    .hbo-slide-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .hbo-slide-meta { font-size: 0.8rem; color: var(--accent-light); margin-bottom: 12px; font-weight: 500; }
    .hbo-slide-btns { display: flex; gap: 10px; align-items: center; }
    .hbo-btn-play { background: #fff; color: #000; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .hbo-btn-add.saved { border-color: var(--accent-light); background: rgba(124, 58, 237, 0.25); }
    .hbo-btn-add.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .hbo-slider-dots { position: absolute; bottom: 12px; right: 20px; z-index: 10; display: flex; gap: 5px; }
    .hbo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    .search-hero { padding: 15px 20px 10px; }
    .search-box { width: 100%; max-width: 500px; position: relative; margin: 0 auto; }
    .search-box input {
      width: 100%; padding: 11px 40px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple); color: #fff; border-radius: 8px; font-size: 0.95rem; outline: none;
    }

    .section-title { font-size: 1.2rem; font-weight: 800; margin: 28px 20px 12px; color: #fff; }
    .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    .top10-section-wrapper { margin: 28px 0 10px 0; }
    .top10-header-title { padding: 0 20px; margin-bottom: 12px; display: flex; flex-direction: column; line-height: 1; }
    .top10-title-main { font-size: 1.9rem; font-weight: 900; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
    .top10-title-sub { font-size: 0.8rem; font-weight: 700; letter-spacing: 3px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; }
    .top10-scroll-container { display: flex; gap: 16px; overflow-x: auto; padding: 15px 20px 20px 20px; scrollbar-width: none; align-items: flex-end; }
    .top10-scroll-container::-webkit-scrollbar { display: none; }
    .top10-item-card { position: relative; min-width: 225px; width: 225px; flex-shrink: 0; display: flex; align-items: flex-end; cursor: pointer; }
    .top10-number-svg { position: absolute; left: -8px; bottom: -4px; width: 48px; height: 70px; z-index: 1; pointer-events: none; }
    .top10-poster-box {
      position: relative; width: 180px; aspect-ratio: 2/3; border-radius: 9px; overflow: hidden;
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.12); z-index: 2; margin-left: 36px;
    }
    .top10-poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .top10-fav-btn {
      position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
    }
    .top10-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 0 20px; }
    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; position: relative; }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; }
    .card-info { padding: 6px 8px; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
    }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .admin-btns { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; z-index: 10; }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      width: 26px; height: 26px; border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .modal-box-movie, .modal-box-series, .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; overflow-y: auto;
    }
    .modal-box-movie, .modal-box-series { background: #07040d; width: 100vw; height: 100vh; z-index: 2100; }
    .modal-box { background: #11091e; padding: 20px; border-radius: 10px; width: 100%; max-width: 480px; border: 1px solid var(--border-purple); margin: auto; }

    .movie-header-bg, .stream-header-bg {
      position: relative; width: 100%; min-height: 520px; background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 75px 20px 20px 20px;
    }
    .movie-header-gradient, .stream-header-gradient {
      position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,4,13,0.1) 0%, rgba(7,4,13,0.5) 50%, #07040d 100%);
    }
    .movie-info-container, .stream-info-container { position: relative; z-index: 2; }
    .movie-main-title, .stream-title-text { font-size: 2.2rem; font-weight: 900; line-height: 1.1; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    .movie-meta-info, .stream-meta-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; font-weight: 500; }
    .movie-btn-play, .stream-play-main-btn {
      background: #fff; color: #000; border: none; width: 100%; padding: 13px; border-radius: 8px; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-bottom: 16px;
    }
    .movie-synopsis, .stream-synopsis { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; }
    .movie-genres-tags { font-size: 0.75rem; color: var(--accent-light); margin-bottom: 24px; font-weight: 600; }

    .stream-top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 65px; display: flex; justify-content: flex-end; align-items: center; padding: 0 20px; z-index: 2260;
    }
    .stream-top-btn {
      background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .stream-tabs-bar { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 20px; gap: 30px; }
    .stream-tab { background: none; border: none; color: var(--text-gray); font-size: 0.95rem; font-weight: 600; padding: 10px 0; cursor: pointer; }
    .stream-tab.active { color: #fff; font-weight: 700; border-bottom: 3px solid #fff; }

    .stream-content-area { padding: 14px 20px 40px 20px; }
    .stream-season-select { background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 800; outline: none; cursor: pointer; }
    .stream-episodes-list { display: flex; flex-direction: column; gap: 14px; }
    .stream-ep-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
    .stream-ep-thumb-box { width: 120px; height: 68px; border-radius: 6px; overflow: hidden; background: #1a1528; position: relative; flex-shrink: 0; }
    .stream-ep-thumb-box img { width: 100%; height: 100%; object-fit: cover; }
    .stream-ep-play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; color: #fff; }
    .stream-ep-info { flex-grow: 1; overflow: hidden; }
    .stream-ep-title { font-size: 0.9rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .stream-ep-duration { font-size: 0.7rem; color: var(--accent-light); margin-bottom: 3px; font-weight: 600; }
    .stream-ep-desc { font-size: 0.72rem; color: var(--text-gray); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .btn-close {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; cursor: pointer; z-index: 2250; display: flex; align-items: center; justify-content: center;
    }

    .video-box { width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 12px; border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .video-box iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 0 20px; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
  </header>

  <div id="viewHome" class="view-section active">
    <div class="hbo-hero-slider">
      <div class="hbo-slides-wrapper" id="hboSlidesWrapper"></div>
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>
    <div id="mainHomeContent">
      <div class="top10-section-wrapper">
        <div class="top10-header-title">
          <span class="top10-title-main">TOP 10</span>
          <span class="top10-title-sub">Películas Hoy</span>
        </div>
        <div class="top10-scroll-container" id="topMoviesScroll"></div>
      </div>
      <div class="top10-section-wrapper">
        <div class="top10-header-title">
          <span class="top10-title-main">TOP 10</span>
          <span class="top10-title-sub">Series Hoy</span>
        </div>
        <div class="top10-scroll-container" id="topSeriesScroll"></div>
      </div>
      <div class="section-title">Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>
    </div>
  </div>

  <div id="viewMovies" class="view-section">
    <div class="section-title" style="margin-top: 10px;">Películas</div>
    <div class="grid" id="moviesGrid"></div>
  </div>

  <div id="viewSeries" class="view-section">
    <div class="section-title" style="margin-top: 10px;">Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <div id="viewSearch" class="view-section">
    <div class="search-hero">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar película o serie..." oninput="handleSearch()">
      </div>
    </div>
    <div class="section-title">Resultados</div>
    <div class="grid" id="searchGrid">
      <div class="empty-msg">Escribe algo para comenzar la búsqueda.</div>
    </div>
  </div>

  <div id="viewList" class="view-section">
    <div class="section-title" style="margin-top: 10px;">Mi Lista</div>
    <div class="grid" id="myListGrid"></div>
  </div>

  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </button>
    <button class="nav-item" id="navMovies" onclick="switchView('movies')">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
      Películas
    </button>
    <button class="nav-item" id="navSeries" onclick="switchView('series')">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
      Series
    </button>
    <button class="nav-item" id="navSearch" onclick="switchView('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Buscar
    </button>
    <button class="nav-item" id="navList" onclick="switchView('list')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      Mi Lista
    </button>
  </nav>

  <div class="modal-box-movie" id="movieDetailModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="closeModal('movieDetailModal')">✕</button>
    </div>
    <div class="movie-header-bg" id="movieHeaderBg">
      <div class="movie-header-gradient"></div>
      <div class="movie-info-container">
        <div class="movie-main-title" id="movieTitle"></div>
        <div class="movie-meta-info" id="movieMeta"></div>
        <button class="movie-btn-play" onclick="playCurrentMovie()">▶ Ver ahora</button>
        <div class="movie-synopsis" id="movieDesc"></div>
        <div class="movie-genres-tags" id="movieGenres"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="moviePlayerModal" style="z-index: 2500;">
    <div class="modal-box" style="max-width: 750px; background:#000; padding:0; border:none;">
      <button class="btn-close" onclick="closeMoviePlayerModal()">✕</button>
      <div class="video-box" id="fullscreenMovieVideoBox" style="aspect-ratio:16/9; margin-bottom:0;"></div>
    </div>
  </div>

  <div class="modal-box-series" id="seriesModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="closeModal('seriesModal')">✕</button>
    </div>
    <div class="stream-header-bg" id="streamHeaderBg">
      <div class="stream-header-gradient"></div>
      <div class="stream-info-container">
        <div class="stream-title-text" id="seriesTitle"></div>
        <div class="stream-meta-info" id="seriesMeta"></div>
        <button class="stream-play-main-btn" onclick="playFirstEpisodeOfSeries()">▶ Reproducir</button>
        <div class="stream-synopsis" id="seriesDesc"></div>
      </div>
    </div>
    <div class="stream-tabs-bar">
      <button class="stream-tab active">Episodios</button>
    </div>
    <div class="stream-content-area">
      <div class="stream-season-row" style="margin-bottom: 12px;">
        <select id="seasonSelect" class="stream-season-select" onchange="renderEpisodesForSelectedSeason()"></select>
      </div>
      <div class="stream-episodes-list" id="episodesListContainer"></div>
    </div>
  </div>

  <div class="modal-overlay" id="episodeModal" style="z-index: 2500;">
    <div class="modal-box" style="max-width: 550px;">
      <button class="btn-close" onclick="closeEpisodePlayer()">✕</button>
      <div class="video-box" id="episodeVideoBox"></div>
      <h3 id="epModalTitle"></h3>
      <p id="epModalDesc" style="color:var(--text-gray); font-size:0.8rem; margin-bottom:12px;"></p>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const DB_FILE_PATH = "database.json";

    // CATÁLOGO INICIAL VACÍO O RECUPERADO DE LOCALSTORAGE PARA CERO DEMORA
    let catalog = JSON.parse(localStorage.getItem('naPlus_permanent_db')) || [];
    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = localStorage.getItem('naPlus_is_creator_active') === 'true';

    if (isCreatorMode) document.body.classList.add('creator-mode');

    // RENDERIZADO INICIAL INMEDIATO SI EXISTEN DATOS EN CACHÉ
    if (catalog.length > 0) {
      renderAllViews();
    }

    // CARGA ASÍNCRONA NO BLOQUEANTE DESDE GITHUB
    async function initApp() {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${REPO}/main/${DB_FILE_PATH}?_t=` + Date.now();
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const cloudCatalog = await res.json();
          if (Array.isArray(cloudCatalog) && cloudCatalog.length > 0) {
            catalog = cloudCatalog;
            localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
            renderAllViews();
          }
        }
      } catch (err) {
        console.log("Usando modo offline con caché local.");
      }
    }
    initApp();

    function handleImgError(img) {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='#1a1528'/><text x='50%' y='50%' fill='#94a3b8' font-size='14' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>NaPlus</text></svg>");
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
      } else if (viewName === 'movies') {
        document.getElementById('viewMovies').classList.add('active');
        document.getElementById('navMovies').classList.add('active');
        renderMoviesGrid();
      } else if (viewName === 'series') {
        document.getElementById('viewSeries').classList.add('active');
        document.getElementById('navSeries').classList.add('active');
        renderSeriesGrid();
      } else if (viewName === 'search') {
        document.getElementById('viewSearch').classList.add('active');
        document.getElementById('navSearch').classList.add('active');
        setTimeout(() => document.getElementById('searchInput').focus(), 50);
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
        renderMyList();
      }
      window.scrollTo(0, 0);
    }

    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderAllViews();
    }

    function renderAllViews() {
      renderHeroSlider();
      renderTop10();
      renderRecent();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
    }

    let currentSlide = 0;
    let sliderInterval = null;

    function renderHeroSlider() {
      const wrapper = document.getElementById('hboSlidesWrapper');
      const dotsContainer = document.getElementById('hboSliderDots');
      let displayItems = catalog.filter(item => item.featured);
      if (displayItems.length === 0) displayItems = catalog.slice(0, 6);

      if (displayItems.length === 0) {
        wrapper.innerHTML = '<div class="empty-msg" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;">Cargando contenido...</div>';
        return;
      }

      wrapper.innerHTML = '';
      dotsContainer.innerHTML = '';
      const fragWrapper = document.createDocumentFragment();
      const fragDots = document.createDocumentFragment();

      displayItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'hbo-slide';
        if (item.cover) slide.style.backgroundImage = `url('${item.cover}')`;
        slide.onclick = () => openContentDetail(item.id);
        const isFav = myFavorites.includes(item.id);

        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">${item.year} • ${item.genre || ''}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="event.stopPropagation(); openContentDetail(${item.id})">▶ Reproducir</button>
              <button class="hbo-btn-add ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
          </div>
        `;
        fragWrapper.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        fragDots.appendChild(dot);
      });

      wrapper.appendChild(fragWrapper);
      dotsContainer.appendChild(fragDots);

      if (sliderInterval) clearInterval(sliderInterval);
      currentSlide = 0;
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % displayItems.length;
        if (wrapper) wrapper.style.transform = `translateX(-${currentSlide * 100}%)`;
        dotsContainer.querySelectorAll('.hbo-dot').forEach((d, i) => d.classList.toggle('active', i === currentSlide));
      }, 4500);
    }

    function renderTop10() {
      const topMoviesScroll = document.getElementById('topMoviesScroll');
      const topSeriesScroll = document.getElementById('topSeriesScroll');
      topMoviesScroll.innerHTML = '';
      topSeriesScroll.innerHTML = '';

      const moviesFrag = document.createDocumentFragment();
      catalog.filter(i => i.type === 'movie').slice(0, 10).forEach((item, idx) => moviesFrag.appendChild(createTop10Element(item, idx + 1)));
      topMoviesScroll.appendChild(moviesFrag);

      const seriesFrag = document.createDocumentFragment();
      catalog.filter(i => i.type === 'series').slice(0, 10).forEach((item, idx) => seriesFrag.appendChild(createTop10Element(item, idx + 1)));
      topSeriesScroll.appendChild(seriesFrag);
    }

    function createTop10Element(item, rank) {
      const div = document.createElement('div');
      div.className = 'top10-item-card';
      div.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);
      div.innerHTML = `
        <svg viewBox="0 0 100 140" class="top10-number-svg"><text x="50%" y="112" text-anchor="middle" style="font-weight:900;font-size:100px;fill:#07040d;stroke:rgba(255,255,255,0.9);stroke-width:3.5px;paint-order:stroke fill;">${rank}</text></svg>
        <div class="top10-poster-box">
          <button class="top10-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>
          <img src="${item.cover}" alt="Poster" onerror="handleImgError(this)" loading="lazy">
        </div>
      `;
      return div;
    }

    function renderRecent() {
      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      const frag = document.createDocumentFragment();
      catalog.forEach(item => frag.appendChild(createCardElement(item)));
      recentScroll.appendChild(frag);
    }

    function renderMoviesGrid() {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      catalog.filter(i => i.type === 'movie').forEach(item => frag.appendChild(createCardElement(item)));
      grid.appendChild(frag);
    }

    function renderSeriesGrid() {
      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      catalog.filter(i => i.type === 'series').forEach(item => frag.appendChild(createCardElement(item)));
      grid.appendChild(frag);
    }

    function renderMyList() {
      const grid = document.getElementById('myListGrid');
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      catalog.filter(i => myFavorites.includes(i.id)).forEach(item => frag.appendChild(createCardElement(item)));
      grid.appendChild(frag);
      if (grid.children.length === 0) grid.innerHTML = '<div class="empty-msg">No tenés elementos guardados.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);
      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg></button>
        <img src="${item.cover}" alt="Portada" onerror="handleImgError(this)" loading="lazy">
        <div class="card-info"><div class="card-title">${item.title}</div><div class="card-sub">${item.year}</div></div>
      `;
      return card;
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const searchGrid = document.getElementById('searchGrid');
      searchGrid.innerHTML = '';
      if (!query) { searchGrid.innerHTML = '<div class="empty-msg">Escribe algo para comenzar la búsqueda.</div>'; return; }
      const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || (i.genre && i.genre.toLowerCase().includes(query)));
      const frag = document.createDocumentFragment();
      matches.forEach(item => frag.appendChild(createCardElement(item)));
      searchGrid.appendChild(frag);
      if (searchGrid.children.length === 0) searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
    }

    let currentMovieData = null;
    let currentSeriesData = null;

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;
      if (item.type === 'series') {
        currentSeriesData = item;
        document.getElementById('streamHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('seriesTitle').innerText = item.title;
        document.getElementById('seriesMeta').innerText = `${item.year} • ${item.genre || ''}`;
        document.getElementById('seriesDesc').innerText = item.desc || '';
        const seasonSelect = document.getElementById('seasonSelect');
        seasonSelect.innerHTML = '';
        if (item.seasons) {
          item.seasons.forEach((s, idx) => {
            const opt = document.createElement('option'); opt.value = idx; opt.innerText = s.name;
            seasonSelect.appendChild(opt);
          });
        }
        renderEpisodesForSelectedSeason();
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        currentMovieData = item;
        document.getElementById('movieHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('movieTitle').innerText = item.title;
        document.getElementById('movieMeta').innerText = `${item.year}`;
        document.getElementById('movieDesc').innerText = item.desc || '';
        document.getElementById('movieGenres').innerText = item.genre || '';
        document.getElementById('movieDetailModal').style.display = 'block';
      }
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function playCurrentMovie() {
      if (!currentMovieData) return;
      renderVideoInBox(document.getElementById('fullscreenMovieVideoBox'), currentMovieData.video);
      document.getElementById('moviePlayerModal').style.display = 'flex';
    }
    function closeMoviePlayerModal() {
      document.getElementById('moviePlayerModal').style.display = 'none';
      document.getElementById('fullscreenMovieVideoBox').innerHTML = '';
    }

    function renderEpisodesForSelectedSeason() {
      if (!currentSeriesData || !currentSeriesData.seasons) return;
      const sIdx = document.getElementById('seasonSelect').value;
      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = '';
      if (!season || !season.episodes) return;
      const frag = document.createDocumentFragment();
      season.episodes.forEach((ep, eIdx) => {
        const div = document.createElement('div');
        div.className = 'stream-ep-item';
        div.onclick = () => playEpisode(sIdx, eIdx);
        div.innerHTML = `
          <div class="stream-ep-thumb-box"><img src="${ep.img || currentSeriesData.cover}" onerror="handleImgError(this)" loading="lazy"><div class="stream-ep-play-overlay">▶</div></div>
          <div class="stream-ep-info"><div class="stream-ep-title">${ep.num || (eIdx+1)}. ${ep.title}</div><div class="stream-ep-duration">${ep.duration || '45 min'}</div><div class="stream-ep-desc">${ep.desc || ''}</div></div>
        `;
        frag.appendChild(div);
      });
      container.appendChild(frag);
    }

    function playFirstEpisodeOfSeries() { playEpisode(0, 0); }
    function playEpisode(sIdx, eIdx) {
      const ep = currentSeriesData.seasons[sIdx].episodes[eIdx];
      document.getElementById('seriesModal').style.display = 'none';
      document.getElementById('epModalTitle').innerText = ep.title;
      document.getElementById('epModalDesc').innerText = ep.desc || '';
      renderVideoInBox(document.getElementById('episodeVideoBox'), ep.video);
      document.getElementById('episodeModal').style.display = 'flex';
    }
    function closeEpisodePlayer() {
      document.getElementById('episodeModal').style.display = 'none';
      document.getElementById('episodeVideoBox').innerHTML = '';
      if (currentSeriesData) document.getElementById('seriesModal').style.display = 'block';
    }

    function renderVideoInBox(vBox, vInput) {
      if (!vInput) { vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>'; return; }
      if (vInput.includes('youtube.com') || vInput.includes('youtu.be')) {
        let embed = vInput.includes('watch?v=') ? `https://www.youtube.com/embed/${vInput.split('watch?v=')[1].split('&')[0]}?autoplay=1` : vInput;
        vBox.innerHTML = `<iframe src="${embed}" allowfullscreen></iframe>`;
      } else if (vInput.includes('ok.ru')) {
        vBox.innerHTML = `<iframe src="${vInput.replace('/video/', '/videoembed/')}" allow="autoplay" allowfullscreen></iframe>`;
      } else if (vInput.includes('odysee.com')) {
        vBox.innerHTML = `<iframe src="${vInput.replace('odysee.com/', 'odysee.com/$/embed/')}" allow="autoplay" allowfullscreen></iframe>`;
      } else {
        vBox.innerHTML = `<video src="${vInput}" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
      }
    }
  </script>
</body>
</html>
