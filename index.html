<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaPlus - Películas y Series</title>
    <style>
        :root {
            --bg-color: #141414;
            --text-color: #ffffff;
            --primary-color: #e50914;
            --secondary-color: #222222;
        }
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(20, 20, 20, 0.9);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }
        .logo {
            color: var(--primary-color);
            font-size: 28px;
            font-weight: bold;
            text-decoration: uppercase;
            letter-spacing: 2px;
        }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #b3b3b3;
        }
        .main-container {
            padding: 100px 40px 40px 40px;
        }
        .hero {
            background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(0,0,0,0.2)), url('https://via.placeholder.com/1200x500') no-repeat center center/cover;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 40px;
            border-radius: 8px;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 48px;
            margin: 0 0 10px 0;
        }
        .hero p {
            font-size: 18px;
            max-width: 600px;
            margin: 0 0 20px 0;
            color: #d1d1d1;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: fit-content;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #f40612;
        }
        .section-title {
            font-size: 22px;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--secondary-color);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .card-info {
            padding: 10px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NaPlus</div>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Películas</a>
            <a href="#">Series</a>
            <a href="#">Mi Lista</a>
        </nav>
    </header>

    <div class="main-container">
        <!-- HERO SECTION -->
        <div class="hero">
            <h1>Catálogo General</h1>
            <p>Disfruta de las mejores películas y series sincronizadas automáticamente y actualizadas para todos los usuarios.</p>
            <button class="btn" onclick="reproducirDestacado()">Reproducir</button>
        </div>

        <!-- CATALOG SECTION -->
        <div class="section-title">Tendencias</div>
        <div class="catalog-grid" id="catalogGrid">
            <!-- /*CATALOG_START*/ -->
            <!-- El catálogo completo está incrustado y sincronizado de forma permanente -->
            <div class="card">
                <img src="https://via.placeholder.com/200x300" alt="Película 1">
                <div class="card-info">
                    <p class="card-title">Título de Ejemplo 1</p>
                </div>
            </div>
            <div class="card">
                <img src="https://via.placeholder.com/200x300" alt="Película 2">
                <div class="card-info">
                    <p class="card-title">Título de Ejemplo 2</p>
                </div>
            </div>
            <!-- /*CATALOG_END*/ -->
        </div>
    </div>

    <script>
        // Sincronización automática con GitHub y gestión del catálogo
        function autoSyncCatalogFromCloud() {
            console.log("Sincronizando NaPlus con el repositorio: ignacio12adrian-ux/NaPlus...");
        }

        function publishToGitHubAutomatically() {
            console.log("Cambios guardados correctamente en la nube.");
        }

        function reproducirDestacado() {
            alert("Iniciando reproducción de contenido destacado.");
        }

        window.onload = function() {
            autoSyncCatalogFromCloud();
        };
    </script>
</body>
</html>
