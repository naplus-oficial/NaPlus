<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Plataforma Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 72px;
      padding: 0 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 6, 18, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      border-bottom: 1px solid var(--border-purple);
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 35px;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .nav-links {
      display: flex;
      gap: 25px;
      list-style: none;
    }

    .nav-links li a {
      color: var(--text-gray);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .nav-links li a:hover, .nav-links li a.active {
      color: var(--accent-light);
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-creator {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.2), rgba(192, 132, 252, 0.1));
      border: 1px solid var(--accent-purple);
      color: var(--text-white);
      padding: 9px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-creator:hover {
      background: var(--accent-purple);
      box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
    }

    .creator-badge {
      display: none;
      background: var(--accent-purple);
      color: #fff;
      font-size: 0.75rem;
      padding: 5px 10px;
      border-radius: 6px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .hero {
      position: relative;
      height: 70vh;
      margin-top: 72px;
      background: linear-gradient(180deg, rgba(10, 6, 18, 0.4) 0%, var(--bg-dark) 100%),
                  url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1600') center/cover;
      display: flex;
      align-items: flex-end;
      padding: 0 5% 60px 5%;
    }

    .hero-content {
      max-width: 650px;
      z-index: 2;
    }

    .hero-title {
      font-size: 3.2rem;
      font-weight: 800;
      margin-bottom: 15px;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    .hero-desc {
      font-size: 1.1rem;
      color: var(--text-gray);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-play {
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-play:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(124, 58, 237, 0.6);
    }

    .content-section {
      padding: 30px 5%;
    }

    .section-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background: var(--accent-purple);
      border-radius: 2px;
    }

    .row-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
      margin-bottom: 50px;
    }

    .movie-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 2/3;
      background-color: var(--card-bg);
      border: 1px solid var(--border-purple);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-light);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.35);
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(10, 6, 18, 0.95) 100%);
      padding: 18px 15px 15px 15px;
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .movie-card:hover .card-overlay {
      opacity: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-gray);
      display: flex;
      justify-content: space-between;
    }

    .player-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000;
      z-index: 3000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .btn-close-player {
      position: absolute;
      top: 25px;
      right: 35px;
      background: rgba(20, 13, 36, 0.8);
      color: #fff;
      border: 1px solid var(--border-purple);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      z-index: 3100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-close-player:hover {
      background: var(--accent-purple);
    }

    .admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 6, 18, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .admin-form-box {
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
      border: 1px solid var(--border-purple);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .admin-form-box h2 {
      margin-bottom: 20px;
      font-size: 1.5rem;
      color: var(--accent-light);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-bottom: 8px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      background: rgba(10, 6, 18, 0.6);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent-light);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 25px;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-gray);
      border: none;
      padding: 10px 18px;
      cursor: pointer;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .input-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .input-toggle button {
      flex: 1;
      padding: 8px;
      background: rgba(10, 6, 18, 0.6);
      border: 1px solid var(--border-purple);
      color: var(--text-gray);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .input-toggle button.active {
      background: var(--accent-purple);
      color: #fff;
      border-color: var(--accent-purple);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <div class="logo">NaPlus</div>
      <ul class="nav-links">
        <li><a href="#moviesSection" class="active">Películas</a></li>
        <li><a href="#seriesSection">Series</a></li>
      </ul>
    </div>
    <div class="user-controls">
      <span class="creator-badge" id="creatorBadge">Modo Creador Activo</span>
      <button class="btn-creator" id="btnAdmin" onclick="handleCreatorAccess()">Modo Creador</button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-content">
      <h1 class="hero-title" id="featuredTitle">NaPlus Streaming</h1>
      <p class="hero-desc" id="featuredDesc">Disfrutá de las películas y series exclusivas en alta calidad.</p>
      <button class="btn-play" onclick="playFeatured()">▶ Reproducir Ahora</button>
    </div>
  </div>

  <div class="content-section">
    <div id="moviesSection">
      <h2 class="section-header">Películas</h2>
      <div class="row-container" id="moviesGrid"></div>
    </div>

    <div id="seriesSection">
      <h2 class="section-header">Series</h2>
      <div class="row-container" id="seriesGrid"></div>
    </div>
  </div>

  <div class="player-modal" id="playerModal">
    <button class="btn-close-player" onclick="closePlayer()">✕</button>
    <div id="mediaContainer" style="width:100%; height:100%;"></div>
  </div>

  <div class="admin-modal" id="adminModal">
    <div class="admin-form-box">
      <h2>Publicar Contenido (NaPlus)</h2>
      <form id="uploadForm" onsubmit="saveContent(event)">
        <div class="form-group">
          <label>Tipo de Contenido</label>
          <select id="contentType">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Nombre de la obra">
        </div>
        <div class="form-group">
          <label>Género</label>
          <input type="text" id="genreInput" required placeholder="Acción, Drama, Comedia">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required placeholder="2026">
        </div>
        
        <div class="form-group">
          <label>Portada (Imagen)</label>
          <div class="input-toggle">
            <button type="button" id="btnCoverFile" class="active" onclick="toggleCoverInput('file')">Subir de Galería</button>
            <button type="button" id="btnCoverUrl" onclick="toggleCoverInput('url')">Enlace URL</button>
          </div>
          <input type="file" id="coverFileInput" accept="image/*">
          <input type="url" id="coverUrlInput" placeholder="https://ejemplo.com/imagen.jpg" style="display:none;">
        </div>

        <div class="form-group">
          <label>Archivo de Video</label>
          <div class="input-toggle">
            <button type="button" id="btnVideoFile" class="active" onclick="toggleVideoInput('file')">Subir Archivo Local</button>
            <button type="button" id="btnVideoUrl" onclick="toggleVideoInput('url')">Enlace Nube / Servidor</button>
          </div>
          <input type="file" id="videoFileInput" accept="video/*">
          <input type="url" id="videoUrlInput" placeholder="Enlace directo o servidor de video" style="display:none;">
        </div>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeAdminModal()">Cancelar</button>
          <button type="submit" class="btn-submit">Publicar en NaPlus</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let isCreatorMode = false;
    let coverSourceType = 'file';
    let videoSourceType = 'file';

    let catalog = JSON.parse(localStorage.getItem('naPlus_catalog')) || [
      {
        id: 1,
        type: 'movie',
        title: 'Película Destacada',
        genre: 'Aventura / Acción',
        year: '2026',
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=800',
        videoUrl: ''
      },
      {
        id: 2,
        type: 'series',
        title: 'Serie Principal - Episodio 1',
        genre: 'Drama / Misterio',
        year: '2026',
        cover: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=800',
        videoUrl: ''
      }
    ];

    function toggleCoverInput(type) {
      coverSourceType = type;
      if(type === 'file') {
        document.getElementById('coverFileInput').style.display = 'block';
        document.getElementById('coverUrlInput').style.display = 'none';
        document.getElementById('btnCoverFile').classList.add('active');
        document.getElementById('btnCoverUrl').classList.remove('active');
      } else {
        document.getElementById('coverFileInput').style.display = 'none';
        document.getElementById('coverUrlInput').style.display = 'block';
        document.getElementById('btnCoverFile').classList.remove('active');
        document.getElementById('btnCoverUrl').classList.add('active');
      }
    }

    function toggleVideoInput(type) {
      videoSourceType = type;
      if(type === 'file') {
        document.getElementById('videoFileInput').style.display = 'block';
        document.getElementById('videoUrlInput').style.display = 'none';
        document.getElementById('btnVideoFile').classList.add('active');
        document.getElementById('btnVideoUrl').classList.remove('active');
      } else {
        document.getElementById('videoFileInput').style.display = 'none';
        document.getElementById('videoUrlInput').style.display = 'block';
        document.getElementById('btnVideoFile').classList.remove('active');
        document.getElementById('btnVideoUrl').classList.add('active');
      }
    }

    function renderCatalog() {
      const moviesGrid = document.getElementById('moviesGrid');
      const seriesGrid = document.getElementById('seriesGrid');

      moviesGrid.innerHTML = '';
      seriesGrid.innerHTML = '';

      catalog.forEach(item => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => openPlayer(item);

        card.innerHTML = `
          <img src="${item.cover}" alt="${item.title}">
          <div class="card-overlay">
            <div class="card-title">${item.title}</div>
            <div class="card-meta">
              <span>${item.genre}</span>
              <span>${item.year}</span>
            </div>
          </div>
        `;

        if (item.type === 'movie') {
          moviesGrid.appendChild(card);
        } else {
          seriesGrid.appendChild(card);
        }
      });
    }

    function handleCreatorAccess() {
      if (!isCreatorMode) {
        const code = prompt("Ingresá la clave de acceso de creador:");
        if (code === "9009") {
          isCreatorMode = true;
          document.getElementById('creatorBadge').style.display = 'inline-block';
          document.getElementById('btnAdmin').innerText = "+ Subir Video";
          openAdminModal();
        } else if (code !== null) {
          alert("Clave incorrecta. Acceso denegado.");
        }
      } else {
        openAdminModal();
      }
    }

    function openAdminModal() {
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = 'none';
      document.getElementById('uploadForm').reset();
      toggleCoverInput('file');
      toggleVideoInput('file');
    }

    function saveContent(e) {
      e.preventDefault();

      const type = document.getElementById('contentType').value;
      const title = document.getElementById('titleInput').value;
      const genre = document.getElementById('genreInput').value;
      const year = document.getElementById('yearInput').value;
      
      let coverUrl = '';
      if(coverSourceType === 'file') {
        const coverFile = document.getElementById('coverFileInput').files[0];
        if(!coverFile) { alert("Por favor seleccioná una imagen de portada."); return; }
        coverUrl = URL.createObjectURL(coverFile);
      } else {
        coverUrl = document.getElementById('coverUrlInput').value;
        if(!coverUrl) { alert("Por favor ingresá un enlace de portada."); return; }
      }

      let videoUrl = '';
      if(videoSourceType === 'file') {
        const videoFile = document.getElementById('videoFileInput').files[0];
        if(!videoFile) { alert("Por favor seleccioná un archivo de video."); return; }
        videoUrl = URL.createObjectURL(videoFile);
      } else {
        videoUrl = document.getElementById('videoUrlInput').value;
        if(!videoUrl) { alert("Por favor ingresá un enlace de video."); return; }
      }

      const newItem = {
        id: Date.now(),
        type,
        title,
        genre,
        year,
        cover: coverUrl,
        videoUrl: videoUrl
      };

      catalog.unshift(newItem);
      
      try {
        localStorage.setItem('naPlus_catalog', JSON.stringify(catalog));
      } catch(err) {
        console.warn("Almacenamiento temporal activo.");
      }

      renderCatalog();
      closeAdminModal();

      document.getElementById('featuredTitle').innerText = newItem.title;
      document.getElementById('featuredDesc').innerText = `${newItem.genre} (${newItem.year})`;

      openPlayer(newItem);
    }

    function openPlayer(item) {
      const playerModal = document.getElementById('playerModal');
      const mediaContainer = document.getElementById('mediaContainer');

      if (item.videoUrl) {
        if(item.videoUrl.includes('youtube.com') || item.videoUrl.includes('youtu.be')) {
          let embedUrl = item.videoUrl.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
          mediaContainer.innerHTML = `<iframe src="${embedUrl}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else {
          mediaContainer.innerHTML = `<video src="${item.videoUrl}" controls autoplay style="width:100%; height:100%; object-fit:contain;"></video>`;
        }
        playerModal.style.display = 'flex';
      } else {
        alert("Activá el modo Creador (clave 9009) para subir o vincular tus videos.");
      }
    }

    function closePlayer() {
      const playerModal = document.getElementById('playerModal');
      const mediaContainer = document.getElementById('mediaContainer');
      mediaContainer.innerHTML = '';
      playerModal.style.display = 'none';
    }

    function playFeatured() {
      if (catalog.length > 0) {
        openPlayer(catalog[0]);
      }
    }

    renderCatalog();
  </script>
</body>
    </html>
