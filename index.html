<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StreamApp - Open Source Template</title>
<style>
  :root {
    --bg-base: #121212;
    --bg-surface: #1e1e1e;
    --accent: #e50914;
    --text-main: #ffffff;
    --text-sec: #b3b3b3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-base); color: var(--text-main); padding-bottom: 70px; }

  header { position: sticky; top: 0; background: rgba(18,18,18,0.95); backdrop-filter: blur(8px); padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid #282828; }
  .logo { font-size: 1.25rem; font-weight: 800; color: var(--accent); letter-spacing: 1px; }

  .container { padding: 15px; }
  .search-bar { width: 100%; padding: 12px; background: var(--bg-surface); border: 1px solid #333; color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none; margin-bottom: 20px; }
  .search-bar:focus { border-color: var(--accent); }

  h2 { font-size: 1.1rem; margin-bottom: 12px; font-weight: 600; color: var(--text-main); }
  
  .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
  .media-card { background: var(--bg-surface); border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; }
  .media-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  .media-card-title { padding: 6px; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Bottom Navigation */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-surface); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #282828; z-index: 1000; }
  .nav-link { background: none; border: none; color: var(--text-sec); font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 50%; }
  .nav-link.active { color: var(--accent); }
  .nav-link span { font-size: 1.2rem; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; }

  /* Player Screen */
  .player-screen { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; }
  .player-screen.active { display: flex; }
  .player-nav { padding: 15px; display: flex; align-items: center; background: rgba(0,0,0,0.7); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
  .back-btn { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; margin-right: 15px; }
  .player-box { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .player-box video, .player-box iframe { width: 100%; height: 100%; border: none; object-fit: contain; }
  .player-meta { padding: 15px; background: var(--bg-surface); max-height: 35vh; overflow-y: auto; }
</style>
</head>
<body>

  <header>
    <div class="logo">STREAMBOX</div>
  </header>

  <!-- Vista Principal -->
  <div id="homeView" class="view active container">
    <input type="search" class="search-bar" id="searchInput" placeholder="Explorar catálogos..." oninput="filterMedia()">
    
    <h2>Tendencias Actuales</h2>
    <div class="media-grid" id="catalogGrid"></div>
  </div>

  <!-- Vista Favoritos / Lista -->
  <div id="listView" class="view container">
    <h2>Mi Biblioteca</h2>
    <div class="media-grid" id="listGrid"></div>
  </div>

  <!-- Navegación Inferior -->
  <nav class="bottom-nav">
    <button class="nav-link active" onclick="switchTab('home', this)"><span>🏠</span>Inicio</button>
    <button class="nav-link" onclick="switchTab('list', this)"><span>⭐</span>Guardados</button>
  </nav>

  <!-- Reproductor Exclusivo -->
  <div class="player-screen" id="playerModal">
    <div class="player-nav">
      <button class="back-btn" onclick="closePlayer()">✕</button>
      <h3 id="modalTitle" style="font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h3>
    </div>
    <div class="player-box" id="playerContainer"></div>
    <div class="player-meta">
      <h3 id="modalName" style="font-size: 1rem; margin-bottom: 4px;"></h3>
      <p id="modalDesc" style="color: var(--text-sec); font-size: 0.8rem; line-height: 1.3;"></p>
      <button onclick="toggleFav()" id="favBtn" style="margin-top: 12px; width:100%; padding: 10px; background: var(--accent); color:#fff; border:none; border-radius:4px; font-weight:bold; font-size:0.85rem; cursor:pointer;">Guardar en Biblioteca</button>
    </div>
  </div>

<script>
  // Base de datos de ejemplo abierta
  const database = [
    { id: 1, title: "Open Source Movie 1", desc: "Contenido multimedia libre de pruebas para reproducción web.", cover: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
    { id: 2, title: "Elephant Dream HD", desc: "Cortometraje de código abierto alojado en servidores públicos de prueba.", cover: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=400", video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" }
  ];

  let currentId = null;
  let savedList = JSON.parse(localStorage.getItem('open_source_favs')) || [];

  function renderGrid(items, elementId) {
    const grid = document.getElementById(elementId);
    grid.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'media-card';
      card.onclick = () => openPlayer(item.id);
      card.innerHTML = `
        <img src="${item.cover}" alt="${item.title}">
        <div class="media-card-title">${item.title}</div>
      `;
      grid.appendChild(card);
    });
  }

  function filterMedia() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = database.filter(i => i.title.toLowerCase().includes(q));
    renderGrid(filtered, 'catalogGrid');
  }

  function switchTab(tab, btn) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
    btn.classList.add('active');
    if(tab === 'home') {
      document.getElementById('homeView').classList.add('active');
      renderGrid(database, 'catalogGrid');
    } else {
      document.getElementById('listView').classList.add('active');
      const favItems = database.filter(i => savedList.includes(i.id));
      renderGrid(favItems, 'listGrid');
    }
  }

  function openPlayer(id) {
    currentId = id;
    const item = database.find(x => x.id === id);
    if(!item) return;

    document.getElementById('modalTitle').textContent = item.title;
    document.getElementById('modalName').textContent = item.title;
    document.getElementById('modalDesc').textContent = item.desc;
    updateFavButton();

    const container = document.getElementById('playerContainer');
    container.innerHTML = `<video src="${item.video}" controls autoplay playsinline style="width:100%; height:100%;"></video>`;
    
    document.getElementById('playerModal').classList.add('active');
  }

  function closePlayer() {
    document.getElementById('playerContainer').innerHTML = '';
    document.getElementById('playerModal').classList.remove('active');
  }

  function updateFavButton() {
    const btn = document.getElementById('favBtn');
    if(savedList.includes(currentId)) {
      btn.textContent = "Eliminar de Biblioteca";
      btn.style.background = "#333";
    } else {
      btn.textContent = "Guardar en Biblioteca";
      btn.style.background = "var(--accent)";
    }
  }

  function toggleFav() {
    const index = savedList.indexOf(currentId);
    if(index > -1) {
      savedList.splice(index, 1);
    } else {
      savedList.push(currentId);
    }
    localStorage.setItem('open_source_favs', JSON.stringify(savedList));
    updateFavButton();
  }

  // Inicializar vista inicial
  renderGrid(database, 'catalogGrid');
</script>
</body>
</html>
