<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 70px;
      padding-bottom: 40px;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      padding: 0 15px;
      background: #0a0612;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(124, 58, 237, 0.3);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent-light);
    }

    .btn-creator {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      padding: 20px 15px;
      background: linear-gradient(180deg, #140d24 0%, #0a0612 100%);
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .hero p {
      font-size: 0.9rem;
      color: var(--text-gray);
    }

    .section-title {
      font-size: 1.2rem;
      margin: 20px 15px 10px;
      color: var(--accent-light);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(124, 58, 237, 0.2);
      cursor: pointer;
      position: relative;
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .card-info {
      padding: 8px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--text-gray);
    }

    .admin-btns {
      display: none;
      position: absolute;
      top: 5px; right: 5px;
      gap: 4px;
    }

    body.creator-active .admin-btns {
      display: flex;
    }

    .admin-btns button {
      background: rgba(0,0,0,0.8);
      border: none;
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--accent-purple);
    }

    .modal-box h3 {
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0a0612;
      border: 1px solid var(--accent-purple);
      color: #fff;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-gray);
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn-submit {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
    }

    .video-container video, .video-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NaPlus</div>
    <button class="btn-creator" id="btnAdmin" onclick="handleCreatorClick()">Modo Creador</button>
  </header>

  <div class="hero">
    <h1>NaPlus Streaming</h1>
    <p>Peliculas y series caseras en un solo lugar.</p>
  </div>

  <div class="section-title">Películas</div>
  <div class="grid" id="moviesGrid"></div>

  <div class="section-title">Series</div>
  <div class="grid" id="seriesGrid"></div>

  <!-- Modal Detalle / Reproductor -->
  <div class="modal" id="detailModal">
    <div class="modal-box">
      <div class="video-container" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color:var(--accent-light); font-size:0.85rem; margin-bottom:8px;"></p>
      <p id="detailDesc" style="color:var(--text-gray); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('detailModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Acceso Creador -->
  <div class="modal" id="loginModal">
    <div class="modal-box">
      <h3>Acceso Creador</h3>
      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Clave o Token de GitHub</label>
          <input type="password" id="passInput" placeholder="9009 o ghp_..." required>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('loginModal')">Cancelar</button>
          <button type="submit" class="btn-submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Subir/Editar -->
  <div class="modal" id="uploadModal">
    <div class="modal-box">
      <h3 id="formTitle">Subir Contenido</h3>
      <form onsubmit="submitForm(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo</label>
          <select id="typeInput">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required>
        </div>
        <div class="form-group">
          <label>Género</label>
          <input type="text" id="genreInput" required>
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required>
        </div>
        <div class="form-group">
          <label>Descripción / Sinopsis</label>
          <textarea id="descInput" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>URL de Imagen de Portada</label>
          <input type="url" id="coverInput" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>URL del Video (MP4, YouTube, Telegram...)</label>
          <input type="url" id="videoInput" placeholder="https://..." required>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "index.html";

    // CATÁLOGO BASE
    let catalog = [
      {
        id: 1,
        type: 'movie',
        title: 'Película de Prueba',
        genre: 'Terror',
        year: '2026',
        desc: 'Película de muestra para NaPlus.',
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400',
        video: 'https://www.w3schools.com/html/mov_bbb.mp4'
      }
    ];

    let isCreator = false;

    function renderCatalog() {
      const mGrid = document.getElementById('moviesGrid');
      const sGrid = document.getElementById('seriesGrid');
      mGrid.innerHTML = '';
      sGrid.innerHTML = '';

      catalog.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openDetail(item.id);

        card.innerHTML = `
          <div class="admin-btns">
            <button onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
            <button onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
          </div>
          <img src="${item.cover}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Portada'">
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-sub">${item.genre} • ${item.year}</div>
          </div>
        `;

        if (item.type === 'movie') mGrid.appendChild(card);
        else sGrid.appendChild(card);
      });
    }

    function handleCreatorClick() {
      if (isCreator) {
        openUploadModal();
      } else {
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'detailModal') {
        document.getElementById('videoBox').innerHTML = '';
      }
    }

    function submitLogin(e) {
      e.preventDefault();
      const val = document.getElementById('passInput').value.trim();
      if (val === "9009" || val.startsWith("ghp_")) {
        if (val.startsWith("ghp_")) {
          localStorage.setItem('naPlus_gh_token', val);
        }
        isCreator = true;
        document.body.classList.add('creator-active');
        document.getElementById('btnAdmin').innerText = '+ Agregar';
        closeModal('loginModal');
        openUploadModal();
      } else {
        alert("Clave o token incorrecto.");
      }
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item ? item.video : '';
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta película/serie?")) {
        catalog = catalog.filter(x => x.id != id);
        renderCatalog();
        await publishToGitHub();
      }
    }

    async function submitForm(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: document.getElementById('typeInput').value,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      renderCatalog();
      closeModal('uploadModal');
      await publishToGitHub();
    }

    async function publishToGitHub() {
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) {
        token = prompt("Para publicar los cambios globalmente a todos los usuarios, ingresá tu Token de GitHub (ghp_...):");
        if (token && token.startsWith("ghp_")) {
          localStorage.setItem('naPlus_gh_token', token.trim());
        } else {
          alert("Cambios guardados solo localmente. Para actualizar la web global, ingresá el token.");
          return;
        }
      }

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`);
        const getData = await getRes.json();
        const sha = getData.sha;

        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        const catalogJson = JSON.stringify(catalog, null, 2);
        fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${catalogJson};`);

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Actualización catálogo NaPlus',
            content: updatedBase64,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert("¡Publicado globalmente! En 1 minuto le aparecerá a todo el mundo.");
        } else {
          alert("Error al sincronizar con GitHub. Verificá tu Token.");
        }
      } catch (err) {
        alert("Error de conexión al guardar.");
      }
    }

    function openDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;

      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
      document.getElementById('detailDesc').innerText = item.desc || 'Sin descripción.';

      const vBox = document.getElementById('videoBox');
      if (item.video.includes('youtube.com') || item.video.includes('youtu.be')) {
        let embed = item.video.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
        vBox.innerHTML = `<iframe src="${embed}" allowfullscreen></iframe>`;
      } else {
        vBox.innerHTML = `<video src="${item.video}" controls autoplay poster="${item.cover}"></video>`;
      }

      document.getElementById('detailModal').style.display = 'flex';
    }

    renderCatalog();
  </script>
</body>
</html>
