<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    button {
      transition: transform 0.15s ease;
    }
    button:active { transform: scale(0.94); }

    @keyframes imgFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes overlayFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes modalPop {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 65px;
      padding-bottom: 70px;
    }

    /* BARRA SUPERIOR */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      padding: 0 15px;
      background: rgba(10, 6, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid var(--border-purple);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-creator {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* NAVEGACIÓN INFERIOR */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10, 6, 18, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-purple);
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      width: 25%;
    }

    .nav-item span { font-size: 1.2rem; }
    .nav-item.active { color: var(--accent-light); font-weight: bold; }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; }
    .view-section.active { display: block; }

    /* CARRUSEL PRINCIPAL ESTILO HBO */
    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 420px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .hbo-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      background-size: cover;
      background-position: center;
    }

    .hbo-slide.active { opacity: 1; z-index: 2; }

    .hbo-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,6,18,0.2) 0%, rgba(10,6,18,0.7) 60%, var(--bg-dark) 100%);
    }

    .hbo-slide-content {
      position: relative;
      z-index: 3;
      text-align: left;
    }

    .hbo-slide-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .hbo-slide-meta {
      font-size: 0.85rem;
      color: var(--accent-light);
      margin-bottom: 12px;
    }

    .hbo-slide-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hbo-btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(5px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      width: 42px; height: 42px;
      border-radius: 6px;
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .hbo-slider-dots {
      position: absolute;
      bottom: 12px; right: 20px;
      z-index: 10;
      display: flex;
      gap: 6px;
    }

    .hbo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: background 0.3s, width 0.3s;
    }
    .hbo-dot.active { background: #fff; width: 20px; border-radius: 4px; }

    /* HERO & BUSCADOR */
    .hero {
      padding: 15px;
      margin-bottom: 10px;
    }

    .search-box { width: 100%; max-width: 500px; }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 6, 18, 0.8);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .search-box input:focus { border-color: var(--accent-light); }

    /* SCROLL HORIZONTAL */
    .section-title {
      font-size: 1.1rem;
      margin: 20px 15px 10px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px; height: 15px;
      background: var(--accent-purple);
      border-radius: 2px;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 15px 10px 15px;
      scrollbar-width: none;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 120px; width: 120px; flex-shrink: 0; scroll-snap-align: start; }

    /* GRILLAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-purple);
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.97); }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #000;
      pointer-events: none;
      animation: imgFadeIn 0.35s ease;
    }

    .card-info { padding: 8px; pointer-events: none; }
    .card-title { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.7rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute;
      top: 5px; left: 5px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border-purple);
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }

    .admin-btns {
      display: none;
      position: absolute;
      top: 5px; right: 5px;
      gap: 4px;
      z-index: 10;
    }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--accent-purple);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      padding: 20px;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: overlayFadeIn 0.2s ease;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%; max-width: 500px;
      border: 1px solid var(--border-purple);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalPop 0.25s ease;
    }

    /* MODAL AMPLIO ESTILO HBO PARA SERIES */
    .modal-box-series {
      background: #000;
      padding: 0;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      position: fixed;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      z-index: 2100;
      display: none;
      animation: modalPop 0.25s ease;
    }

    .btn-close {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0,0,0,0.6);
      color: #fff; border: 1px solid rgba(255,255,255,0.2);
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer;
      z-index: 2250;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-box h3 { margin-bottom: 12px; padding-right: 30px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-gray); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px;
      background: #0a0612; border: 1px solid var(--border-purple);
      color: #fff; border-radius: 6px; font-size: 0.95rem; outline: none;
      transition: border-color 0.2s ease;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-light); }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* ESTILO ENCABEZADO CON PORTADA DE FONDO Y GRADIENTE HBO */
    .hbo-backdrop-header {
      position: relative;
      width: 100%;
      min-height: 240px;
      padding: 50px 20px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
    }
    .hbo-backdrop-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 70%, #000 100%);
    }
    .hbo-header-content {
      position: relative;
      z-index: 2;
    }
    .hbo-header-content h2 { font-size: 1.5rem; margin-bottom: 6px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .hbo-header-content p { font-size: 0.85rem; color: #d1d5db; margin-bottom: 4px; }
    
    /* SINOPSIS CON LEER MÁS */
    .synopsis-container {
      font-size: 0.85rem;
      color: var(--text-gray);
      line-height: 1.4;
      margin-top: 4px;
    }
    .synopsis-text.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .read-more-btn {
      background: none;
      border: none;
      color: var(--accent-light);
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
      margin-top: 2px;
      display: inline-block;
    }

    .season-selector-container {
      padding: 0 15px;
      margin-bottom: 20px;
    }
    .season-selector-hbo {
      background: #141414;
      border: 1px solid #333;
      color: #fff;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      width: 100%;
      outline: none;
    }

    .hbo-episodes-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0 15px 40px;
    }

    .hbo-ep-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hbo-ep-row {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .hbo-ep-row:active { transform: scale(0.98); }

    .hbo-thumb {
      width: 140px;
      height: 80px;
      object-fit: cover;
      border-radius: 4px;
      background: #1f1f1f;
      flex-shrink: 0;
      position: relative;
    }
    .hbo-thumb img { animation: imgFadeIn 0.35s ease; }

    .hbo-play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1.2rem;
    }

    .hbo-ep-details {
      flex-grow: 1;
      overflow: hidden;
    }

    .hbo-ep-title {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }

    .hbo-ep-desc {
      font-size: 0.8rem;
      color: var(--text-gray);
      line-height: 1.4;
    }

    .hbo-edit-btn {
      display: none;
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 4px;
    }
    body.creator-mode .hbo-edit-btn { display: inline-block; }

    /* REPRODUCTOR */
    .video-box {
      width: 100%; aspect-ratio: 16/9; background: #000;
      margin-bottom: 12px; border-radius: 8px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .video-box iframe { width: 100%; height: 100%; border: none; }
    .empty-msg { font-size: 0.85rem; color: var(--text-gray); padding: 0 15px; font-style: italic; }

    /* GESTOR DE EPISODIOS EN ADMIN */
    .admin-episode-card {
      background: #0a0612;
      border: 1px solid var(--border-purple);
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
    <div class="header-actions">
      <button class="btn-creator" id="btnCreator" onclick="handleCreatorClick()">Modo Creador</button>
    </div>
  </header>

  <!-- VISTA INICIO -->
  <div id="viewHome" class="view-section active">
    
    <!-- CARRUSEL HERO ESTILO HBO -->
    <div class="hbo-hero-slider" id="hboHeroSlider">
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>

    <div class="hero">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar película o serie..." oninput="handleSearch()">
      </div>
    </div>

    <!-- Resultados de Búsqueda -->
    <div id="searchResultsContainer" style="display: none;">
      <div class="section-title">Resultados de Búsqueda</div>
      <div class="grid" id="searchGrid"></div>
    </div>

    <!-- Contenido Principal -->
    <div id="mainHomeContent">
      <div class="section-title">🔥 Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

      <div class="section-title">⭐ Top 10 Más Vistas</div>
      <div class="horizontal-scroll" id="topScroll"></div>

      <div id="genreRowsContainer"></div>
    </div>
  </div>

  <!-- VISTA PELÍCULAS -->
  <div id="viewMovies" class="view-section">
    <div class="section-title" style="margin-top: 25px;">🎬 Películas</div>

    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll" id="moviesTopScroll"></div>

    <div id="moviesGenreRowsContainer"></div>

    <div class="section-title">Todas las Películas</div>
    <div class="grid" id="moviesGrid"></div>
  </div>

  <!-- VISTA SERIES -->
  <div id="viewSeries" class="view-section">
    <div class="section-title" style="margin-top: 25px;">📺 Series</div>

    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll" id="seriesTopScroll"></div>

    <div id="seriesGenreRowsContainer"></div>

    <div class="section-title">Todas las Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <!-- VISTA MI LISTA -->
  <div id="viewList" class="view-section">
    <div class="section-title" style="margin-top: 25px;">🔖 Mi Lista - Guardados</div>
    <div class="grid" id="myListGrid"></div>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')"><span>🏠</span>Inicio</button>
    <button class="nav-item" id="navMovies" onclick="switchView('movies')"><span>🎬</span>Películas</button>
    <button class="nav-item" id="navSeries" onclick="switchView('series')"><span>📺</span>Series</button>
    <button class="nav-item" id="navList" onclick="switchView('list')"><span>🔖</span>Mi Lista</button>
  </nav>

  <!-- MODAL REPRODUCTOR PELÍCULA -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('detailModal')">✕</button>
      <div class="video-box" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color:var(--accent-light); font-size:0.85rem; margin-bottom:8px;"></p>
      <p id="detailViews" style="color:var(--text-gray); font-size:0.75rem; margin-bottom:6px;"></p>
      <p id="detailDesc" style="color:var(--text-gray); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('detailModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- VISTA DE SERIE ESTILO HBO (PANTALLA COMPLETA CON BACKDROP DE FONDO) -->
  <div class="modal-box-series" id="seriesModal">
    <button class="btn-close" onclick="closeModal('seriesModal')">✕</button>
    
    <div class="hbo-backdrop-header" id="hboBackdropHeader">
      <div class="hbo-backdrop-overlay"></div>
      <div class="hbo-header-content">
        <h2 id="seriesTitle"></h2>
        <p id="seriesMeta" style="color:var(--accent-light);"></p>
        <p id="seriesViews" style="font-size:0.75rem; color:#cbd5e1;"></p>
        <div class="synopsis-container">
          <div class="synopsis-text truncated" id="seriesDesc"></div>
          <button class="read-more-btn" id="readMoreBtn" onclick="toggleSynopsis()" style="display: none;">Leer más</button>
        </div>
      </div>
    </div>

    <div style="max-width: 700px; margin: 0 auto;">
      <div class="season-selector-container">
        <select id="seasonSelect" class="season-selector-hbo" onchange="renderEpisodesForSelectedSeason()"></select>
      </div>
      <div class="hbo-episodes-list" id="episodesListContainer"></div>
    </div>
  </div>

  <!-- MODAL REPRODUCTOR DE EPISODIO -->
  <div class="modal-overlay" id="episodeModal" style="z-index: 2500;">
    <div class="modal-box" style="max-width: 600px;">
      <button class="btn-close" onclick="closeEpisodePlayer()">✕</button>
      <div class="video-box" id="episodeVideoBox"></div>
      <h3 id="epModalTitle"></h3>
      <p id="epModalDesc" style="color:var(--text-gray); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeEpisodePlayer()">Volver a Episodios</button>
      </div>
    </div>
  </div>

  <!-- MODAL ACCESO CREADOR -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('loginModal')">✕</button>
      <h3>Acceso Creador</h3>
      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Ingresá tu credencial o Token de GitHub (ghp_...)</label>
          <input type="password" id="passInput" placeholder="Clave 9009 o Token..." required autocomplete="off">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('loginModal')">Cancelar</button>
          <button type="submit" class="btn-submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL SUBIR / EDITAR CONTENIDO -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('uploadModal')">✕</button>
      <h3 id="formTitle">Subir Contenido</h3>
      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo de Contenido</label>
          <select id="typeInput" onchange="toggleContentTypeFields()">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Nombre">
        </div>
        <div class="form-group">
          <label>Géneros (separados por coma)</label>
          <input type="text" id="genreInput" required placeholder="Acción, Terror">
        </div>

    const localDb = JSON.parse(localStorage.getItem('naPlus_permanent_db'));
    if (Array.isArray(localDb) && localDb.length > 0) {
      catalog = localDb;
    } else {
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
    }

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = localStorage.getItem('naPlus_is_creator_active') === 'true';

    if (isCreatorMode) {
      document.body.classList.add('creator-mode');
      const btnC = document.getElementById('btnCreator');
      if(btnC) btnC.innerText = '+ Agregar';
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
        renderHomeSections();
      } else if (viewName === 'movies') {
        document.getElementById('viewMovies').classList.add('active');
        document.getElementById('navMovies').classList.add('active');
        renderMoviesGrid();
      } else if (viewName === 'series') {
        document.getElementById('viewSeries').classList.add('active');
        document.getElementById('navSeries').classList.add('active');
        renderSeriesGrid();
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
        renderMyList();
      }
      window.scrollTo(0, 0);
    }

    function toggleFavorite(id, e) {
      e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
    }

    let currentSlide = 0;
    let sliderInterval = null;

    function renderHeroSlider() {
      const sliderContainer = document.getElementById('hboHeroSlider');
      const dotsContainer = document.getElementById('hboSliderDots');
      
      const recentItems = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).slice(0, 6);
      if (recentItems.length === 0) return;

      const existingSlides = sliderContainer.querySelectorAll('.hbo-slide');
      existingSlides.forEach(s => s.remove());
      dotsContainer.innerHTML = '';

      recentItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = `hbo-slide ${idx === 0 ? 'active' : ''}`;
        slide.style.backgroundImage = `url('${item.cover}')`;
        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">Recientemente añadido • ${item.year} • ${item.genre.split(',')[0]}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="openContentDetail(${item.id})">▶ Ver ahora</button>
              <button class="hbo-btn-add" onclick="toggleFavorite(${item.id}, event)">${myFavorites.includes(item.id) ? '❤️' : '+'}</button>
            </div>
          </div>
        `;
        sliderContainer.insertBefore(slide, dotsContainer);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(idx);
        dotsContainer.appendChild(dot);
      });

      if (sliderInterval) clearInterval(sliderInterval);
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % recentItems.length;
        goToSlide(currentSlide);
      }, 5000);
    }

    function goToSlide(idx) {
      currentSlide = idx;

    function renderHomeSections() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const searchContainer = document.getElementById('searchResultsContainer');
      const mainContent = document.getElementById('mainHomeContent');
      const heroSlider = document.getElementById('hboHeroSlider');

      if (query.length > 0) {
        heroSlider.style.display = 'none';
        searchContainer.style.display = 'block';
        mainContent.style.display = 'none';
        const searchGrid = document.getElementById('searchGrid');
        searchGrid.innerHTML = '';
        const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || i.genre.toLowerCase().includes(query));
        if (matches.length > 0) {
          matches.forEach(item => searchGrid.appendChild(createCardElement(item)));
        } else {
          searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
        }
        return;
      } else {
        heroSlider.style.display = 'block';
        searchContainer.style.display = 'none';
        mainContent.style.display = 'block';
        renderHeroSlider();
      }

      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      const recentSorted = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));
      recentSorted.forEach(item => recentScroll.appendChild(createCardElement(item)));

      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      const topSorted = [...catalog].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10);
      topSorted.forEach(item => topScroll.appendChild(createCardElement(item)));

      const genreContainer = document.getElementById('genreRowsContainer');
      genreContainer.innerHTML = '';

      let allIndividualGenres = [];
      catalog.forEach(item => {
        if (item.genre) {
          item.genre.split(',').forEach(g => {
            const cleanG = g.trim();
            if (cleanG && !allIndividualGenres.includes(cleanG)) {
              allIndividualGenres.push(cleanG);
            }
          });
        }
      });
      allIndividualGenres.sort();

      allIndividualGenres.forEach(genre => {
        const genreItems = catalog.filter(i => {
          if (!i.genre) return false;
          const itemGenres = i.genre.split(',').map(x => x.trim().toLowerCase());
          return itemGenres.includes(genre.toLowerCase());
        });

        if (genreItems.length > 0) {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-title';
          titleDiv.innerText = `🎬 ${genre}`;
          
          const scrollDiv = document.createElement('div');
          scrollDiv.className = 'horizontal-scroll';
          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));

          genreContainer.appendChild(titleDiv);
          genreContainer.appendChild(scrollDiv);
        }
      });
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const type = document.getElementById('typeInput').value;

      let seasonsData = [];
      if (type === 'series') {
        const seasonBlocks = document.querySelectorAll('.season-item-block');
        seasonBlocks.forEach(sBlock => {
          const sName = sBlock.querySelector('.season-name').value.trim();
          const epRows = sBlock.querySelectorAll('.ep-item-row');
          let eps = [];
          
          // LECTURA DIRECTA Y ABSOLUTA POR PROPIEDAD NATIVA DE CADA NODO (Evita cruces de memoria)
          epRows.forEach((row, rIdx) => {
            const numInput = row.querySelector('.ep-num');
            const titleInput = row.querySelector('.ep-title');
            const imgInput = row.querySelector('.ep-img');
            const descInput = row.querySelector('.ep-desc');
            const videoInput = row.querySelector('.ep-video');

            eps.push({
              num: numInput ? (parseInt(numInput.value) || (rIdx + 1)) : (rIdx + 1),
              title: titleInput ? titleInput.value.trim() : '',
              img: imgInput ? imgInput.value.trim() : '',
              desc: descInput ? descInput.value.trim() : '',
              video: videoInput ? videoInput.value.trim() : ''
            });
          });

          eps.sort((a, b) => a.num - b.num);
          seasonsData.push({ name: sName, episodes: eps });
        });
      }

      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: type,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: type === 'movie' ? document.getElementById('videoInput').value.trim() : '',
        seasons: type === 'series' ? seasonsData : [],
        views: id ? (catalog.find(x => x.id == id)?.views || 0) : Math.floor(Math.random() * 500) + 50,
        dateAdded: id ? (catalog.find(x => x.id == id)?.dateAdded || Date.now()) : Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
      closeModal('uploadModal');

      await publishToGitHubAutomatically();
    }

    async function publishToGitHubAutomatically() {
      let token = localStorage.getItem('naPlus_gh_token');
      
      if (!token || !token.startsWith('ghp_')) {
        token = prompt("Ingresá tu Token de GitHub (ghp_...) para publicar globalmente:");
        if (token && token.startsWith('ghp_')) {
          token = token.trim();
          localStorage.setItem('naPlus_gh_token', token);
        } else {
          alert("⚠️ Guardado localmente. Ingresá un Token válido cuando desees sincronizar.");
          return;
        }
      }

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Publicando automáticamente...";

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
        });
        
        if (!getRes.ok) {
          alert("❌ Token inválido o expirado.");
          localStorage.removeItem('naPlus_gh_token');
          return;
        }

        const getData = await getRes.json();
        const sha = getData.sha;

        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        const catalogJson = JSON.stringify(catalog, null, 2);
        
        if (fileText.includes('/*CATALOG_START*/')) {
          fileText = fileText.replace(/\/\*CATALOG_START\*\/[\s\S]*?\/\*CATALOG_END\*\//, `/*CATALOG_START*/${catalogJson}/*CATALOG_END*/`);
        } else {
          fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${catalogJson};`);
        }

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Actualización automática NaPlus',
            content: updatedBase64,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert("✅ ¡Éxito! Contenido publicado globalmente.");
        } else {
          alert("❌ Error al actualizar en GitHub.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Error de red.");
      } finally {
        if (saveBtn) saveBtn.innerText = "Guardar y Publicar Automáticamente";
      }
    }

      e.preventDefault();
      const sIdx = parseInt(document.getElementById('editEpSeasonIdx').value);
      const eIdx = parseInt(document.getElementById('editEpItemIdx').value);

      const updatedEp = {
        num: parseInt(document.getElementById('modalEpNum').value) || 1,
        title: document.getElementById('modalEpTitle').value.trim(),
        img: document.getElementById('modalEpImg').value.trim(),
        desc: document.getElementById('modalEpDesc').value.trim(),
        video: document.getElementById('modalEpVideo').value.trim()
      };

      currentSeriesData.seasons[sIdx].episodes[eIdx] = updatedEp;
      currentSeriesData.seasons[sIdx].episodes.sort((a, b) => a.num - b.num);

      const catIdx = catalog.findIndex(x => x.id === currentSeriesData.id);
      if (catIdx !== -1) {
        catalog[catIdx] = currentSeriesData;
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      closeModal('editEpisodeModal');
      openContentDetail(currentSeriesData.id);
      await publishToGitHubAutomatically();
    }

    function playEpisode(seasonIdx, epIdx) {
      const ep = currentSeriesData.seasons[seasonIdx].episodes[epIdx];
      document.getElementById('seriesModal').style.display = 'none';
      const epNumDisplay = ep.num !== undefined ? ep.num : '1';
      document.getElementById('epModalTitle').innerText = `Capítulo ${epNumDisplay}: ${ep.title || ''}`;
      document.getElementById('epModalDesc').innerText = ep.desc || '';
      const vBox = document.getElementById('episodeVideoBox');
      renderVideoInBox(vBox, ep.video);
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function closeEpisodePlayer() {
      document.getElementById('episodeModal').style.display = 'none';
      document.getElementById('episodeVideoBox').innerHTML = '';
      if (currentSeriesData) {
        document.getElementById('seriesModal').style.display = 'block';
      }
    }

    function renderVideoInBox(vBox, vInput) {
      if (!vInput) {
        vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>';
        return;
      }
      if (vInput.includes('<iframe')) {
        vBox.innerHTML = vInput;
        const iframeEl = vBox.querySelector('iframe');
        if (iframeEl) {
          iframeEl.style.width = "100%";
          iframeEl.style.height = "100%";
          iframeEl.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
          iframeEl.setAttribute('allowfullscreen', 'true');
        }
      } else if (vInput.includes('voe.sx')) {
        let embedUrl = vInput;
        if (!vInput.includes('/e/') && !vInput.includes('/embed')) {
          const parts = vInput.split('voe.sx/');
          if (parts[1]) embedUrl = `https://voe.sx/e/${parts[1]}`;
        }
        vBox.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } else if (vInput.includes('ok.ru')) {
        let embedUrl = vInput;
        if (!vInput.includes('videoembed')) {
          const match = vInput.match(/\/video\/([0-9]+)/);
          if (match && match[1]) embedUrl = `https://ok.ru/videoembed/${match[1]}`;
        }
        vBox.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } else {
        vBox.innerHTML = `<video src="${vInput}" controls autoplay></video>`;
      }
    }

    renderHomeSections();
  </script>
</body>
</html>
