<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 65px;
      padding-bottom: 70px;
    }

    /* BARRA SUPERIOR */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      padding: 0 15px;
      background: rgba(10, 6, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid var(--border-purple);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-creator {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* NAVEGACIÓN INFERIOR */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(10, 6, 18, 0.98);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-purple);
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      width: 33.33%;
    }

    .nav-item span { font-size: 1.2rem; }
    .nav-item.active { color: var(--accent-light); font-weight: bold; }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; }
    .view-section.active { display: block; }

    /* HERO & BUSCADOR */
    .hero {
      padding: 20px 15px;
      background: linear-gradient(180deg, #140d24 0%, #0a0612 100%);
      margin-bottom: 10px;
    }

    .hero h1 { font-size: 1.6rem; margin-bottom: 5px; }
    .hero p { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 12px; }

    .search-box { width: 100%; max-width: 500px; }
    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 6, 18, 0.8);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent-light); }

    /* SCROLL HORIZONTAL */
    .section-title {
      font-size: 1.1rem;
      margin: 20px 15px 10px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px; height: 15px;
      background: var(--accent-purple);
      border-radius: 2px;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 15px 10px 15px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 120px; width: 120px; flex-shrink: 0; }

    /* GRILLAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-purple);
      cursor: pointer;
      position: relative;
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #000;
      pointer-events: none;
    }

    .card-info { padding: 8px; pointer-events: none; }
    .card-title { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.7rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute;
      top: 5px; left: 5px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border-purple);
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }

    .admin-btns {
      display: none;
      position: absolute;
      top: 5px; right: 5px;
      gap: 4px;
      z-index: 10;
    }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--accent-purple);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%; max-width: 450px;
      border: 1px solid var(--border-purple);
      position: relative;
    }

    .btn-close {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff; border: none;
      width: 30px; height: 30px; border-radius: 50%;
      font-size: 1rem; cursor: pointer;
    }

    .modal-box h3 { margin-bottom: 12px; padding-right: 30px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-gray); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px;
      background: #0a0612; border: 1px solid var(--border-purple);
      color: #fff; border-radius: 6px; font-size: 0.95rem; outline: none;
    }

    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* REPRODUCTOR ESPECIALIZADO OK.RU */
    .video-box {
      width: 100%; aspect-ratio: 16/9; background: #000;
      margin-bottom: 12px; border-radius: 8px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .video-box iframe { width: 100%; height: 100%; border: none; }
    .empty-msg { font-size: 0.85rem; color: var(--text-gray); padding: 0 15px; font-style: italic; }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
    <div class="header-actions">
      <button class="btn-creator" id="btnCreator" onclick="handleCreatorClick()">Modo Creador</button>
    </div>
  </header>

  <!-- VISTA INICIO -->
  <div id="viewHome" class="view-section active">
    <div class="hero">
      <h1>Catálogo NaPlus</h1>
      <p>Películas y series organizadas.</p>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar película o serie..." oninput="handleSearch()">
      </div>
    </div>

    <!-- Resultados de Búsqueda -->
    <div id="searchResultsContainer" style="display: none;">
      <div class="section-title">Resultados de Búsqueda</div>
      <div class="grid" id="searchGrid"></div>
    </div>

    <!-- Contenido Principal -->
    <div id="mainHomeContent">
      <div class="section-title">🔥 Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

      <div class="section-title">⭐ Top 10 Más Vistas</div>
      <div class="horizontal-scroll" id="topScroll"></div>

      <div id="genreRowsContainer"></div>
    </div>
  </div>

  <!-- VISTA MI LISTA -->
  <div id="viewList" class="view-section">
    <div class="section-title" style="margin-top: 25px;">🔖 Mi Lista - Películas</div>
    <div class="grid" id="myListMoviesGrid"></div>
    <div class="section-title">🔖 Mi Lista - Series</div>
    <div class="grid" id="myListSeriesGrid"></div>
  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')"><span>🏠</span>Inicio</button>
    <button class="nav-item" id="navList" onclick="switchView('list')"><span>🔖</span>Mi Lista</button>
  </nav>

  <!-- MODAL REPRODUCTOR OK.RU -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('detailModal')">✕</button>
      <div class="video-box" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color:var(--accent-light); font-size:0.85rem; margin-bottom:8px;"></p>
      <p id="detailViews" style="color:var(--text-gray); font-size:0.75rem; margin-bottom:6px;"></p>
      <p id="detailDesc" style="color:var(--text-gray); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('detailModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ACCESO CREADOR -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('loginModal')">✕</button>
      <h3>Acceso Creador</h3>
      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Clave (9009) o Token de GitHub</label>
          <input type="password" id="passInput" placeholder="Clave o Token..." required autocomplete="off">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('loginModal')">Cancelar</button>
          <button type="submit" class="btn-submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL SUBIR / EDITAR -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('uploadModal')">✕</button>
      <h3 id="formTitle">Subir Contenido</h3>
      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo</label>
          <select id="typeInput">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Nombre">
        </div>
        <div class="form-group">
          <label>Género (ej. Terror, Acción, Animación)</label>
          <input type="text" id="genreInput" required placeholder="Terror">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required value="2026">
        </div>
        <div class="form-group">
          <label>Sinopsis</label>
          <textarea id="descInput" rows="2" placeholder="Resumen..."></textarea>
        </div>
        <div class="form-group">
          <label>URL de Portada</label>
          <input type="url" id="coverInput" required placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Enlace OK.ru (Ej: https://ok.ru/video/...)</label>
          <input type="url" id="videoInput" required placeholder="https://ok.ru/video/...">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "index.html";

    let catalog = [
  {
    "id": 1790638927123,
    "type": "movie",
    "title": "V/H/S: Las crónicas del miedo",
    "genre": "Terror",
    "year": "2012",
    "desc": "Contratada para robar una cinta VHS de una casa alejada, una banda de ladrones descubre un cadáver, viejos televisores y muchas imágenes encriptadas.",
    "cover": "https://m.media-amazon.com/images/S/pv-target-images/9e4b343e30ec4de545da0d441f539e1dad78d27cb16974010de57558fa8d2a7d.png",
    "video": "https://ok.ru/video/16645441915611",
    "views": 463,
    "dateAdded": 1790638927123
  },
  {
    "id": 1790637325394,
    "type": "movie",
    "title": "Final de la calle Oak",
    "genre": "Terror, Acción",
    "year": "2026",
    "desc": "Cuando una anomalía cósmica sacude los suburbios, una familia deberá permanecer unida para sobrevivir a una aventura que desafía la realidad, donde el tiempo se desmorona y el caos invade el vecindario.",
    "cover": "https://m.media-amazon.com/images/S/pv-target-images/73c3544aaac37e4c6bd8620234a55085d5498746efda9a28630927af5fda06d6.jpg",
    "video": "https://ok.ru/video/16645391256283",
    "views": 318,
    "dateAdded": 1790637325395
  },
  {
    "id": 1790632979212,
    "type": "movie",
    "title": "[REC]",
    "genre": "Terror",
    "year": "2007",
    "desc": "En el interior de un edificio residencial, una reportera y su camarógrafo graban el terrible brote de una enfermedad que transforma a los humanos en caníbales. Uno tras otro, los vecinos del inmueble se convierten en monstruos sedientos de sangre.",
    "cover": "https://www.clarin.com/img/2020/04/15/9OmNWiFE0_720x0__1.jpg",
    "video": "https://ok.ru/video/16640296815323",
    "views": 354,
    "dateAdded": 1790632979213
  },
  {
    "id": 1,
    "type": "movie",
    "title": "[REC]",
    "genre": "Terror",
    "year": "2007",
    "desc": "Película de prueba de terror.",
    "cover": "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400",
    "video": "https://ok.ru/videoembed/237592963750",
    "views": 1420,
    "dateAdded": 1710000000000
  }
];

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = false;

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
        renderHomeSections();
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
        renderMyList();
      }
      window.scrollTo(0, 0);
    }

    function toggleFavorite(id, e) {
      e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderHomeSections();
      renderMyList();
    }

    function renderHomeSections() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const searchContainer = document.getElementById('searchResultsContainer');
      const mainContent = document.getElementById('mainHomeContent');

      if (query.length > 0) {
        searchContainer.style.display = 'block';
        mainContent.style.display = 'none';
        const searchGrid = document.getElementById('searchGrid');
        searchGrid.innerHTML = '';
        const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || i.genre.toLowerCase().includes(query));
        if (matches.length > 0) {
          matches.forEach(item => searchGrid.appendChild(createCardElement(item)));
        } else {
          searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
        }
        return;
      } else {
        searchContainer.style.display = 'none';
        mainContent.style.display = 'block';
      }

      // Lo más reciente
      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      const recentSorted = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0));
      recentSorted.forEach(item => recentScroll.appendChild(createCardElement(item)));

      // Top 10 más vistas
      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      const topSorted = [...catalog].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10);
      topSorted.forEach(item => topScroll.appendChild(createCardElement(item)));

      // Filas por género
      const genreContainer = document.getElementById('genreRowsContainer');
      genreContainer.innerHTML = '';
      const uniqueGenres = [...new Set(catalog.map(i => i.genre ? i.genre.trim() : 'Otros'))];
      
      uniqueGenres.forEach(genre => {
        const genreItems = catalog.filter(i => (i.genre ? i.genre.trim() : 'Otros') === genre);
        if (genreItems.length > 0) {
          const titleDiv = document.createElement('div');
          titleDiv.className = 'section-title';
          titleDiv.innerText = `🎬 ${genre}`;
          
          const scrollDiv = document.createElement('div');
          scrollDiv.className = 'horizontal-scroll';
          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));

          genreContainer.appendChild(titleDiv);
          genreContainer.appendChild(scrollDiv);
        }
      });
    }

    function renderMyList() {
      const moviesGrid = document.getElementById('myListMoviesGrid');
      const seriesGrid = document.getElementById('myListSeriesGrid');
      moviesGrid.innerHTML = '';
      seriesGrid.innerHTML = '';

      const favorites = catalog.filter(i => myFavorites.includes(i.id));
      const favMovies = favorites.filter(i => i.type === 'movie');
      const favSeries = favorites.filter(i => i.type === 'series');

      favMovies.forEach(item => moviesGrid.appendChild(createCardElement(item)));
      favSeries.forEach(item => seriesGrid.appendChild(createCardElement(item)));

      if (favMovies.length === 0) moviesGrid.innerHTML = '<div class="empty-msg">No tenés películas guardadas.</div>';
      if (favSeries.length === 0) seriesGrid.innerHTML = '<div class="empty-msg">No tenés series guardadas.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openDetail(item.id);

      const isFav = myFavorites.includes(item.id);

      card.innerHTML = `
        <button class="card-fav-btn" onclick="toggleFavorite(${item.id}, event)">
          ${isFav ? '❤️' : '🔖'}
        </button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
        </div>
        <img src="${item.cover}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Portada'">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.genre} • ${item.year}</div>
        </div>
      `;
      return card;
    }

    function handleSearch() {
      renderHomeSections();
    }

    function handleCreatorClick() {
      if (isCreatorMode) {
        openUploadModal();
      } else {
        document.getElementById('passInput').value = '';
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'detailModal') {
        document.getElementById('videoBox').innerHTML = '';
      }
    }

    function submitLogin(e) {
      e.preventDefault();
      const val = document.getElementById('passInput').value.trim();

      if (val === "9009" || val.startsWith("ghp_")) {
        if (val.startsWith("ghp_")) {
          localStorage.setItem('naPlus_gh_token', val);
        }
        isCreatorMode = true;
        document.body.classList.add('creator-mode');
        document.getElementById('btnCreator').innerText = '+ Agregar';
        closeModal('loginModal');
        openUploadModal();
      } else {
        alert("Clave o Token incorrecto.");
      }
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item ? item.video : '';
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta obra del catálogo?")) {
        catalog = catalog.filter(x => x.id != id);
        renderHomeSections();
        renderMyList();
        await publishToGitHub();
      }
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: document.getElementById('typeInput').value,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim(),
        views: id ? (catalog.find(x => x.id == id)?.views || 0) : Math.floor(Math.random() * 500) + 50,
        dateAdded: id ? (catalog.find(x => x.id == id)?.dateAdded || Date.now()) : Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      renderHomeSections();
      renderMyList();
      closeModal('uploadModal');
      await publishToGitHub();
    }

    async function publishToGitHub() {
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) {
        token = prompt("Para publicar los cambios permanentemente para todos, ingresá tu Token de GitHub (ghp_...):");
        if (token && token.startsWith("ghp_")) {
          token = token.trim();
          localStorage.setItem('naPlus_gh_token', token);
        } else {
          return;
        }
      }

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Sincronizando...";

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`);
        const getData = await getRes.json();
        const sha = getData.sha;

        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        const catalogJson = JSON.stringify(catalog, null, 2);
        fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${catalogJson};`);

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Actualización automática NaPlus',
            content: updatedBase64,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert("¡Publicado globalmente con éxito!");
        } else {
          alert("Error al validar el Token de GitHub.");
        }
      } catch (err) {
        console.error(err);
      } finally {
        if (saveBtn) saveBtn.innerText = "Guardar y Publicar";
      }
    }

    // Reproductor Especializado y Optimizado para OK.ru
    function openDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;

      item.views = (item.views || 0) + 1;

      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
      document.getElementById('detailViews').innerText = `👁️ ${item.views} reproducciones`;
      document.getElementById('detailDesc').innerText = item.desc || 'Sin descripción.';

      const vBox = document.getElementById('videoBox');
      const vUrl = item.video || '';

      // Conversor y Adaptador Nativo para OK.ru
      if (vUrl.includes('ok.ru')) {
        let embedUrl = vUrl;
        if (!vUrl.includes('videoembed')) {
          const match = vUrl.match(/\/video\/([0-9]+)/);
          if (match && match[1]) {
            embedUrl = `https://ok.ru/videoembed/${match[1]}`;
          }
        }
        vBox.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } else {
        vBox.innerHTML = `<video src="${vUrl}" controls autoplay poster="${item.cover}"></video>`;
      }

      document.getElementById('detailModal').style.display = 'flex';
      renderHomeSections();
    }

    renderHomeSections();
  </script>
