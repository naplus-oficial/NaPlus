<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NaPlus</title>
<style>
:root {
  --bg: #0f0b1a;
  --surface: #19122c;
  --primary: #f47521; /* Estilo Crunchyroll Orange */
  --primary-hover: #d25e10;
  --text: #ffffff;
  --text-muted: #a0a0ab;
  --border: rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); padding-bottom: 75px; overflow-x: hidden; }

/* Navegación Inferior Móvil */
nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: rgba(15, 11, 26, 0.95); backdrop-filter: blur(10px);
  display: flex; justify-content: space-around; align-items: center;
  border-top: 1px solid var(--border); z-index: 1000;
}
.nav-item {
  background: none; border: none; color: var(--text-muted);
  font-size: 0.7rem; display: flex; flex-direction: column; align-items: center;
  gap: 3px; cursor: pointer; width: 25%;
}
.nav-item span.icon { font-size: 1.2rem; }
.nav-item.active { color: var(--primary); }

/* Vistas de la App */
.view { display: none; padding: 15px; }
.view.active { display: block; }

/* Header Superior */
.app-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 15px; padding-top: 5px;
}
.app-logo { font-size: 1.4rem; font-weight: 900; color: var(--primary); letter-spacing: 0.5px; }
.profile-avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); cursor: pointer; }

/* Buscador */
.search-box {
  width: 100%; padding: 12px 15px; background: var(--surface);
  border: 1px solid var(--border); color: #fff; border-radius: 10px;
  font-size: 0.95rem; outline: none; margin-bottom: 15px;
}
.search-box:focus { border-color: var(--primary); }

/* Secciones y Grillas */
.section-title { font-size: 1rem; font-weight: 700; margin: 20px 0 10px; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { background: var(--surface); border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid var(--border); }
.card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #000; }
.card-info { padding: 6px; }
.card-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { font-size: 0.65rem; color: var(--text-muted); }

/* Selector de Perfiles (Estilo Netflix) */
.profiles-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center; padding: 20px; }
.profiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin: 25px 0; width: 100%; max-width: 300px; }
.profile-card { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.profile-avatar { width: 75px; height: 75px; border-radius: 12px; object-fit: cover; border: 2px solid transparent; transition: transform 0.2s; }
.profile-card:active .profile-avatar { transform: scale(0.95); }
.profile-name { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

/* Configuración y Creador */
.settings-group { background: var(--surface); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
.settings-group h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--primary); }
.btn-main { background: var(--primary); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
.btn-main:active { background: var(--primary-hover); }

/* Reproductor Modal */
.player-modal { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; }
.player-modal.active { display: flex; }
.player-topbar { display: flex; align-items: center; padding: 15px; background: rgba(0,0,0,0.8); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
.btn-back { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; margin-right: 15px; }
.video-stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
.video-stage video, .video-stage iframe { width: 100%; height: 100%; border: none; object-fit: contain; }
.video-loading { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--primary); font-size: 0.8rem; pointer-events: none; }
.spinner { width: 35px; height: 35px; border: 3px solid rgba(244,117,33,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.player-info { padding: 15px; background: var(--surface); max-height: 40vh; overflow-y: auto; }

/* Formulario Modal Estándar */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000; align-items: flex-end; }
.modal-overlay.active { display: flex; }
.modal-sheet { background: var(--surface); width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 20px; overflow-y: auto; border-top: 1px solid var(--border); animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.form-field { margin-bottom: 12px; }
.form-field label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 8px; font-size: 0.9rem; outline: none; }

#toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: var(--primary); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; z-index: 4000; display: none; text-align: center; box-shadow: 0 4px 12px rgba(244,117,33,0.4); }
</style>
</head>
<body>

  <!-- Vista Selección de Perfiles -->
  <div id="viewProfiles" class="view active">
    <div class="profiles-container">
      <h1 style="font-size: 1.5rem; margin-bottom: 5px;">¿Quién está viendo?</h1>
      <p style="color: var(--text-muted); font-size: 0.85rem;">Seleccioná tu perfil para comenzar</p>
      <div class="profiles-grid" id="profilesGrid"></div>
      <button class="btn-main" style="max-width: 200px; padding: 10px; font-size: 0.8rem;" onclick="openProfileModal()">+ Nuevo Perfil</button>
    </div>
  </div>

  <!-- Vista Inicio (Home) -->
  <div id="viewHome" class="view">
    <div class="app-header">
      <div class="app-logo">NaPlus</div>
      <img id="currentAvatar" class="profile-avatar-sm" onclick="switchProfile()" alt="Perfil">
    </div>
    <input type="search" class="search-box" id="searchBar" placeholder="🔍 Buscar películas o series..." oninput="renderHome()">
    
    <div class="section-title">Películas</div>
    <div class="grid" id="moviesGrid"></div>

    <div class="section-title" style="margin-top: 25px;">Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <!-- Vista Explorar -->
  <div id="viewExplore" class="view">
    <div class="app-header"><div class="app-logo">Explorar</div></div>
    <input type="search" class="search-box" placeholder="🔍 Buscar en todo el catálogo..." oninput="renderExplore(this.value)">
    <div class="grid" id="exploreGrid" style="margin-top: 15px;"></div>
  </div>

  <!-- Vista Mi Lista -->
  <div id="viewList" class="view">
    <div class="app-header"><div class="app-logo">Mi Lista</div></div>
    <div class="grid" id="listGrid" style="margin-top: 15px;"></div>
    <p id="emptyListMsg" style="color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 0.85rem; display: none;">Tu lista está vacía.</p>
  </div>

  <!-- Vista Configuración / Perfiles -->
  <div id="viewSettings" class="view">
    <div class="app-header"><div class="app-logo">Configuración</div></div>
    
    <div class="settings-group">
      <h3>Perfil Activo</h3>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
        <img id="settingsAvatar" style="width: 50px; height: 50px; border-radius: 50%; object-fit: border;" alt="Avatar">
        <div>
          <h4 id="settingsName" style="font-size: 0.95rem;"></h4>
          <p style="color: var(--text-muted); font-size: 0.75rem; cursor: pointer; color: var(--primary);" onclick="switchProfile()">Cambiar de perfil</p>
        </div>
      </div>
    </div>

    <div class="settings-group" id="creatorSection" style="display: none;">
      <h3>Panel de Creador</h3>
      <button class="btn-main" onclick="openAdminModal()">+ Subir Contenido</button>
    </div>

    <div class="settings-group">
      <h3>Seguridad</h3>
      <div class="form-field" style="margin-bottom: 0;">
        <label>Clave de Administrador / Creador</label>
        <input type="password" id="adminPassInput" placeholder="Ingresar clave (9009)..." oninput="checkAdminKey(this.value)">
      </div>
    </div>
  </div>

  <!-- Barra de Navegación Inferior -->
  <nav id="bottomNav" style="display: none;">
    <button class="nav-item active" onclick="switchView('Home', this)"><span class="icon">🏠</span>Inicio</button>
    <button class="nav-item" onclick="switchView('Explore', this)"><span class="icon">🧭</span>Explorar</button>
    <button class="nav-item" onclick="switchView('List', this)"><span class="icon">🔖</span>Mi Lista</button>
    <button class="nav-item" onclick="switchView('Settings', this)"><span class="icon">⚙️</span>Ajustes</button>
  </nav>

  <!-- Modal Reproductor Nativo -->
  <div class="player-modal" id="playerModal">
    <div class="player-topbar">
      <button class="btn-back" onclick="closePlayer()">✕</button>
      <h3 id="playerHeaderTitle" style="font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h3>
    </div>
    <div class="video-stage" id="videoStage">
      <div class="video-loading" id="videoLoading">
        <div class="spinner"></div>
        <span>Cargando video...</span>
      </div>
    </div>
    <div class="player-info">
      <h3 id="playerTitle" style="font-size: 1.1rem; margin-bottom: 4px;"></h3>
      <p id="playerMeta" style="color: var(--primary); font-size: 0.8rem; margin-bottom: 8px;"></p>
      <p id="playerDesc" style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.4;"></p>
      <button class="btn-main" id="playerListBtn" style="margin-top: 15px;" onclick="toggleCurrentList()">+ Agregar a Mi Lista</button>
    </div>
  </div>

  <!-- Modal Creador / Edición -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 id="formTitle" style="font-size: 1.1rem; color: var(--primary);">Subir Contenido</h3>
        <button onclick="closeAdminModal()" style="background: none; border: none; color: #fff; font-size: 1.2rem;">✕</button>
      </div>
      <form onsubmit="saveContent(event)">
        <input type="hidden" id="editId">
        <div class="form-field"><label>Tipo</label><select id="fType"><option value="movie">Película</option><option value="series">Serie</option></select></div>
        <div class="form-field"><label>Título</label><input type="text" id="fTitle" required></div>
        <div class="form-field"><label>Género</label><input type="text" id="fGenre" required placeholder="Acción, Terror..."></div>
        <div class="form-field"><label>Año</label><input type="number" id="fYear" required value="2026"></div>
        <div class="form-field"><label>Sinopsis</label><textarea id="fDesc" rows="2"></textarea></div>
        <div class="form-field"><label>URL Portada (Imagen)</label><input type="url" id="fCover" required placeholder="https://..."></div>
        <div class="form-field"><label>Link de Video (Google Drive, MP4...)</label><input type="url" id="fVideo" required placeholder="https://..."></div>
        <button type="submit" class="btn-main" style="margin-top: 10px;">Guardar Cambios</button>
      </form>
    </div>
  </div>

  <!-- Modal Crear Perfil -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-sheet">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="font-size: 1.1rem; color: var(--primary);">Nuevo Perfil</h3>
        <button onclick="closeProfileModal()" style="background: none; border: none; color: #fff; font-size: 1.2rem;">✕</button>
      </div>
      <form onsubmit="saveProfile(event)">
        <div class="form-field"><label>Nombre del Perfil</label><input type="text" id="pName" required placeholder="Ej: Juan"></div>
        <div class="form-field">
          <label>Foto de Perfil (Subir desde Galería)</label>
          <input type="file" id="pAvatarFile" accept="image/*">
        </div>
        <button type="submit" class="btn-main" style="margin-top: 10px;">Crear Perfil</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const DB_KEY = 'naplus_db_v7';
const PROFILES_KEY = 'naplus_profiles_v1';

let catalog = JSON.parse(localStorage.getItem(DB_KEY)) || [
  { id: 1, type: 'movie', title: '[REC]', genre: 'Terror', year: '2007', desc: 'Película de prueba nativa.', cover: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400', video: 'https://lh3.googleusercontent.com/d/10-ff0lGCypXx4dHgmc7NaYEzI4hcMnr2=w1920' }
];

let profiles = JSON.parse(localStorage.getItem(PROFILES_KEY)) || [];
let activeProfileId = null;
let currentPlayId = null;
let customAvatarBase64 = '';

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

// --- GESTIÓN DE PERFILES ---
function renderProfiles() {
  const grid = $('profilesGrid'); grid.innerHTML = '';
  if(profiles.length === 0) {
    grid.innerHTML = '<p style="grid-column: span 2; color: var(--text-muted); font-size: 0.8rem;">No hay perfiles creados.</p>';
    return;
  }
  profiles.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'profile-card';
    btn.onclick = () => selectProfile(p.id);
    btn.innerHTML = `
      <img class="profile-avatar" src="${p.avatar || 'https://via.placeholder.com/150?text=User'}" alt="Avatar">
      <span class="profile-name">${p.name}</span>
    `;
    grid.appendChild(btn);
  });
}

function openProfileModal() {
  if(profiles.length >= 4) { toast('Máximo 4 perfiles permitidos.'); return; }
  $('pName').value = ''; $('pAvatarFile').value = ''; customAvatarBase64 = '';$('profileModal').classList.add('active');
}
function closeProfileModal() { $('profileModal').classList.remove('active'); }

$('pAvatarFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if(file) {
    const reader = new FileReader();
    reader.onload = evt => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 200;
        const scale = MAX / img.width;
        canvas.width = MAX; canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        customAvatarBase64 = canvas.toDataURL('image/jpeg', 0.8);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }
});

function saveProfile(e) {
  e.preventDefault();
  const name = $('pName').value.trim();
  const newP = {
    id: Date.now(),
    name: name,
    avatar: customAvatarBase64 || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200',
    list: []
  };
  profiles.push(newP);
  localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles));
  closeProfileModal();
  renderProfiles();
  toast('Perfil creado');
}

function selectProfile(id) {
  activeProfileId = id;
  const p = profiles.find(x => x.id === id);
  $('currentAvatar').src = p.avatar;
  $('settingsAvatar').src = p.avatar;
  $('settingsName').textContent = p.name;
  
  $('viewProfiles').classList.remove('active');
  $('viewHome').classList.add('active');$('bottomNav').style.display = 'flex';
  renderHome();
}

function switchProfile() {
  activeProfileId = null;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('viewProfiles').classList.add('active');$('bottomNav').style.display = 'none';
  renderProfiles();
}

// --- NAVEGACIÓN VISTAS ---
function switchView(viewName, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $(`view${viewName}`).classList.add('active');
  el.classList.add('active');
  if(viewName === 'Home') renderHome();
  if(viewName === 'List') renderList();
}

// --- RENDERIZADO CATÁLOGO ---
function makeCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openPlayer(item.id);
  card.innerHTML = `
    <img src="${item.cover}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=NaPlus'">
    <div class="card-info">
      <div class="card-title">${item.title}</div>
      <div class="card-sub">${item.genre}</div>
    </div>
  `;
  return card;
}

function renderHome() {
  const q = $('searchBar').value.toLowerCase().trim();
  const moviesGrid = $('moviesGrid');
  const seriesGrid = $('seriesGrid');
  moviesGrid.innerHTML = ''; seriesGrid.innerHTML = '';

  const filtered = catalog.filter(i => i.title.toLowerCase().includes(q) || i.genre.toLowerCase().includes(q));
  filtered.forEach(item => {
    const card = makeCard(item);
    if(item.type === 'movie') moviesGrid.appendChild(card);
    else seriesGrid.appendChild(card);
  });
}

function renderExplore(q) {
  const grid = $('exploreGrid'); grid.innerHTML = '';
  const query = q.toLowerCase().trim();
  catalog.filter(i => i.title.toLowerCase().includes(query) || i.genre.toLowerCase().includes(query)).forEach(item => {
    grid.appendChild(makeCard(item));
  });
}

function renderList() {
  const grid = $('listGrid'); grid.innerHTML = '';
  const p = profiles.find(x => x.id === activeProfileId);
  const listIds = p ? p.list : [];
  const items = catalog.filter(i => listIds.includes(i.id));

  if(items.length === 0) { $('emptyListMsg').style.display = 'block'; }
  else {
    $('emptyListMsg').style.display = 'none';
    items.forEach(item => grid.appendChild(makeCard(item)));
  }
}

// --- REPRODUCTOR NATIVO ---
function openPlayer(id) {
  currentPlayId = id;
  const item = catalog.find(x => x.id === id);
  if(!item) return;

  $('playerHeaderTitle').textContent = item.title;
  $('playerTitle').textContent = item.title;
  $('playerMeta').textContent = `${item.genre} • ${item.year}`;
  $('playerDesc').textContent = item.desc || 'Sin sinopsis disponible.';

  updatePlayerListBtn();

  const stage = $('videoStage');
  // Mantiene el contenedor y el loader, limpia elementos previos de video/iframe
  stage.innerHTML = `
    <div class="video-loading" id="videoLoading">
      <div class="spinner"></div>
      <span>Cargando contenido...</span>
    </div>
  `;

  const url = item.video || '';
  if(url.includes('youtube.com') || url.includes('youtu.be')) {
    let embed = url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
    const iframe = document.createElement('iframe');
    iframe.src = embed;
    iframe.allowFullscreen = true;
    iframe.onload = () => $('videoLoading').style.displa
