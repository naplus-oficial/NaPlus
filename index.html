<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent: #7c3aed;
      --accent-light: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      padding-top: 65px;
      padding-bottom: 40px;
    }

    /* Navbar */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      padding: 0 15px;
      background: #0a0612;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      border-bottom: 1px solid rgba(124, 58, 237, 0.3);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent-light);
    }

    .btn-creator {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Banner */
    .hero {
      padding: 20px 15px;
      background: linear-gradient(180deg, #140d24 0%, #0a0612 100%);
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .hero h1 { font-size: 1.8rem; margin-bottom: 5px; }
    .hero p { font-size: 0.9rem; color: var(--text-muted); }

    /* Catálogo */
    .section-title {
      font-size: 1.2rem;
      margin: 20px 15px 10px 15px;
      color: var(--accent-light);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(124, 58, 237, 0.2);
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }

    .card-info {
      padding: 6px;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .card-admin-btns {
      position: absolute;
      top: 4px; right: 4px;
      display: none;
      gap: 4px;
    }

    .card-admin-btns button {
      background: rgba(0,0,0,0.8);
      border: none;
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 6px;
      border-radius: 4px;
    }

    /* Modales */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      padding: 15px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      border: 1px solid var(--accent);
    }

    .modal-content h3 {
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px;
      background: #0a0612;
      border: 1px solid var(--accent);
      color: #fff;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .form-btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-sec {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 8px 12px;
    }

    .btn-pri {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
    }

    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      margin-bottom: 10px;
    }

    .video-box video, .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">NaPlus</div>
    <button class="btn-creator" id="btnAdmin" onclick="toggleCreator()">Modo Creador</button>
  </header>

  <div class="hero">
    <h1>NaPlus Streaming</h1>
    <p>Seleccioná cualquier película o serie para ver los detalles.</p>
  </div>

  <div class="section-title">Películas</div>
  <div class="grid" id="moviesGrid"></div>

  <div class="section-title">Series</div>
  <div class="grid" id="seriesGrid"></div>

  <!-- Modal Detalle -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="video-box" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color: var(--accent-light); font-size:0.85rem; margin-bottom:8px;"></p>
      <p id="detailDesc" style="color: var(--text-muted); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-btns">
        <button class="btn-pri" onclick="closeDetail()">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Formulario Creador -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h3 id="formTitle">Subir Contenido</h3>
      <form onsubmit="saveData(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo</label>
          <select id="type">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>Género</label>
          <input type="text" id="genre" required placeholder="Acción, Drama...">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="year" required placeholder="2026">
        </div>
        <div class="form-group">
          <label>Sinopsis / Descripción</label>
          <textarea id="desc" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>URL / Link de Portada</label>
          <input type="url" id="cover" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>URL / Link de Video (YouTube, MP4, etc.)</label>
          <input type="url" id="video" placeholder="https://...">
        </div>
        <div class="form-btns">
          <button type="button" class="btn-sec" onclick="closeAdmin()">Cancelar</button>
          <button type="submit" class="btn-pri">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let isCreator = false;
    let catalog = JSON.parse(localStorage.getItem('naPlus_db')) || [
      {
        id: 1,
        type: 'movie',
        title: 'Película Ejemplo',
        genre: 'Aventura',
        year: '2026',
        desc: 'Sinopsis de la película de prueba.',
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400',
        video: ''
      },
      {
        id: 2,
        type: 'series',
        title: 'Serie Ejemplo',
        genre: 'Drama',
        year: '2026',
        desc: 'Sinopsis de la serie de prueba.',
        cover: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=400',
        video: ''
      }
    ];

    function render() {
      const mGrid = document.getElementById('moviesGrid');
      const sGrid = document.getElementById('seriesGrid');
      mGrid.innerHTML = '';
      sGrid.innerHTML = '';

      catalog.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => showDetail(item.id);

        div.innerHTML = `
          <div class="card-admin-btns" style="display:${isCreator ? 'flex' : 'none'}">
            <button onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
            <button onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
          </div>
          <img src="${item.cover}" alt="cover">
          <div class="card-info">
            <div class="card-title">${item.title}</div>
            <div class="card-sub">${item.genre} • ${item.year}</div>
          </div>
        `;

        if (item.type === 'movie') mGrid.appendChild(div);
        else sGrid.appendChild(div);
      });
    }

    function toggleCreator() {
      if (!isCreator) {
        const pass = prompt("Acceso Administrador:");
        if (pass === "9009") {
          isCreator = true;
          document.getElementById('btnAdmin').innerText = "+ Agregar";
          render();
          openAdmin();
        } else if (pass !== null) {
          alert("Acceso denegado.");
        }
      } else {
        openAdmin();
      }
    }

    function openAdmin(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar' : 'Subir Contenido';
      document.getElementById('type').value = item ? item.type : 'movie';
      document.getElementById('title').value = item ? item.title : '';
      document.getElementById('genre').value = item ? item.genre : '';
      document.getElementById('year').value = item ? item.year : '2026';
      document.getElementById('desc').value = item ? item.desc : '';
      document.getElementById('cover').value = item ? item.cover : '';
      document.getElementById('video').value = item ? item.video : '';
      document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdmin() {
      document.getElementById('adminModal').style.display = 'none';
    }

    function saveData(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: document.getElementById('type').value,
        title: document.getElementById('title').value,
        genre: document.getElementById('genre').value,
        year: document.getElementById('year').value,
        desc: document.getElementById('desc').value,
        cover: document.getElementById('cover').value,
        video: document.getElementById('video').value
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_db', JSON.stringify(catalog));
      render();
      closeAdmin();
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openAdmin(item);
    }

    function deleteItem(id) {
      if (confirm("¿Eliminar este contenido?")) {
        catalog = catalog.filter(x => x.id != id);
        localStorage.setItem('naPlus_db', JSON.stringify(catalog));
        render();
      }
    }

    function showDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;

      document.getElementById('detailTitle').innerText = item.title;
      document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
      document.getElementById('detailDesc').innerText = item.desc || 'Sin descripción.';

      const vBox = document.getElementById('videoBox');
      if (item.video) {
        if (item.video.includes('youtube.com') || item.video.includes('youtu.be')) {
          let embed = item.video.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
          vBox.innerHTML = `<iframe src="${embed}" allowfullscreen></iframe>`;
        } else {
          vBox.innerHTML = `<video src="${item.video}" controls poster="${item.cover}"></video>`;
        }
      } else {
        vBox.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#aaa;font-size:0.8rem;">Contenido no disponible</div>`;
      }

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetail() {
      document.getElementById('videoBox').innerHTML = '';
      document.getElementById('detailModal').style.display = 'none';
    }

    render();
  </script>
</body>
</html>
