<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    button { transition: transform 0.15s ease; }
    button:active { transform: scale(0.95); }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 0;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
    }

    .nav-item {
      background: none; border: none;
      color: var(--text-gray);
      font-size: 0.65rem; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; width: 25%;
      transition: color 0.2s ease;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); }

    .view-section { display: none; padding-bottom: 20px; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList { padding-top: 75px; }

    .hero { padding: 15px 20px 5px; }
    body.search-active .hero#searchContainer { padding-top: 80px; }

    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .hbo-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      background-size: cover;
      background-position: center;
    }

    .hbo-slide.active { opacity: 1; z-index: 2; }

    .hbo-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.3) 0%, rgba(7,4,13,0.6) 60%, var(--bg-dark) 100%);
    }

    .hbo-slide-content { position: relative; z-index: 3; text-align: left; }
    .hbo-slide-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; line-height: 1.2; }
    .hbo-slide-meta { font-size: 0.8rem; color: var(--accent-light); margin-bottom: 12px; font-weight: 500; }
    
    .hbo-slide-btns { display: flex; gap: 10px; align-items: center; }
    .hbo-btn-play {
      background: #fff; color: #000; border: none;
      padding: 9px 20px; border-radius: 6px;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .hbo-btn-add.saved { border-color: var(--accent-light); background: rgba(124, 58, 237, 0.25); }
    .hbo-btn-add.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }
    .hbo-btn-add svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

    .hbo-slider-dots { position: absolute; bottom: 12px; right: 20px; z-index: 10; display: flex; gap: 5px; }
    .hbo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    .search-box { width: 100%; max-width: 500px; position: relative; }
    .search-box .search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text-gray); display: flex; align-items: center; pointer-events: none;
    }
    .search-box .search-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
    .search-box input {
      width: 100%; padding: 11px 40px 11px 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple); color: #fff;
      border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .clear-search-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-gray); font-size: 1.1rem; cursor: pointer; display: none;
    }

    .section-title { font-size: 1rem; font-weight: 700; margin: 20px 20px 10px; color: #e2e8f0; }
    .horizontal-scroll {
      display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 10px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 0 20px; }

    .card {
      background: var(--card-bg); border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; position: relative;
    }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; }
    .card-info { padding: 6px 8px; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
    }
    .card-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .admin-btns { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; z-index: 10; }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff; width: 26px; height: 26px; border-radius: 50%; font-size: 0.7rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(8px);
      z-index: 2000; padding: 15px; align-items: center; justify-content: center; overflow-y: auto;
    }

    .modal-box {
      background: #0b0614; padding: 20px; border-radius: 14px;
      width: 100%; max-width: 600px; border: 1px solid var(--border-purple);
      position: relative; max-height: 95vh; overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0,0,0,0.9);
    }

    .modal-box-series {
      background: #07040d; padding: 0; border-radius: 0;
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      position: fixed; inset: 0; overflow-y: auto; z-index: 2100; display: none;
    }

    .btn-close {
      position: absolute; top: 15px; right: 15px;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      color: #fff; border: 1px solid rgba(255,255,255,0.2);
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 1rem; cursor: pointer; z-index: 2250;
      display: flex; align-items: center; justify-content: center;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 4px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px 12px; background: #07040d;
      border: 1px solid var(--border-purple); color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    .series-hero-banner {
      position: relative;
      width: 100%;
      min-height: 420px;
      padding: 50px 20px 25px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background-size: cover;
      background-position: center;
    }
    .series-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.7) 60%, #07040d 100%);
    }
    .series-hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .series-main-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 3px 10px rgba(0,0,0,0.9);
      margin-bottom: 2px;
    }
    .series-metadata-tags {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 500;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .series-metadata-tags span {
      background: rgba(255,255,255,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .assistir-btn-container {
      width: 100%;
      max-width: 400px;
      margin: 12px 0 8px;
    }
    .btn-assistir {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 100%;
      padding: 13px;
      border-radius: 25px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    }
    .btn-assistir:hover { background: #e2e8f0; }

    .series-synopsis {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
      max-width: 600px;
      margin: 8px auto 20px;
      text-align: center;
      padding: 0 15px;
    }

    .series-tabs-bar {
      display: flex;
      justify-content: center;
      gap: 35px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 20px;
      padding: 0 20px;
    }
    .series-tab-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.85rem;
      font-weight: 700;
      padding-bottom: 10px;
      cursor: pointer;
      position: relative;
      letter-spacing: 0.5px;
    }
    .series-tab-item.active {
      color: var(--text-white);
    }
    .series-tab-item.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 3px;
      background: #ffffff;
      border-radius: 2px 2px 0 0;
    }

    .season-selector-wrapper {
      padding: 0 20px 15px;
      max-width: 650px;
      margin: 0 auto;
    }
    .season-selector-hbo {
      background: #120b20; border: 1px solid var(--border-purple); color: #fff;
      padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; width: 100%; outline: none;
    }

    .netflix-episodes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 5px 20px 90px;
      max-width: 650px;
      margin: 0 auto;
    }

    .netflix-ep-row {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .netflix-ep-row:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .netflix-ep-thumb {
      width: 125px;
      height: 72px;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1528;
      flex-shrink: 0;
      position: relative;
    }
    .netflix-ep-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .netflix-ep-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
    }

    .netflix-ep-info {
      flex-grow: 1;
      overflow: hidden;
    }
    .netflix-ep-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .netflix-ep-duration {
      font-size: 0.72rem;
      color: var(--text-gray);
    }

    .netflix-ep-edit-btn {
      display: none;
      background: #2563eb; border: none; color: #fff;
      padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    body.creator-mode .netflix-ep-edit-btn { display: inline-block; }

    /* CONTENEDOR DE VIDEO PROFESIONAL ESTILO CUEVANA */
    .video-box { 
      width: 100%;
      aspect-ratio: 16/9; 
      background: #000; 
      margin-bottom: 15px; 
      border-radius: 10px; 
      overflow: hidden; 
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .video-box iframe, .video-box video { 
      width: 100% !important; 
      height: 100% !important; 
      border: none !important; 
      position: absolute;
      top: 0; left: 0;
      object-fit: contain !important;
      background: #000;
    }

    #episodeModal .modal-box {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background: #000 !important;
      border: none !important;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #episodeModal .video-box {
      width: 100vw !important;
      height: 100vh !important;
      aspect-ratio: unset !important;
      border: none !important;
      border-radius: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
    }

    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 20px; font-style: italic; text-align: center; }

    @media (max-width: 600px) {
      #detailModal .modal-box {
        max-width: 100%; max-height: 100%; height: 100%; border-radius: 0; padding: 15px;
      }
      .series-main-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
  </header>

  <div id="viewHome" class="view-section active">
    <div class="hbo-hero-slider" id="hboHeroSlider">
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>

    <div class="hero" id="searchContainer">
      <div class="search-box">
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="searchInput" placeholder="Buscar película o serie..." oninput="handleSearch()" onkeydown="checkSecretCode(event)">
        <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearchInput()" type="button">✕</button>
      </div>
    </div>

    <div id="searchResultsContainer" style="display: none;">
      <div class="section-title">Resultados de Búsqueda</div>
      <div class="grid" id="searchGrid"></div>
    </div>

    <div id="mainHomeContent">
      <div class="section-title">🔥 Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

      <div class="section-title">⭐ Top 10 Más Vistas</div>
      <div class="horizontal-scroll" id="topScroll"></div>

      <div id="genreRowsContainer"></div>
    </div>
  </div>

  <div id="viewMovies" class="view-section">
    <div class="section-title" style="margin-top: 10px;">🎬 Películas</div>
    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll" id="moviesTopScroll"></div>
    <div id="moviesGenreRowsContainer"></div>
    <div class="section-title">Todas las Películas</div>
    <div class="grid" id="moviesGrid"></div>
  </div>

  <div id="viewSeries" class="view-section">
    <div class="section-title" style="margin-top: 10px;">📺 Series</div>
    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll" id="seriesTopScroll"></div>
    <div id="seriesGenreRowsContainer"></div>
    <div class="section-title">Todas las Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <div id="viewList" class="view-section">
    <div class="section-title" style="margin-top: 10px;">🔖 Mi Lista - Guardados</div>
    <div class="grid" id="myListGrid"></div>
  </div>

  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </button>
    <button class="nav-item" id="navMovies" onclick="switchView('movies')">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
      Películas
    </button>
    <button class="nav-item" id="navSeries" onclick="switchView('series')">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
      Series
    </button>
    <button class="nav-item" id="navList" onclick="switchView('list')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      Mi Lista
    </button>
  </nav>

  <!-- MODAL DETALLE PELÍCULA -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('detailModal')">✕</button>
      <div class="video-box" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color:var(--accent-light); font-size:0.8rem; margin-bottom:6px;"></p>
      <p id="detailViews" style="color:var(--text-gray); font-size:0.7rem; margin-bottom:6px;"></p>
      <p id="detailDesc" style="color:var(--text-gray); font-size:0.8rem; margin-bottom:12px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('detailModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL VISTA SERIE -->
  <div class="modal-box-series" id="seriesModal">
    <button class="btn-close" onclick="closeModal('seriesModal')">✕</button>
    
    <div class="series-hero-banner" id="hboBackdropHeader">
      <div class="series-hero-overlay"></div>
      <div class="series-hero-content">
        <h2 class="series-main-title" id="seriesTitle"></h2>
        <div class="series-metadata-tags">
          <span>HD</span><span>5.1</span><span>CC</span>
          <span id="seriesMeta">2026 • Temporada 1</span>
        </div>
        <div class="assistir-btn-container">
          <button class="btn-assistir" onclick="playFirstEpisode()">
            ▶ REPRODUCIR
          </button>
        </div>
        <p style="font-size: 0.7rem; color: var(--text-gray);" id="seriesViews">👁️ 0 reproducciones</p>
        <div class="series-synopsis" id="seriesDesc"></div>
      </div>
    </div>

    <div class="series-tabs-bar">
      <button class="series-tab-item active">EPISODIOS</button>
      <button class="series-tab-item" onclick="alert('Sección en desarrollo')">SUGERENCIAS</button>
      <button class="series-tab-item" onclick="alert('Sección en desarrollo')">EXTRAS</button>
    </div>

    <div class="season-selector-wrapper">
      <select id="seasonSelect" class="season-selector-hbo" onchange="renderEpisodesForSelectedSeason()"></select>

  <!-- MODAL SUBIR / EDITAR -->
  <div class="modal-overlay" id="uploadModal">

      <button class="btn-close" onclick="closeModal('uploadModal')">✕</button>

      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <div class="form-group">

            <option value="movie">Película</option>

          </select>

        <div class="form-group">
          <label>Título</label>

          <label>Año</label>

        <div class="form-group">
          <label>Sinopsis</label>
          <textarea id="descInput" rows="2" placeholder="Resumen general..."></textarea>
        </div>
        <div class="form-group">
          <label>URL de Portada</label>
          <input type="url" id="coverInput" required placeholder="https://...">
        </div>

        <div class="form-group" id="movieVideoGroup">
          <label>Enlace o Código de Video (VOE, OK.ru, Google Drive o .mp4)</label>
          <input type="text" id="videoInput" placeholder="https://voe.sx/..., enlace de Drive o .mp4">
        </div>

        <div id="seriesSeasonsGroup" style="display: none;">
          <label style="color: var(--accent-light); font-weight: 600; margin-bottom: 6px; display: block; font-size: 0.8rem;">Temporadas y Episodios</label>
          <div id="seasonsContainer"></div>
          <button type="button" class="btn-submit" style="background: #2563eb; width: 100%; margin-top: 6px; font-size: 0.75rem; padding: 6px;" onclick="addSeasonField()">+ Agregar Temporada</button>
        </div>

        <div class="form-actions" style="margin-top: 15px;">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "index.html";

    let catalog = /*CATALOG_START*/[
  {

    "cover": "https://image.tmdb.org/t/p/original/e7QdDLU3VNAZlS8546MSqSqJoLt.jpg",
    "video": "",
    "seasons": [
      {
        "name": "Temporada 1",

            "desc": "Cuando un asesino de élite lleva a cabo su último asesinato, llama la atención de una oficial de inteligencia que comienza a darle caza.",

            "desc": "Con su cliente anterior retirándose del pago, la reputación del Chacal está en juego y comienza a planear su venganza.",
            "video": "https://ok.ru/video/16692972686043"
          }
        ]
      }
    ],
    "views": 114,
    "dateAdded": 1790955167205
  },
  {
    "id": 1790867112502,
    "type": "movie",
    "title": "Blade",
    "genre": "Acción, Cienciaficción",
    "year": "1998",
    "desc": "Un hombre mitad vampiro, mitad mortal, se convierte en protector de la raza mortal, mientras mata a vampiros.",
    "cover": "https://resizing.flixster.com/-XZAfHZM39UwaGJIFWKAE8fS0ak=/v3/t/assets/p21512_p_v8_ad.jpg",
    "video": "https://voe.sx/e/6wlobplzjvja",
    "seasons": [],
    "views": 232,
    "dateAdded": 1790867112502
  }
]/*CATALOG_END*/;

    const localDb = JSON.parse(localStorage.getItem('naPlus_permanent_db'));
    if (Array.isArray(localDb) && localDb.length > 0) {
      catalog = localDb;
    } else {
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
    }

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = localStorage.getItem('naPlus_is_creator_active') === 'true';

    if (isCreatorMode) document.body.classList.add('creator-mode');

    const NO_COVER_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='#1a1528'/><text x='50%' y='50%' fill='#94a3b8' font-size='14' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>Sin portada</text></svg>"
    );

    function handleImgError(img) {
      img.onerror = null;
      img.src = NO_COVER_SVG;
    }

    let inSearchHistoryState = false;

    function pushSearchState() {
      if (!inSearchHistoryState) {
        inSearchHistoryState = true;
        history.pushState({ naplusSearch: true }, '', location.href);
      }
    }

    function popSearchStateIfNeeded() {
      if (inSearchHistoryState) {
        inSearchHistoryState = false;
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      if (inSearchHistoryState) {
        inSearchHistoryState = false;
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = '';
        renderHomeSections();
      }
    });

    function switchView(viewName) {
      popSearchStateIfNeeded();
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = '';
      
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
        renderHomeSections();
      } else if (viewName === 'movies') {
        document.getElementById('viewMovies').classList.add('active');
        document.getElementById('navMovies').classList.add('active');
        renderMoviesGrid();
      } else if (viewName === 'series') {
        document.getElementById('viewSeries').classList.add('active');
        document.getElementById('navSeries').classList.add('active');
        renderSeriesGrid();
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
        renderMyList();
      }
      window.scrollTo(0, 0);
    }

    function clearSearchInput() {
      popSearchStateIfNeeded();
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = '';
        renderHomeSections();
        searchInput.focus();
      }
    }

    function toggleFavorite(id, e) {
      e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderHeroSlider();
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
    }

    let currentSlide = 0;
    let sliderInterval = null;

    function restartSliderInterval() {
      if (sliderInterval) clearInterval(sliderInterval);
      const count = document.querySelectorAll('.hbo-slide').length;
      if (!count) return;
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % count;
        goToSlide(currentSlide);
      }, 5000);
    }

    function renderHeroSlider() {
      const sliderContainer = document.getElementById('hboHeroSlider');
      const dotsContainer = document.getElementById('hboSliderDots');
      const recentItems = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).slice(0, 6);
      if (recentItems.length === 0) return;

      sliderContainer.querySelectorAll('.hbo-slide').forEach(s => s.remove());
      dotsContainer.innerHTML = '';

      recentItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = `hbo-slide ${idx === 0 ? 'active' : ''}`;
        slide.style.backgroundImage = `url('${item.cover}')`;
        const isFav = myFavorites.includes(item.id);
        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">${item.year} • ${item.genre.split(',')[0]}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="openContentDetail(${item.id})">▶ Ver</button>
              <button class="hbo-btn-add ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="${isFav ? 'Quitar' : 'Guardar'}">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
          </div>
        `;
        sliderContainer.insertBefore(slide, dotsContainer);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => { goToSlide(idx); restartSliderInterval(); };
        dotsContainer.appendChild(dot);
      });
      restartSliderInterval();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      const slides = document.querySelectorAll('.hbo-slide');
      const dots = document.querySelectorAll('.hbo-dot');
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    function renderHomeSections() {
      const searchInput = document.getElementById('searchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const searchContainer = document.getElementById('searchResultsContainer');
      const mainContent = document.getElementById('mainHomeContent');
      const heroSlider = document.getElementById('hboHeroSlider');
      const clearBtn = document.getElementById('clearSearchBtn');

      if (clearBtn) clearBtn.style.display = query.length > 0 ? 'block' : 'none';
      const searching = query.length > 0 && query !== "9009";
      document.body.classList.toggle('search-active', searching);

      if (searching) {
        pushSearchState();
        heroSlider.style.display = 'none';
        searchContainer.style.display = 'block';
        mainContent.style.display = 'none';
        const searchGrid = document.getElementById('searchGrid');
        searchGrid.innerHTML = '';
        const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || i.genre.toLowerCase().includes(query));
        if (matches.length > 0) {
          matches.forEach(item => searchGrid.appendChild(createCardElement(item)));
        } else {
          searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
        }
        return;
      } else {
        heroSlider.style.display = 'block';
        searchContainer.style.display = 'none';
        mainContent.style.display = 'block';
        renderHeroSlider();
      }

      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).forEach(item => recentScroll.appendChild(createCardElement(item)));

      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      [...catalog].sort((a, b) => (b.views || 0) - (b.views || 0)).slice(0, 10).forEach(item => topScroll.appendChild(createCardElement(item)));

      const genreContainer = document.getElementById('genreRowsContainer');
      genreContainer.innerHTML = '';
      let allGenres = [];
      catalog.forEach(item => {
        if (item.genre) item.genre.split(',').forEach(g => { if (g.trim() && !allGenres.includes(g.trim())) allGenres.push(g.trim()); });
      });
      allGenres.sort();

      allGenres.forEach(genre => {
        const genreItems = catalog.filter(i => i.genre && i.genre.split(',').map(x => x.trim().toLowerCase()).includes(genre.toLowerCase()));
        if (genreItems.length > 0) {
          const titleDiv = document.createElement('div'); titleDiv.className = 'section-title'; titleDiv.innerText = `🎬 ${genre}`;
          const scrollDiv = document.createElement('div'); scrollDiv.className = 'horizontal-scroll';
          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));
          genreContainer.appendChild(titleDiv); genreContainer.appendChild(scrollDiv);
        }
      });
    }

    function checkSecretCode(e) {
      if (e.key === 'Enter') {
        const val = document.getElementById('searchInput').value.trim();
        if (val === "9009") {
          e.preventDefault();
          popSearchStateIfNeeded();
          document.getElementById('searchInput').value = '';
          isCreatorMode = !isCreatorMode;
          localStorage.setItem('naPlus_is_creator_active', isCreatorMode ? 'true' : 'false');
          document.body.classList.toggle('creator-mode', isCreatorMode);
          if (isCreatorMode) openUploadModal();
          renderHomeSections();
        }
      }
    }

    function renderMoviesGrid() {
      const movies = catalog.filter(i => i.type === 'movie');
      const topScroll = document.getElementById('moviesTopScroll');
      topScroll.innerHTML = '';
      [...movies].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach(item => topScroll.appendChild(createCardElement(item)));

      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      movies.forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderSeriesGrid() {
      const series = catalog.filter(i => i.type === 'series');
      const topScroll = document.getElementById('seriesTopScroll');
      topScroll.innerHTML = '';
      [...series].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach(item => topScroll.appendChild(createCardElement(item)));

      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = '';
      series.forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderMyList() {
      const grid = document.getElementById('myListGrid');
      grid.innerHTML = '';
      catalog.filter(i => myFavorites.includes(i.id)).forEach(item => grid.appendChild(createCardElement(item)));
      if (grid.children.length === 0) grid.innerHTML = '<div class="empty-msg">No tenés elementos guardados.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);
      const badge = item.type === 'series' ? '📺' : '🎬';

      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="${isFav ? 'Quitar' : 'Guardar'}">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})" title="Editar">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem(${item.id})" title="Eliminar">🗑️</button>
        </div>
        <img src="${item.cover}" alt="Portada" loading="lazy" onerror="handleImgError(this)">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${badge} • ${item.year}</div>
        </div>
      `;
      return card;
    }

    let searchDebounceTimer = null;
    function handleSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(renderHomeSections, 100);
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'detailModal') document.getElementById('videoBox').innerHTML = '';
    }

    function toggleContentTypeFields() {
      const type = document.getElementById('typeInput').value;
      document.getElementById('movieVideoGroup').style.display = type === 'series' ? 'none' : 'block';
      document.getElementById('seriesSeasonsGroup').style.display = type === 'series' ? 'block' : 'none';
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item && item.video ? item.video : '';
      toggleContentTypeFields();
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta obra del catálogo?")) {
        catalog = catalog.filter(x => x.id != id);
        localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
        renderHomeSections();
      }
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const type = document.getElementById('typeInput').value;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: type,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: type === 'movie' ? document.getElementById('videoInput').value.trim() : '',
        seasons: [],
        views: 50,
        dateAdded: Date.now()
      };
      catalog.unshift(newItem);
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      renderHomeSections();
      closeModal('uploadModal');
    }

    let currentSeriesData = null;

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;
      item.views = (item.views || 0) + 1;
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));

      if (item.type === 'series') {
        currentSeriesData = item;
        document.getElementById('hboBackdropHeader').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('seriesTitle').innerText = item.title;
        document.getElementById('seriesMeta').innerText = `${item.year} • Temporada 1`;
        document.getElementById('seriesViews').innerText = `👁️ ${item.views} reproducciones`;
        document.getElementById('seriesDesc').innerText = item.desc || '';
        
        const seasonSelect = document.getElementById('seasonSelect');
        seasonSelect.innerHTML = '';
        if (item.seasons) {
          item.seasons.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = idx; opt.innerText = s.name;
            seasonSelect.appendChild(opt);
          });
        }
        renderEpisodesForSelectedSeason();
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        document.getElementById('detailTitle').innerText = item.title;
        document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
        document.getElementById('detailViews').innerText = `👁️ ${item.views} reproducciones`;
        document.getElementById('detailDesc').innerText = item.desc || '';
        renderVideoInBox(document.getElementById('videoBox'), item.video, item.title);
        document.getElementById('detailModal').style.display = 'flex';
      }
    }

    function playFirstEpisode() {
      if (currentSeriesData && currentSeriesData.seasons && currentSeriesData.seasons[0] && currentSeriesData.seasons[0].episodes[0]) {
        playEpisode(0, 0);
      }
    }

    function renderEpisodesForSelectedSeason() {
      if (!currentSeriesData || !currentSeriesData.seasons) return;
      const sIdx = document.getElementById('seasonSelect').value;
      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = '';

      if (!season || !season.episodes) return;
      season.episodes.forEach((ep, eIdx) => {
        const cardDiv = document.createElement('div');
        cardDiv.className = 'netflix-ep-row';
        cardDiv.onclick = () => playEpisode(sIdx, eIdx);
        cardDiv.innerHTML = `
          <div class="netflix-ep-thumb">
            <img src="${ep.img || currentSeriesData.cover}" alt="Ep" loading="lazy" onerror="handleImgError(this)">
            <div class="netflix-ep-play-overlay">▶</div>
          </div>
          <div class="netflix-ep-info">
            <div class="netflix-ep-title">${ep.num}. ${ep.title}</div>
            <div class="netflix-ep-duration">${ep.desc ? ep.desc.substring(0, 65) + '...' : 'Capítulo de serie'}</div>
          </div>
        `;
        container.appendChild(cardDiv);
      });
    }

    function playEpisode(seasonIdx, epIdx) {
      const ep = currentSeriesData.seasons[seasonIdx].episodes[epIdx];
      renderVideoInBox(document.getElementById('episodeVideoBox'), ep.video, `Capítulo ${ep.num}: ${ep.title}`);
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function closeEpisodePlayer() {
      document.getElementById('episodeModal').style.display = 'none';
      document.getElementById('episodeVideoBox').innerHTML = '';
    }

    /* MOTOR DE REPRODUCCIÓN DEFINITIVO: SOPORTE ESTÁNDAR LIMPIO Y COMPATIBLE CON VOE */
    function renderVideoInBox(vBox, vInput, titleText = "NaPlus Streaming") {
      if (!vInput) {
        vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>';
        return;
      }

      let innerContent = '';
      const iframeAttributes = 'frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" allowfullscreen webkitallowfullscreen mozallowfullscreen';

      if (vInput.includes('<iframe')) {
        innerContent = vInput.replace(/<iframe/i, `<iframe ${iframeAttributes}`);
      } else if (vInput.includes('voe.sx')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('/e/')) {
          const parts = embedUrl.split('voe.sx/');
          if (parts[1]) embedUrl = `https://voe.sx/e/${parts[1].split(/[?#/]/)[0]}`;
        }
        innerContent = `<iframe src="${embedUrl}" ${iframeAttributes}></iframe>`;
      } else if (vInput.includes('ok.ru')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('videoembed')) {
          const match = embedUrl.match(/\/video\/([0-9]+)/);
          if (match) embedUrl = `https://ok.ru/videoembed/${match[1]}`;
        }
        innerContent = `<iframe src="${embedUrl}" ${iframeAttributes}></iframe>`;
      } else if (vInput.includes('drive.google.com')) {
        let fileId = '';
        const match = vInput.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          fileId = match[1];
        } else {
          const urlParams = new URLSearchParams(vInput.split('?')[1]);
          if (urlParams.get('id')) fileId = urlParams.get('id');
        }
        const embedDriveUrl = `https://drive.google.com/file/d/${fileId}/preview`;
        innerContent = `<iframe src="${embedDriveUrl}" ${iframeAttributes}></iframe>`;
      } else {
        innerContent = `<video src="${vInput.trim()}" controls autoplay playsinline webkit-playsinline></video>`;
      }

      vBox.innerHTML = innerContent;
    }

    renderHomeSections();
  </script>
</body>
</html>
