<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming Gratuito</title>
  
  <style>
    :root {
      --bg: #0a0612;
      --card: #150d26;
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(139, 92, 246, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }

    /* Header */
    header {
      position: sticky; top: 0; left: 0; right: 0;
      height: 60px; background: rgba(10, 6, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 15px; border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .brand { font-size: 1.5rem; font-weight: 900; color: var(--purple); letter-spacing: 1px; }

    .btn-main {
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: #fff; border: none; padding: 8px 14px;
      border-radius: 6px; font-weight: bold; font-size: 0.85rem;
      cursor: pointer;
    }

    /* Buscador y Filtro por Géneros */
    .hero { padding: 15px; background: linear-gradient(180deg, var(--card) 0%, var(--bg) 100%); }
    
    .search-input {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.6);
      border: 1px solid var(--border); color: #fff;
      border-radius: 8px; font-size: 0.95rem; outline: none; margin-bottom: 12px;
    }

    .genre-bar {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none;
    }
    .genre-bar::-webkit-scrollbar { display: none; }

    .genre-chip {
      background: var(--card); border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600; white-space: nowrap; cursor: pointer;
    }
    .genre-chip.active { background: var(--purple); color: #fff; border-color: var(--purple); }

    /* Panel de Creador Integrado */
    .creator-panel {
      display: none; background: var(--card); margin: 15px;
      padding: 15px; border-radius: 12px; border: 1px solid var(--purple);
    }
    .creator-panel.active { display: block; }
    
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; background: var(--bg);
      border: 1px solid var(--border); color: #fff;
      border-radius: 6px; font-size: 0.9rem;
    }

    /* Grillas y Tarjetas */
    .section-title {
      font-size: 1.1rem; margin: 20px 15px 10px; color: var(--purple);
      display: flex; align-items: center; gap: 8px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 0 15px; }

    .card {
      background: var(--card); border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border); cursor: pointer; position: relative;
    }

    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .card-body { padding: 8px; }
    .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.75rem; color: var(--muted); }

    .card-fav-btn {
      position: absolute; top: 5px; left: 5px;
      background: rgba(0,0,0,0.7); border: 1px solid var(--border);
      color: #fff; width: 28px; height: 28px; border-radius: 50%;
      font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }

    .card-actions {
      display: none; position: absolute; top: 5px; right: 5px; gap: 4px; z-index: 10;
    }
    body.creator-active .card-actions { display: flex; }

    .card-actions button {
      background: rgba(0,0,0,0.85); border: 1px solid var(--purple);
      color: #fff; padding: 4px 6px; border-radius: 4px; font-size: 0.75rem;
    }

    /* Vista del Reproductor */
    .player-view {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.95); z-index: 20000;
      flex-direction: column; padding: 15px; overflow-y: auto;
    }
    .player-view.active { display: flex; }

    .video-wrapper {
      width: 100%; aspect-ratio: 16/9; background: #000;
      border-radius: 8px; overflow: hidden; margin-bottom: 15px;
      position: relative; display: flex; align-items: center; justify-content: center;
      flex-direction: column; padding: 10px; text-align: center;
    }

    .video-wrapper iframe, .video-wrapper video { width: 100%; height: 100%; border: none; }

    .btn-redirect {
      background: #0088cc; color: #fff; padding: 14px 24px;
      border-radius: 8px; text-decoration: none; font-weight: bold;
      font-size: 1rem; display: inline-flex; align-items: center; gap: 10px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }

    .btn-close {
      align-self: flex-end; background: var(--purple); color: #fff;
      border: none; padding: 8px 16px; border-radius: 6px;
      font-weight: bold; cursor: pointer; margin-bottom: 10px;
    }

    .player-desc {
      color: var(--muted); font-size: 0.9rem; margin-top: 10px;
      line-height: 1.4; background: var(--card); padding: 12px;
      border-radius: 8px; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">NaPlus</div>
    <button class="btn-main" id="btnAdmin" onclick="toggleCreador()">Modo Creador</button>
  </header>

  <div class="hero">
    <input type="text" class="search-input" id="searchBar" placeholder="🔍 Buscar por nombre o género..." oninput="filtrar()">
    
    <!-- Filtro por Géneros -->
    <div class="genre-bar">
      <button class="genre-chip active" onclick="seleccionarGenero('Todos', this)">Todos</button>
      <button class="genre-chip" onclick="seleccionarGenero('Acción', this)">Acción</button>
      <button class="genre-chip" onclick="seleccionarGenero('Terror', this)">Terror</button>
      <button class="genre-chip" onclick="seleccionarGenero('Comedia', this)">Comedia</button>
      <button class="genre-chip" onclick="seleccionarGenero('Drama', this)">Drama</button>
      <button class="genre-chip" onclick="seleccionarGenero('Ciencia Ficción', this)">Ciencia Ficción</button>
      <button class="genre-chip" onclick="seleccionarGenero('Animación', this)">Animación</button>
    </div>
  </div>

  <!-- Panel Integrado de Creador -->
  <div class="creator-panel" id="creatorPanel">
    <div class="panel-header">
      <h3 id="panelTitle">Subir Nuevo Contenido</h3>
      <button onclick="cerrarPanel()" style="background:none; border:none; color:var(--muted); font-size:1.2rem;">✕</button>
    </div>
    <form onsubmit="guardarContenido(event)">
      <input type="hidden" id="editIndex">
      <div class="form-group">
        <label>Tipo</label>
        <select id="tipoInput">
          <option value="pelicula">Película</option>
          <option value="serie">Serie</option>
        </select>
      </div>
      <div class="form-group">
        <label>Título</label>
        <input type="text" id="tituloInput" required placeholder="Nombre del título">
      </div>
      <div class="form-group">
        <label>Género</label>
        <select id="generoInput">
          <option value="Acción">Acción</option>
          <option value="Terror">Terror</option>
          <option value="Comedia">Comedia</option>
          <option value="Drama">Drama</option>
          <option value="Ciencia Ficción">Ciencia Ficción</option>
          <option value="Animación">Animación</option>
        </select>
      </div>
      <div class="form-group">
        <label>Año</label>
        <input type="number" id="anioInput" required value="2026">
      </div>
      <div class="form-group">
        <label>Descripción / Sinopsis</label>
        <textarea id="descInput" rows="3" placeholder="Resumen o detalles de la obra..."></textarea>
      </div>
      <div class="form-group">
        <label>Enlace de Imagen (Portada)</label>
        <input type="url" id="portadaInput" required placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Enlace del Contenido (Google Drive, Telegram, MP4, Web...)</label>
        <input type="url" id="videoInput" required placeholder="https://t.me/... o https://drive.google.com/...">
      </div>
      <button type="submit" class="btn-main" style="width:100%; margin-top:10px;">Publicar Cambios</button>
    </form>
  </div>

  <!-- Sección Mi Lista -->
  <div id="favSection" style="display:none;">
    <div class="section-title">🔖 Mi Lista</div>
    <div class="grid" id="favGrid"></div>
  </div>

  <div class="section-title">🎬 Películas</div>
  <div class="grid" id="peliculasGrid"></div>

  <div class="section-title">📺 Series</div>
  <div class="grid" id="seriesGrid"></div>

  <!-- Vista Reproductor -->
  <div class="player-view" id="playerView">
    <button class="btn-close" onclick="cerrarReproductor()">✕ Volver al Catálogo</button>
    <div class="video-wrapper" id="videoContainer"></div>
    <h2 id="playerTitle"></h2>
    <p id="playerSub" style="color:var(--purple); margin-top:5px;"></p>
    <div class="player-desc" id="playerDesc">Sin descripción disponible.</div>
  </div>

  <script>
    const USER_REPO = "naplus-oficial/NaPlus";
    const FILE_PATH = "index.html";

    let catalog = [
  {
    "id": 1790598687063,
    "tipo": "pelicula",
    "titulo": "[REC]",
    "genero": "Terror",
    "anio": "2007",
    "desc": "Película de terror basada en una periodista",
    "portada": "https://image.tmdb.org/t/p/original/iMg9tfTZfA8qdTZNVim9Nsg9f4w.jpg",
    "video": "https://t.me/c/3804641088/2/3335"
  },
  {
    "id": 1,
    "tipo": "pelicula",
    "titulo": "Película Demo NaPlus",
    "genero": "Acción",
    "anio": "2026",
    "desc": "Esta es una película de prueba para la plataforma NaPlus.",
    "portada": "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400",
    "video": "https://www.w3schools.com/html/mov_bbb.mp4"
  }
];

    let favoritos = JSON.parse(localStorage.getItem('naplus_favs')) || [];
    let esCreador = false;
    let generoSeleccionado = 'Todos';

    function toggleCreador() {
      if (esCreador) {
        document.getElementById('creatorPanel').classList.toggle('active');
        limpiarFormulario();
        return;
      }

      const pass = prompt("Ingresá la clave de creador (9009) o tu Token de GitHub:");
      if (!pass) return;

      if (pass.trim() === "9009" || pass.trim().startsWith("ghp_")) {
        if (pass.trim().startsWith("ghp_")) {
          localStorage.setItem('naplus_token', pass.trim());
        }
        esCreador = true;
        document.body.classList.add('creator-active');
        document.getElementById('btnAdmin').innerText = "+ Panel Creador";
        document.getElementById('creatorPanel').classList.add('active');
        alert("Modo creador activado correctamente.");
      } else {
        alert("Clave incorrecta.");
      }
    }

    function toggleFavorito(id, event) {
      event.stopPropagation();
      if (favoritos.includes(id)) {
        favoritos = favoritos.filter(fId => fId !== id);
      } else {
        favoritos.push(id);
      }
      localStorage.setItem('naplus_favs', JSON.stringify(favoritos));
      renderizar();
    }

    function seleccionarGenero(genero, el) {
      generoSeleccionado = genero;
      document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      filtrar();
    }

    function cerrarPanel() {
      document.getElementById('creatorPanel').classList.remove('active');
    }

    function renderizar(filtro = '') {
      const pGrid = document.getElementById('peliculasGrid');
      const sGrid = document.getElementById('seriesGrid');
      const fGrid = document.getElementById('favGrid');
      const favSection = document.getElementById('favSection');

      pGrid.innerHTML = ''; sGrid.innerHTML = ''; fGrid.innerHTML = '';

      const query = filtro.toLowerCase().trim();

      catalog.forEach((item, index) => {
        const coincideGenero = (generoSeleccionado === 'Todos' || item.genero === generoSeleccionado);
        const coincideBusqueda = (item.titulo.toLowerCase().includes(query) || item.genero.toLowerCase().includes(query));

        if (coincideGenero && coincideBusqueda) {
          const card = crearTarjeta(item, index);
          if (item.tipo === 'pelicula') pGrid.appendChild(card);
          else sGrid.appendChild(card);
        }

        if (favoritos.includes(item.id)) {
          const cardFav = crearTarjeta(item, index);
          fGrid.appendChild(cardFav);
        }
      });

      favSection.style.display = (favoritos.length > 0 && query === '' && generoSeleccionado === 'Todos') ? 'block' : 'none';
    }

    function crearTarjeta(item, index) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => reproducir(index);

      const esFav = favoritos.includes(item.id);

      card.innerHTML = `
        <button class="card-fav-btn" onclick="toggleFavorito(${item.id}, event)">
          ${esFav ? '❤️' : '🔖'}
        </button>
        <div class="card-actions">
          <button onclick="event.stopPropagation(); editar(${index})">✏️</button>
          <button onclick="event.stopPropagation(); eliminar(${index})">🗑️</button>
        </div>
        <img src="${item.portada}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=NaPlus'">
        <div class="card-body">
          <div class="card-title">${item.titulo}</div>
          <div class="card-sub">${item.genero} • ${item.anio}</div>
        </div>
      `;
      return card;
    }

    function filtrar() {
      renderizar(document.getElementById('searchBar').value);
    }

    function reproducir(index) {
      const item = catalog[index];
      if (!item) return;

      document.getElementById('playerTitle').innerText = item.titulo;
      document.getElementById('playerSub').innerText = `${item.genero} (${item.anio})`;
      document.getElementById('playerDesc').innerText = item.desc || "Sin descripción disponible.";

      const box = document.getElementById('videoContainer');
      box.innerHTML = '';
      const url = item.video;

      // Redirección si es enlace de Telegram u otra web externa
      if (url.includes('t.me') || url.includes('telegram')) {
        box.innerHTML = `
          <p style="margin-bottom:15px; color:var(--muted);">Este contenido está alojado en Telegram.</p>
          <a href="${url}" target="_blank" class="btn-redirect">✈️ Abrir y Ver en Telegram</a>
        `;
      } 
      // Soporte Nativo Google Drive
      else if (url.includes('drive.google.com')) {
        let driveId = "";
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) driveId = match[1];

        const embedUrl = driveId ? `https://drive.google.com/file/d/${driveId}/preview` : url;
        box.innerHTML = `<iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
      } 
      // Reproductor Nativo HTML5 para videos directos (.mp4, etc.)
      else {
        box.innerHTML = `
          <video controls autoplay style="width:100%; height:100%;">
            <source src="${url}" type="video/mp4">
            Tu navegador no soporta el reproductor de video.
          </video>
        `;
      }

      document.getElementById('playerView').classList.add('active');
    }

    function cerrarReproductor() {
      document.getElementById('videoContainer').innerHTML = '';
      document.getElementById('playerView').classList.remove('active');
    }

    function limpiarFormulario() {
      document.getElementById('editIndex').value = '';
      document.getElementById('panelTitle').innerText = "Subir Nuevo Contenido";
      document.getElementById('tituloInput').value = '';
      document.getElementById('descInput').value = '';
      document.getElementById('portadaInput').value = '';
      document.getElementById('videoInput').value = '';
    }

    function editar(index) {
      const item = catalog[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('panelTitle').innerText = "Editar Contenido";
      document.getElementById('tipoInput').value = item.tipo;
      document.getElementById('tituloInput').value = item.titulo;
      document.getElementById('generoInput').value = item.genero;
      document.getElementById('anioInput').value = item.anio;
      document.getElementById('descInput').value = item.desc || '';
      document.getElementById('portadaInput').value = item.portada;
      document.getElementById('videoInput').value = item.video;
      document.getElementById('creatorPanel').classList.add('active');
    }

    async function eliminar(index) {
      if (confirm("¿Seguro que querés eliminar este contenido del catálogo?")) {
        catalog.splice(index, 1);
        renderizar();
        await publicarEnNube();
      }
    }

    async function guardarContenido(e) {
      e.preventDefault();
      const editIdx = document.getElementById('editIndex').value;

      const nuevoItem = {
        id: Date.now(),
        tipo: document.getElementById('tipoInput').value,
        titulo: document.getElementById('tituloInput').value.trim(),
        genero: document.getElementById('generoInput').value,
        anio: document.getElementById('anioInput').value,
        desc: document.getElementById('descInput').value.trim(),
        portada: document.getElementById('portadaInput').value.trim(),
        video: document.getElementById('videoInput').value.trim()
      };

      if (editIdx !== '') catalog[parseInt(editIdx)] = nuevoItem;
      else catalog.unshift(nuevoItem);

      renderizar();
      limpiarFormulario();
      cerrarPanel();
      await publicarEnNube();
    }

    async function publicarEnNube() {
      let token = localStorage.getItem('naplus_token');
      if (!token || !token.startsWith("ghp_")) {
        token = prompt("Pegá tu Token de GitHub (ghp_...) para guardar los cambios globalmente:");
        if (token && token.trim().startsWith("ghp_")) {
          token = token.trim();
          localStorage.setItem('naplus_token', token);
        } else {
          alert("Sin token válido, los cambios se guardan solo localmente.");
          return;
        }
      }

      try {
        const getRes = await fetch(`https://api.github.com/repos/${USER_REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `token ${token}` }
        });

        if (!getRes.ok) {
          alert("Error de autenticación con GitHub.");
          return;
        }

        const getData = await getRes.json();
        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        
        fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${JSON.stringify(catalog, null, 2)};`);

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${USER_REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Actualización NaPlus',
            content: updatedBase64,
            sha: getData.sha
          })
        });

        if (putRes.ok) alert("¡Catálogo actualizado globalmente!");
        else alert("Error al subir cambios a GitHub.");

      } catch (err) {
        alert("Error de conexión al sincronizar.");
      }
    }

    renderizar();
  </script>
</body>
</html>
