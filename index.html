<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaPlus - Streaming</title>
<style>
:root{--bg-dark:#0a0612;--card-bg:#140d24;--accent:#7c3aed;--accent-light:#c084fc;--text:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg-dark);color:var(--text);padding-top:65px;padding-bottom:40px}
header{position:fixed;top:0;left:0;right:0;height:60px;padding:0 15px;background:#0a0612;display:flex;justify-content:space-between;align-items:center;z-index:100;border-bottom:1px solid rgba(124,58,237,.3)}
.logo{font-size:1.5rem;font-weight:900;color:var(--accent-light)}
.header-btns{display:flex;gap:8px}
.btn-creator{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:6px;font-size:.85rem;font-weight:bold;cursor:pointer}
.btn-exit{background:transparent;border:1px solid var(--accent);display:none}
body.creator .btn-exit{display:inline-block}
.hero{padding:20px 15px;background:linear-gradient(180deg,#140d24 0%,#0a0612 100%);margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.05)}
.hero h1{font-size:1.8rem;margin-bottom:5px}
.hero p{font-size:.9rem;color:var(--text-muted)}
.searchbar{display:flex;gap:8px;margin-top:12px}
.searchbar input{flex:1;min-width:0;padding:10px 12px;background:#0a0612;border:1px solid var(--accent);color:#fff;border-radius:6px;font-size:1rem}
.searchbar button{white-space:nowrap}
.section-title{font-size:1.2rem;margin:20px 15px 10px;color:var(--accent-light)}
#listSec,#searchSec{scroll-margin-top:70px}
.empty{color:var(--text-muted);font-size:.85rem;padding:0 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:0 15px}
.card{background:var(--card-bg);border-radius:8px;overflow:hidden;position:relative;border:1px solid rgba(124,58,237,.2);cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#0a0612}
.card-info{padding:6px}
.card-title,.card-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-size:.8rem;font-weight:bold}
.card-sub{font-size:.7rem;color:var(--text-muted)}
.card-save{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.8);color:#fff;font-size:1rem;cursor:pointer}
.card-save.on{background:var(--accent)}
.card-admin-btns{position:absolute;top:4px;right:4px;display:none;gap:4px}
body.creator .card-admin-btns{display:flex}
.card-admin-btns button{background:rgba(0,0,0,.8);border:none;color:#fff;font-size:.9rem;padding:6px 8px;border-radius:4px;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;padding:15px;overflow-y:auto}
#dialogModal{z-index:300}
.modal-content{background:var(--card-bg);padding:20px;border-radius:10px;width:100%;max-width:500px;border:1px solid var(--accent);margin:auto}
.modal-content h3{margin-bottom:12px}
.hint{color:var(--text-muted);font-size:.8rem;margin-bottom:12px;line-height:1.4}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:.8rem;margin-bottom:4px;color:var(--text-muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;background:#0a0612;border:1px solid var(--accent);color:#fff;border-radius:6px;font-size:1rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:#0a0612;color:var(--text-muted);border:1px solid var(--accent);border-radius:16px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.form-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:15px;flex-wrap:wrap}
.btn-sec{background:transparent;color:var(--text-muted);border:none;padding:10px 12px;cursor:pointer;font-size:1rem}
.btn-pri{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:6px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;font-size:1rem}
.video-box{width:100%;aspect-ratio:16/9;background:#000;margin-bottom:10px}
.video-box video,.video-box iframe{width:100%;height:100%;border:none}
.video-box img{width:100%;height:100%;object-fit:contain}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-size:.85rem;z-index:400;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">NaPlus</div>
  <div class="header-btns">
    <button class="btn-creator btn-exit" onclick="setCreator(false)">Salir</button>
    <button class="btn-creator" id="btnAdmin" onclick="toggleCreator()">Modo Creador</button>
  </div>
</header>

<div class="hero">
  <h1>NaPlus Streaming</h1>
  <p>Seleccioná cualquier película o serie para ver los detalles.</p>
  <div class="searchbar">
    <input type="search" id="search" placeholder="Buscar películas y series..." oninput="render()">
    <button class="btn-creator" id="listBtn" onclick="goList()">🔖 Mi lista (0)</button>
  </div>
</div>

<div id="searchSec" style="display:none">
  <div class="section-title">Resultados</div>
  <div class="grid" id="resultsGrid"></div>
</div>
<div id="mainSecs">
  <div id="recentSec"><div class="section-title">Recientes</div><div class="grid" id="recentGrid"></div></div>
  <div id="listSec"><div class="section-title">Mi lista</div><div class="grid" id="listGrid"></div></div>
  <div class="section-title">Películas</div>
  <div class="grid" id="moviesGrid"></div>
  <div class="section-title">Series</div>
  <div class="grid" id="seriesGrid"></div>
</div>

<!-- Detalle -->
<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="video-box" id="videoBox"></div>
    <h3 id="detailTitle"></h3>
    <p id="detailMeta" style="color:var(--accent-light);font-size:.85rem;margin-bottom:8px"></p>
    <p id="detailDesc" style="color:var(--text-muted);font-size:.85rem;margin-bottom:15px"></p>
    <div class="form-btns" id="detailBtns"></div>
  </div>
</div>

<!-- Acceso creador -->
<div class="modal" id="loginModal">
  <div class="modal-content">
    <h3>Modo Creador</h3>
    <p class="hint">Pegá tu token de GitHub. Se guarda solo en este dispositivo y nunca está en el código de la página.</p>
    <form onsubmit="doLogin(event)">
      <div class="form-group"><label>Repositorio (usuario/repositorio)</label><input type="text" id="repoInput" required placeholder="tuusuario/turepo" autocapitalize="off" autocomplete="off"></div>
      <div class="form-group"><label>Token de GitHub</label><input type="password" id="tokenInput" required autocomplete="off"></div>
      <div class="form-btns">
        <button type="button" class="btn-sec" onclick="closeLogin()">Cancelar</button>
        <button type="submit" class="btn-pri">Entrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Formulario contenido -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <h3 id="formTitle">Subir contenido</h3>
    <form onsubmit="saveData(event)">
      <input type="hidden" id="editId">
      <div class="form-group"><label>Tipo</label>
        <select id="type"><option value="movie">Película</option><option value="series">Serie</option></select></div>
      <div class="form-group"><label>Título</label><input type="text" id="title" required></div>
      <div class="form-group"><label>Géneros (podés elegir varios)</label>
        <div class="chips" id="genreChips"></div>
        <input type="text" id="genreOther" placeholder="Otros géneros (separados por coma)"></div>
      <div class="form-group"><label>Año</label><input type="number" id="year" required placeholder="2026"></div>
      <div class="form-group"><label>Sinopsis / Descripción</label><textarea id="desc" rows="3"></textarea></div>
      <div class="form-group"><label>Portada: link de imagen (opcional)</label><input type="url" id="cover" placeholder="https://..."></div>
      <div class="form-group"><label>o elegí una imagen de tu galería</label><input type="file" id="coverFile" accept="image/*"></div>
      <div class="form-group"><label>Link del video (Telegram, YouTube...)</label><input type="url" id="video" placeholder="https://t.me/..."></div>
      <div class="form-btns">
        <button type="button" class="btn-sec" onclick="closeAdmin()">Cancelar</button>
        <button type="submit" class="btn-pri">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirmar -->
<div class="modal" id="dialogModal">
  <div class="modal-content">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg" class="hint"></p>
    <div class="form-btns">
      <button class="btn-sec" id="dlgCancel">Cancelar</button>
      <button class="btn-pri" id="dlgOk">Eliminar</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const NO_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='%23140d24'/><text x='50%' y='50%' fill='%2394a3b8' font-size='16' text-anchor='middle' font-family='sans-serif'>Sin portada</text></svg>";
const CFG_KEY = 'naPlus_cfg';
const LIST_KEY = 'naPlus_list';
const DATA_FILE = 'content.json';
const GENRES = ['Acción','Aventura','Comedia','Drama','Terror','Romance','Ciencia ficción','Fantasía','Suspenso','Misterio','Animación','Documental','Familiar','Musical'];

let catalog = [], isCreator = false, pendingCover = '', existingCover = '';
let loadFailed = false, dirty = false, currentId = null, saved = [];
try { saved = JSON.parse(localStorage.getItem(LIST_KEY)) || []; } catch (e) {}

const genresOf = item => Array.isArray(item.genres) ? item.genres : String(item.genre || '').split(',').map(s => s.trim()).filter(Boolean);
const isSaved = id => saved.some(x => x == id);

function getCfg() { try { return JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { return null; } }
function guessRepo() {
  const h = location.hostname;
  if (!h.endsWith('.github.io')) return '';
  const r = location.pathname.split('/')[1];
  return h.split('.')[0] + '/' + (r && !r.includes('.') ? r : h);
}

async function loadCatalog() {
  const tries = [[DATA_FILE + '?t=' + Date.now(), { cache: 'no-store' }]];
  const repo = (getCfg() || {}).repo || guessRepo();
  if (repo) tries.push([`https://api.github.com/repos/${repo}/contents/${DATA_FILE}`, { headers: { Accept: 'application/vnd.github.raw+json' } }]);
  let missing = false;
  for (const [url, opt] of tries) {
    try {
      const r = await fetch(url, opt);
      if (r.ok) { const d = await r.json(); if (Array.isArray(d)) { catalog = d; loadFailed = false; render(); return; } }
      else if (r.status === 404) missing = true;
    } catch (e) {}
  }
  loadFailed = !missing; render();
}

function b64(str) {
  const bytes = new TextEncoder().encode(str);
  let s = '';
  for (let i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(s);
}

function gh(cfg, method, body) {
  return fetch(`https://api.github.com/repos/${cfg.repo}/contents/${DATA_FILE}`, {
    method,
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + cfg.token, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
}

async function ghMsg(res) { try { return (await res.json()).message || ''; } catch (e) { return ''; } }

async function persist() {
  const cfg = getCfg();
  if (!cfg) { openLogin(); return; }
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      let sha;
      const g = await gh(cfg, 'GET');
      if (g.ok) sha = (await g.json()).sha;
      else if (g.status !== 404) throw { status: g.status, msg: await ghMsg(g) };
      const p = await gh(cfg, 'PUT', { message: 'Actualizar catálogo', content: b64(JSON.stringify(catalog, null, 1)), ...(sha ? { sha } : {}) });
      if (p.ok) { dirty = false; toast('Guardado. Los demás lo verán en 1 o 2 minutos.'); return; }
      if ((p.status === 409 || p.status === 422) && attempt === 0) continue;
      throw { status: p.status, msg: await ghMsg(p) };
    }
  } catch (e) { ghFail(e); }
}

function ghFail(e) {
  const s = e && e.status, m = (e && e.msg) || '';
  if (s === 401) { toast('GitHub no aceptó el token. Pegá uno nuevo.', 7000); openLogin(); }
  else if (s === 403) { toast('El token no tiene permiso para escribir. Activá Contents: Read and write.', 8000); openLogin(); }
  else if (s === 404) { toast('No se encontró el repositorio o no tenés acceso.', 7000); openLogin(); }
  else toast('No se pudo guardar' + (s ? ' (error ' + s + ')' : '') + '. Probá de nuevo.', 6000);
}

let toastTimer;
function toast(msg, ms = 3500) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms);
}

function confirmDialog(title, msg) {
  return new Promise(resolve => {
    $('dlgTitle').textContent = title; $('dlgMsg').textContent = msg;
    $('dialogModal').style.display = 'flex';
    const done = v => { $('dialogModal').style.display = 'none'; $('dlgOk').onclick = $('dlgCancel').onclick = null; resolve(v); };
    $('dlgOk').onclick = () => done(true);
    $('dlgCancel').onclick = () => done(false);
  });
}

function makeCard(item) {
  const div = document.createElement('div');
  div.className = 'card';
  const on = isSaved(item.id);
  div.innerHTML = `
    <button class="card-save${on ? ' on' : ''}" aria-label="Mi lista">${on ? '✓' : '＋'}</button>
    <div class="card-admin-btns">
      <button class="edit" aria-label="Editar">✏️</button>
      <button class="del" aria-label="Eliminar">🗑️</button>
    </div>
    <img src="${esc(item.cover || NO_COVER)}" alt="Portada de ${esc(item.title)}">
    <div class="card-info">
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-sub">${esc(genresOf(item).join(', '))} •${esc(item.year)}</div>
    </div>`;
  div.querySelector('img').onerror = function () { this.onerror = null; this.src = NO_COVER; };
  div.onclick = () => showDetail(item.id);
  div.querySelector('.card-save').onclick = e => { e.stopPropagation(); toggleSaved(item.id); };
  div.querySelector('.edit').onclick = e => { e.stopPropagation(); editItem(item.id); };
  div.querySelector('.del').onclick = e => { e.stopPropagation(); deleteItem(item.id); };
  return div;
}

function fillGrid(id, items, emptyMsg) {
  const g = $(id); g.innerHTML = '';
  items.forEach(i => g.appendChild(makeCard(i)));
  if (!items.length && emptyMsg) g.innerHTML = `<p class="empty">${emptyMsg}</p>`;
}

function render() {
  const q = norm($('search').value.trim());
  const sorted = catalog.slice().sort((a, b) => b.id - a.id);
  const savedItems = saved.map(id => catalog.find(x => x.id == id)).filter(Boolean);
  $('listBtn').textContent = `🔖 Mi lista (${savedItems.length})`;
  $('searchSec').style.display = q ? 'block' : 'none';
  $('mainSecs').style.display = q ? 'none' : 'block';
  if (q) {
    fillGrid('resultsGrid', sorted.filter(i => norm([i.title, genresOf(i).join(' '), i.desc, i.year, i.type === 'movie' ? 'pelicula' : 'serie'].join(' ')).includes(q)), 'No encontramos nada con esa búsqueda.');
    return;
  }
  const empty = loadFailed ? 'No se pudo cargar el catálogo. Recargá la página.' : 'Todavía no hay contenido acá.';
  $('recentSec').style.display = sorted.length ? 'block' : 'none';
  fillGrid('recentGrid', sorted.slice(0, 10));
  $('listSec').style.display = savedItems.length ? 'block' : 'none';
  fillGrid('listGrid', savedItems);
  fillGrid('moviesGrid', sorted.filter(i => i.type === 'movie'), empty);
  fillGrid('seriesGrid', sorted.filter(i => i.type !== 'movie'), empty);
}

function toggleSaved(id) {
  const i = saved.findIndex(x => x == id);
  if (i > -1) saved.splice(i, 1); else saved.push(id);
  try { localStorage.setItem(LIST_KEY, JSON.stringify(saved)); } catch (e) {}
  render(); updateDetailSave();
}

function updateDetailSave() {
  const b = $('detailSave');
  if (b && currentId != null) b.textContent = isSaved(currentId) ? '✓ En mi lista' : '＋ Mi lista';
}

function goList() {
  if (!saved.some(id => catalog.find(x => x.id == id))) { toast('Tu lista está vacía.'); return; }
  $('search').value = ''; render();
  $('listSec').scrollIntoView({ behavior: 'smooth' });
}

function setCreator(on) {
  isCreator = on;
  document.body.classList.toggle('creator', on);
  $('btnAdmin').textContent = on ? '+ Agregar' : 'Modo Creador';
}

function toggleCreator() {
  if (isCreator) { openAdmin(); return; }
  if (getCfg()) { setCreator(true); toast('Modo creador activado'); return; }
  openLogin();
}

function openLogin() {
  $('repoInput').value = (getCfg() || {}).repo || guessRepo();
  $('tokenInput').value = '';
  $('loginModal').style.display = 'flex';
}

function closeLogin() { $('loginModal').style.display = 'none'; $('tokenInput').value = ''; }

async function doLogin(e) {
  e.preventDefault();
  const repo = $('repoInput').value.trim().replace(/^\/+|\/+$/g, '');
  const token = $('tokenInput').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) { toast('Revisá el repositorio y el token.'); return; }
  toast('Comprobando token...');
  try {
    const r = await fetch('https://api.github.com/repos/' + repo, { headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token } });
    if (r.status === 401) { toast('GitHub no aceptó el token.', 7000); return; }
    if (r.status === 404) { toast('No se encontró ese repositorio.', 7000); return; }
    if (r.ok) { const d = await r.json(); if (d.permissions && d.permissions.push === false) { toast('Este token no tiene permiso de escritura.', 7000); return; } }
  } catch (err) {}
  localStorage.setItem(CFG_KEY, JSON.stringify({ repo, token }));
  closeLogin(); setCreator(true); toast('Modo creador activado');
  if (dirty) persist();
}

function buildChips(sel) {
  const box = $('genreChips'); box.innerHTML = '';
  GENRES.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (sel.includes(g) ? ' on' : '');
    b.textContent = g; b.onclick = () => b.classList.toggle('on');
    box.appendChild(b);
  });
  $('genreOther').value = sel.filter(g => !GENRES.includes(g)).join(', ');
}

function openAdmin(item = null) {
  $('editId').value = item ? item.id : '';
  $('formTitle').textContent = item ? 'Editar contenido' : 'Subir contenido';
  $('type').value = item ? item.type : 'movie';
  $('title').value = item ? item.title : '';
  buildChips(item ? genresOf(item) : []);
  $('year').value = item ? item.year : '2026';
  $('desc').value = item ? item.desc : '';
  $('video').value = item ? item.video : '';
  existingCover = item ? (item.cover || '') : '';
  $('cover').value = existingCover.startsWith('data:') ? '' : existingCover;
  $('coverFile').value = ''; pendingCover = '';
  $('adminModal').style.display = 'flex';
}

function closeAdmin() { $('adminModal').style.display = 'none'; }

$('coverFile').onchange = e => {
  const f = e.target.files[0];
  if (!f) { pendingCover = ''; return; }
  const reader = new FileReader();
  reader.onload = () => { pendingCover = reader.result; };
  reader.readAsDataURL(f);
};

function saveData(e) {
  e.preventDefault();
  const id = $('editId').value;
  const chipSel = Array.from($('genreChips').querySelectorAll('.chip.on')).map(c => c.textContent);
  const otherSel = $('genreOther').value.split(',').map(s => s.trim()).filter(Boolean);
  const genres = Array.from(new Set([...chipSel, ...otherSel]));
  const coverUrl = $('cover').value.trim();
  const cover = pendingCover || coverUrl || existingCover;

  const newI
