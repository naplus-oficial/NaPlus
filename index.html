<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus Lite - Streaming</title>
  <meta name="theme-color" content="#7c3aed">
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding-bottom: 75px; }
    header { position: absolute; top: 0; left: 0; right: 0; height: 60px; padding: 0 20px; display: flex; align-items: center; z-index: 1000; background: linear-gradient(180deg, rgba(7,4,13,0.9), transparent); }
    .logo { font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, var(--accent-light), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(7, 4, 13, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; }
    .nav-item { background: none; border: none; color: var(--text-gray); font-size: 0.6rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 33.33%; }
    .nav-item svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); }
    .view-section { display: none; padding-top: 70px; padding-bottom: 20px; }
    .view-section.active { display: block; }
    .section-title { font-size: 1.1rem; font-weight: 800; margin: 20px 15px 10px; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; padding: 0 15px; }
    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); cursor: pointer; position: relative; }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; }
    .card-info { padding: 6px; }
    .card-title { font-size: 0.7rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.6rem; color: var(--text-gray); }
    .search-box { padding: 15px; }
    .search-box input { width: 100%; padding: 10px 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-purple); color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 15px; align-items: center; justify-content: center; }
    .modal-box { background: #11091e; padding: 15px; border-radius: 8px; width: 100%; max-width: 450px; border: 1px solid var(--border-purple); }
    .video-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; margin-bottom: 10px; }
    .video-box iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    .btn-close { background: none; border: none; color: #fff; font-size: 1.2rem; float: right; cursor: pointer; margin-bottom: 5px; }
    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 0 15px; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus Lite</div>
  </header>

  <div id="viewHome" class="view-section active">
    <div class="section-title" style="margin-top:5px;">Películas (Internet Archive)</div>
    <div class="grid" id="homeGrid"></div>
  </div>

  <div id="viewSearch" class="view-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar película..." oninput="handleSearch()" onkeydown="checkSecretCode(event)">
    </div>
    <div class="section-title">Resultados</div>
    <div class="grid" id="searchGrid"></div>
  </div>

  <div id="viewList" class="view-section">
    <div class="section-title">Mi Lista</div>
    <div class="grid" id="myListGrid"></div>
  </div>

  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></button>Inicio
    </button>
    <button class="nav-item" id="navSearch" onclick="switchView('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Buscar
    </button>
    <button class="nav-item" id="navList" onclick="switchView('list')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>Mi Lista
    </button>
  </nav>

  <div class="modal-overlay" id="playerModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal()">✕</button>
      <div class="video-box" id="videoContainer"></div>
      <h3 id="modalTitle" style="font-size:0.95rem; margin-bottom:5px;"></h3>
      <p id="modalDesc" style="font-size:0.75rem; color:var(--text-gray);"></p>
    </div>
  </div>

  <script>
    let catalog = [];
    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    const GITHUB_REPO_OWNER = "ignacio12adrian-ux";
    const GITHUB_REPO_NAME = "NaPlus";
    const GITHUB_FILE_PATH = "database.json";

    async function loadCatalog() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_REPO_OWNER}/${GITHUB_REPO_NAME}/main/${GITHUB_FILE_PATH}?t=${Date.now()}`);
        if (res.ok) {
          const raw = await res.json();
          // FILTRO ESTRICTO: SOLO CONTENIDO CUYO ENLACE SEA DE INTERNET ARCHIVE (archive.org)
          catalog = Array.isArray(raw) ? raw.filter(item => item.video && item.video.includes('archive.org')) : [];
        }
      } catch(e) {
        catalog = [];
      }
      renderHome();
    }

    function switchView(view) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      if(view === 'home') { document.getElementById('viewHome').classList.add('active'); document.getElementById('navHome').classList.add('active'); renderHome(); }
      else if(view === 'search') { document.getElementById('viewSearch').classList.add('active'); document.getElementById('navSearch').classList.add('active'); }
      else if(view === 'list') { document.getElementById('viewList').classList.add('active'); document.getElementById('navList').classList.add('active'); renderList(); }
      window.scrollTo(0,0);
    }

    function renderHome() {
      const g = document.getElementById('homeGrid');
      g.innerHTML = '';
      if(catalog.length === 0) { g.innerHTML = '<div class="empty-msg">No hay películas de Internet Archive disponibles.</div>'; return; }
      catalog.forEach(item => g.appendChild(createCard(item)));
    }

    function renderList() {
      const g = document.getElementById('myListGrid');
      g.innerHTML = '';
      const items = catalog.filter(i => myFavorites.includes(i.id));
      if(items.length === 0) { g.innerHTML = '<div class="empty-msg">Sin elementos guardados.</div>'; return; }
      items.forEach(item => g.appendChild(createCard(item)));
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const g = document.getElementById('searchGrid');
      g.innerHTML = '';
      if(!q) return;
      const matches = catalog.filter(i => i.title.toLowerCase().includes(q));
      if(matches.length > 0) matches.forEach(i => g.appendChild(createCard(i)));
      else g.innerHTML = '<div class="empty-msg">Sin resultados.</div>';
    }

    function createCard(item) {
      const div = document.createElement('div');
      div.className = 'card';
      div.onclick = () => openPlayer(item);
      div.innerHTML = `
        <img src="${item.cover || ''}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'150\'><rect width=\'100%\' height=\'100%\' fill=\'%231a1528\'/></svg>'">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.year || ''}</div>
        </div>
      `;
      return div;
    }

    function openPlayer(item) {
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalDesc').innerText = item.desc || '';
      document.getElementById('videoContainer').innerHTML = `<iframe src="${item.video}" allowfullscreen></iframe>`;
      document.getElementById('playerModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('videoContainer').innerHTML = '';
      document.getElementById('playerModal').style.display = 'none';
    }

    function checkSecretCode(e) {
      if (e.key === 'Enter' && e.target.value.trim() === "9009") {
        alert("Modo Lite Activo. Sube tus aportes con enlaces de Internet Archive a tu database.json.");
        e.target.value = '';
      }
    }

    loadCatalog();
  </script>
</body>
</html>
