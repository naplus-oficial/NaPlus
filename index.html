<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    button { transition: transform 0.15s ease; }
    button:active { transform: scale(0.95); }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 0;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    /* BARRA SUPERIOR */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transform: translateZ(0);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* NAVEGACIÓN INFERIOR */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
      transform: translateZ(0);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.65rem;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 25%;
      transition: color 0.2s ease;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); transform: scale(1.08); }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; will-change: opacity; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList { padding-top: 75px; }

    .hero { padding: 15px 20px 5px; }
    .hero#searchContainer { padding: 15px 20px 10px; }
    body.search-active .hero#searchContainer { padding-top: 80px; }

    /* CARRUSEL HERO */
    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
      transform: translateZ(0);
      touch-action: pan-y;
    }

    .hbo-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }

    .hbo-slide.active { opacity: 1; z-index: 2; }

    .hbo-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.3) 0%, rgba(7,4,13,0.6) 60%, var(--bg-dark) 100%);
      pointer-events: none;
    }

    .hbo-slide-content {
      position: relative;
      z-index: 3;
      text-align: left;
    }

    .hbo-slide-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .hbo-slide-meta {
      font-size: 0.8rem;
      color: var(--accent-light);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .hbo-slide-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hbo-btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .hbo-btn-add:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }
    .hbo-btn-add svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .hbo-btn-add.saved {
      border-color: var(--accent-light);
      background: rgba(124, 58, 237, 0.25);
    }
    .hbo-btn-add.saved svg {
      fill: var(--accent-light);
      stroke: var(--accent-light);
    }

    .hbo-slider-dots {
      position: absolute;
      bottom: 12px; right: 20px;
      z-index: 10;
      display: flex;
      gap: 5px;
      pointer-events: auto;
    }

    .hbo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
    }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    /* BUSCADOR */
    .search-box { width: 100%; max-width: 500px; position: relative; }
    .search-box .search-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
      display: flex; align-items: center;
      pointer-events: none;
    }
    .search-box .search-icon svg {
      width: 17px; height: 17px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .search-box input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent-light); background: rgba(255, 255, 255, 0.08); }

    .clear-search-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-gray); font-size: 1.1rem;
      cursor: pointer; padding: 4px;
      display: none;
    }
    .clear-search-btn:hover { color: #fff; }

    /* SCROLL HORIZONTAL */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin: 20px 20px 10px;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    /* GRILLAS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 12px;
      padding: 0 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      position: relative;
      transform: translateZ(0);
    }
    .card:active { transform: scale(0.97); }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #1a1528;
      pointer-events: none;
    }

    .card-info { padding: 6px 8px; pointer-events: none; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute;
      top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .card-fav-btn:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }
    .card-fav-btn svg {
      width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .admin-btns {
      display: none;
      position: absolute;
      top: 6px; right: 6px;
      gap: 4px;
      z-index: 10;
    }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 26px; height: 26px;
      border-radius: 50%;
      font-size: 0.7rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 2000;
      padding: 15px;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }

    .modal-box {
      background: #11091e;
      padding: 20px;
      border-radius: 10px;
      width: 100%; max-width: 480px;
      border: 1px solid var(--border-purple);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* MODAL SERIE ESTÉTICO - PORTADA COMPLETA SIN CUADRO NEGRO */
    .modal-box-series {
      background: #07040d;
      padding: 0;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      position: fixed;
      inset: 0;
      overflow-y: auto;
      z-index: 2100;
      display: none;
      -webkit-overflow-scrolling: touch;
    }

    /* BARRA SUPERIOR FLOTANTE SOBRE LA PORTADA */
    .stream-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.7) 0%, rgba(7,4,13,0) 100%);
      z-index: 2260;
      pointer-events: none;
    }
    .stream-top-btn {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .stream-top-btn:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }

    .stream-header-bg {
      position: relative;
      width: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 70px 20px 16px 20px;
    }
    .stream-header-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.85) 75%, #07040d 100%);
    }

    .stream-info-container {
      position: relative;
      z-index: 2;
    }
    .stream-title-text {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }
    .stream-badges-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.75rem;
    }
    .stream-badge-box {
      background: rgba(255,255,255,0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.65rem;
    }
    .stream-meta-info {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 10px;
      font-weight: 500;
    }

    .stream-play-main-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(255,255,255,0.15);
    }

    .stream-actions-row {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 10px;
    }
    .stream-action-ico-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .stream-action-ico-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .stream-action-ico-btn.active-list .stream-action-ico-circle {
      background: rgba(124, 58, 237, 0.3);
      border-color: var(--accent-light);
      color: var(--accent-light);
    }

    .stream-synopsis {
      font-size: 0.85rem;
      color: var(--text-gray);
      line-height: 1.35;
      margin-bottom: 4px;
    }
    .stream-synopsis.truncated {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .stream-read-more {
      background: none; border: none;
      color: var(--accent-light); font-weight: 700;
      font-size: 0.8rem; cursor: pointer; padding: 0; margin-top: 2px;
      display: inline-block;
    }

    /* PESTAÑAS */
    .stream-tabs-bar {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0 20px;
      gap: 30px;
    }
    .stream-tab {
      background: none; border: none;
      color: #fff;
      font-size: 0.95rem; font-weight: 700;
      padding: 10px 0;
      cursor: pointer;
      position: relative;
    }
    .stream-tab::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 3px;
      background: #fff;
      border-radius: 3px 3px 0 0;
    }

    .stream-content-area {
      padding: 14px 20px 40px 20px;
    }
    .stream-season-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .stream-season-select {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }

    /* LISTA DE EPISODIOS */
    .stream-episodes-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .stream-ep-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .stream-ep-thumb-box {
      width: 120px; height: 68px;
      border-radius: 6px;
      overflow: hidden;
      background: #1a1528;
      position: relative;
      flex-shrink: 0;
    }
    .stream-ep-thumb-box img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .stream-ep-play-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 1rem;
    }
    .stream-ep-info {
      flex-grow: 1;
      overflow: hidden;
    }
    .stream-ep-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .stream-ep-duration {
      font-size: 0.75rem;
      color: var(--text-gray);
    }
    .stream-edit-ep-btn {
      display: none;
      background: #2563eb; color: #fff; border: none;
      padding: 3px 8px; border-radius: 4px; font-size: 0.65rem;
      font-weight: 600; cursor: pointer; margin-top: 4px;
    }
    body.creator-mode .stream-edit-ep-btn { display: inline-block; }

    .btn-close {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      color: #fff; border: 1px solid rgba(255,255,255,0.15);
      width: 34px; height: 34px; border-radius: 50%;
      font-size: 1rem; cursor: pointer;
      z-index: 2250;
      display: flex; align-items: center; justify-content: center;
    }

    .modal-box h3 { margin-bottom: 12px; padding-right: 30px; font-size: 1.1rem; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 4px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px 12px;
      background: #07040d; border: 1px solid var(--border-purple);
      color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    .video-box { 
      width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 12px; border-radius: 6px; overflow: hidden; position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .video-box iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
    
    .native-player-container {
      width: 100%; height: 100%; position: relative; background: #000; display: flex; flex-direction: column; justify-content: center;
    }
    .native-player-container video { width: 100%; height: 100%; object-fit: contain; }
    .player-controls-bar {
      position: absolute; top: 10px; right: 10px; z-index: 10;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; gap: 6px;
    }
    .player-controls-bar label { font-size: 0.7rem; color: #cbd5e1; }
    .quality-selector { background: #07040d; color: #fff; border: 1px solid var(--border-purple); border-radius: 4px; font-size: 0.7rem; padding: 2px 4px; outline: none; }

    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 0 20px; font-style: italic; }
    .admin-episode-card { background: #07040d; border: 1px solid var(--border-purple); padding: 10px; border-radius: 6px; margin-bottom: 8px; position: relative; }

    @media (max-width: 600px) {
      #detailModal .modal-box, #episodeModal .modal-box {
        max-width: 100%; 
        max-height: 90vh; 
        height: auto; 
        border-radius: 10px; 
        padding: 16px; 
      }
    }

    :fullscreen .btn-close, :-webkit-full-screen .btn-close { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
  </header>

  <div id="viewHome" class="view-section active">
    <div class="hbo-hero-slider" id="hboHeroSlider">
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>

    <div class="hero" id="searchContainer">
      <div class="search-box">
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="searchInput" placeholder="Buscar película o serie..." oninput="handleSearch()" onkeydown="checkSecretCode(event)">
        <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearchInput()" type="button">✕</button>
      </div>
    </div>

    <div id="searchResultsContainer" style="display: none;">
      <div class="section-title">Resultados de Búsqueda</div>
      <div class="grid" id="searchGrid"></div>
    </div>

    <div id="mainHomeContent">
      <div class="section-title">🔥 Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

    let currentSlide = 0;
    let sliderInterval = null;

    function restartSliderInterval() {
      if (sliderInterval) clearInterval(sliderInterval);
      const count = document.querySelectorAll('.hbo-slide').length;
      if (!count) return;
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % count;
        goToSlide(currentSlide);
      }, 5000);
    }

    function renderHeroSlider() {
      const sliderContainer = document.getElementById('hboHeroSlider');
      const dotsContainer = document.getElementById('hboSliderDots');
      
      const recentItems = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).slice(0, 6);
      if (recentItems.length === 0) return;

      const existingSlides = sliderContainer.querySelectorAll('.hbo-slide');
      existingSlides.forEach(s => s.remove());
      dotsContainer.innerHTML = '';

      recentItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = `hbo-slide ${idx === 0 ? 'active' : ''}`;
        slide.style.backgroundImage = `url('${item.cover}')`;
        slide.onclick = () => openContentDetail(item.id);

        const isFav = myFavorites.includes(item.id);
        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">${item.year} • ${item.genre.split(',')[0]}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="event.stopPropagation(); openContentDetail(${item.id})">▶ Reproducir</button>
              <button class="hbo-btn-add ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="${isFav ? 'Quitar' : 'Guardar'}">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
          </div>
        `;
        sliderContainer.insertBefore(slide, dotsContainer);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = (e) => { e.stopPropagation(); goToSlide(idx); restartSliderInterval(); };
        dotsContainer.appendChild(dot);
      });

      restartSliderInterval();
    }

    function goToSlide(idx) {
      currentSlide = idx;
      const slides = document.querySelectorAll('.hbo-slide');
      const dots = document.querySelectorAll('.hbo-dot');
      slides.forEach((s, i) => s.classList.toggle('active', i === idx));
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    (function setupSliderSwipe() {
      const slider = document.getElementById('hboHeroSlider');
      if (!slider) return;
      let startX = null, startY = null, dragging = false;

      slider.addEventListener('pointerdown', e => {
        startX = e.clientX; startY = e.clientY; dragging = true;
      });

      slider.addEventListener('pointerup', e => {
        if (!dragging || startX === null) { dragging = false; return; }
        dragging = false;
        const dx = e.clientX - startX;
        const dy = e.clientY - (startY || 0);
        const count = document.querySelectorAll('.hbo-slide').length;
        if (count > 1 && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          let next = currentSlide + (dx < 0 ? 1 : -1);
          if (next < 0) next = count - 1;
          if (next >= count) next = 0;
          goToSlide(next);
          restartSliderInterval();
        }
        startX = null; startY = null;
      });

      slider.addEventListener('pointercancel', () => { dragging = false; startX = null; });
    })();

    function renderHomeSections() {
      const searchInput = document.getElementById('searchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const searchContainer = document.getElementById('searchResultsContainer');
      const mainContent = document.getElementById('mainHomeContent');
      const heroSlider = document.getElementById('hboHeroSlider');
      const clearBtn = document.getElementById('clearSearchBtn');

      if (clearBtn) {
        clearBtn.style.display = query.length > 0 ? 'block' : 'none';
      }

      const searching = query.length > 0 && query !== "9009";
      document.body.classList.toggle('search-active', searching);

      if (searching) {
        pushSearchState();
        heroSlider.style.display = 'none';
        searchContainer.style.display = 'block';
        mainContent.style.display = 'none';
        const searchGrid = document.getElementById('searchGrid');
        searchGrid.innerHTML = '';
        const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || i.genre.toLowerCase().includes(query));
        if (matches.length > 0) {
          matches.forEach(item => searchGrid.appendChild(createCardElement(item)));
        } else {
          searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
        }
        return;
      } else {
        heroSlider.style.display = 'block';
        searchContainer.style.display = 'none';
        mainContent.style.display = 'block';
        renderHeroSlider();
      }

      const recentScroll = document.getElementById('recentScroll');

      recentSorted.forEach(item => recentScroll.appendChild(createCardElement(item)));

      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      const topSorted = [...catalog].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10);
      topSorted.forEach(item => topScroll.appendChild(createCardElement(item)));

      const genreContainer = document.getElementById('genreRowsContainer');
      genreContainer.innerHTML = '';

      let allIndividualGenres = [];
      catalog.forEach(item => {
        if (item.genre) {
          item.genre.split(',').forEach(g => {
            const cleanG = g.trim();
            if (cleanG && !allIndividualGenres.includes(cleanG)) allIndividualGenres.push(cleanG);
          });
        }
      });
      allIndividualGenres.sort();

      allIndividualGenres.forEach(genre => {
        const genreItems = catalog.filter(i => {
          if (!i.genre) return false;
          const itemGenres = i.genre.split(',').map(x => x.trim().toLowerCase());
          return itemGenres.includes(genre.toLowerCase());

        if (genreItems.length > 0) {

          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const type = document.getElementById('typeInput').value;

      let seasonsData = [];
      if (type === 'series') {
        const seasonBlocks = document.querySelectorAll('.season-item-block');
        seasonBlocks.forEach(sBlock => {
          const sName = sBlock.querySelector('.season-name').value.trim();
          const epRows = sBlock.querySelectorAll('.ep-item-row');
          let eps = [];
          
          epRows.forEach((row, rIdx) => {
            const numInput = row.querySelector('.ep-num');
            const titleInput = row.querySelector('.ep-title');
            const durationInput = row.querySelector('.ep-duration');
            const imgInput = row.querySelector('.ep-img');
            const descInput = row.querySelector('.ep-desc');
            const videoInput = row.querySelector('.ep-video');

            eps.push({
              num: numInput ? (parseInt(numInput.value) || (rIdx + 1)) : (rIdx + 1),
              title: titleInput ? titleInput.value.trim() : '',
              duration: durationInput ? durationInput.value.trim() : '45 min',
              img: imgInput ? imgInput.value.trim() : '',
              desc: descInput ? descInput.value.trim() : '',
              video: videoInput ? videoInput.value.trim() : ''
            });
          });

          eps.sort((a, b) => a.num - b.num);
          seasonsData.push({ name: sName, episodes: eps });
        });
      }

      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: type,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        trailer: document.getElementById('trailerInput').value.trim(),
        video: type === 'movie' ? document.getElementById('videoInput').value.trim() : '',
        seasons: type === 'series' ? seasonsData : [],
        views: id ? (catalog.find(x => x.id == id)?.views || 0) : Math.floor(Math.random() * 500) + 50,
        dateAdded: id ? (catalog.find(x => x.id == id)?.dateAdded || Date.now()) : Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
      closeModal('uploadModal');

      await publishToGitHubAutomatically();
    }

    async function publishToGitHubAutomatically() {
      let token = localStorage.getItem('naPlus_gh_token');
      
      if (!token || !token.startsWith('ghp_')) {
        token = prompt("Ingresá tu Token de GitHub (ghp_...) para publicar globalmente:");
        if (token && token.startsWith('ghp_')) {
          token = token.trim();
          localStorage.setItem('naPlus_gh_token', token);
        } else {
          alert("⚠️ Guardado localmente. Ingresá un Token válido cuando desees sincronizar.");
          return;
        }
      }

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Publicando...";

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
        });
        
        if (!getRes.ok) {
          alert("❌ Token inválido o expirado.");
          localStorage.removeItem('naPlus_gh_token');
          return;
        }

        const getData = await getRes.json();
        const sha = getData.sha;

        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        const catalogJson = JSON.stringify(catalog, null, 2);
        
        if (fileText.includes('/*CATALOG_START*/')) {
          fileText = fileText.replace(/\/\*CATALOG_START\*\/[\s\S]*?\/\*CATALOG_END\*\//, `/*CATALOG_START*/${catalogJson}/*CATALOG_END*/`);
        } else {
          fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${catalogJson};`);
        }

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Actualización automática NaPlus',
            content: updatedBase64,
            sha: sha
          })
        });

        if (putRes.ok) {
          alert("✅ ¡Éxito! Publicado globalmente.");
        } else {
          alert("❌ Error al actualizar en GitHub.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Error de red.");
      } finally {
        if (saveBtn) saveBtn.innerText = "Guardar y Publicar";
      }
    }

    let currentSeriesData = null;

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;

      item.views = (item.views || 0) + 1;
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));

      if (item.type === 'series') {
        currentSeriesData = item;
        const headerBg = document.getElementById('streamHeaderBg');
        headerBg.style.backgroundImage = `url('${item.cover}')`;

        document.getElementById('seriesTitle').innerText = item.title;
        
        const seasonsCount = item.seasons ? item.seasons.length : 0;
        document.getElementById('seriesMeta').innerText = `${item.year} • ${seasonsCount} temporada${seasonsCount > 1 ? 's' : ''} • ${item.genre}`;
        
        const descEl = document.getElementById('seriesDesc');
        const readMoreBtn = document.getElementById('readMoreBtn');
        descEl.innerText = item.desc || 'Sin sinopsis.';
        descEl.classList.add('truncated');

        setTimeout(() => {
          if (descEl.scrollHeight > descEl.clientHeight) {
            readMoreBtn.style.display = 'inline-block';
          } else {
            readMoreBtn.style.display = 'none';
          }
        }, 50);

        updateSeriesModalFavButton();

        const seasonSelect = document.getElementById('seasonSelect');
        seasonSelect.innerHTML = '';
        if (item.seasons && item.seasons.length > 0) {
          item.seasons.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = s.name;
            seasonSelect.appendChild(opt);
          });
        }
        renderEpisodesForSelectedSeason();
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        document.getElementById('detailTitle').innerText = item.title;
        document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
        document.getElementById('detailViews').innerText = `👁️ ${item.views} reproducciones`;
        document.getElementById('detailDesc').innerText = item.desc || 'Sin descripción.';

        const vBox = document.getElementById('videoBox');
        renderVideoInBox(vBox, item.video);
        document.getElementById('detailModal').style.display = 'flex';
      }
    }

    function toggleSynopsis() {
      const descEl = document.getElementById('seriesDesc');
      const btn = document.getElementById('readMoreBtn');
      if (descEl.classList.contains('truncated')) {
        descEl.classList.remove('truncated');
        btn.innerText = 'Menos';
      } else {
        descEl.classList.add('truncated');
        btn.innerText = 'Más';
      }
    }

    function getSeriesImagePool(seriesData) {
      const pool = [];
      if (seriesData.cover) pool.push(seriesData.cover);
      (seriesData.seasons || []).forEach(s => {
        (s.episodes || []).forEach(e => {
          if (e.img && typeof e.img === 'string' && e.img.trim() && e.img.trim() !== 'null') {
            pool.push(e.img.trim());
          }
        });
      });
      return pool.length ? pool : [seriesData.cover];
    }

    function renderEpisodesForSelectedSeason() {
      if (!currentSeriesData || !currentSeriesData.seasons) return;
      const sIdx = document.getElementById('seasonSelect').value;
      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');

      if (!season || !season.episodes || season.episodes.length === 0) {
        container.innerHTML = '<div class="empty-msg">No hay capítulos en esta temporada.</div>';
        return;
      }

      const imagePool = getSeriesImagePool(currentSeriesData);
      const fragment = document.createDocumentFragment();

      season.episodes.forEach((ep, eIdx) => {
        const epNumDisplay = ep.num !== undefined ? ep.num : (eIdx + 1);
        const hasOwnImg = ep && ep.img && typeof ep.img === 'string' && ep.img.trim() !== '' && ep.img.trim() !== 'null';
        const thumbImg = hasOwnImg ? ep.img.trim() : imagePool[Math.floor(Math.random() * imagePool.length)];
        const epDuration = ep.duration || '45 min';
        
        const itemDiv = document.createElement('div');
        itemDiv.className = 'stream-ep-item';
        itemDiv.innerHTML = `
          <div class="stream-ep-thumb-box" onclick="playEpisode(${sIdx}, ${eIdx})">
            <img src="${thumbImg}" data-orig="${thumbImg}" alt="Ep" loading="lazy" decoding="async" onerror="handleImgError(this)">
            <div class="stream-ep-play-overlay">▶</div>
          </div>
          <div class="stream-ep-info" onclick="playEpisode(${sIdx}, ${eIdx})">
            <div class="stream-ep-title">${epNumDisplay}. ${ep.title || 'Capítulo ' + epNumDisplay}</div>
            <div class="stream-ep-duration">${epDuration}</div>
            <button class="stream-edit-ep-btn" onclick="event.stopPropagation(); openSingleEpisodeEdit(${sIdx}, ${eIdx})">✏ Editar</button>
          </div>
        `;
        fragment.appendChild(itemDiv);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function playFirstEpisodeOfSeries() {
      if (!currentSeriesData || !currentSeriesData.seasons || !currentSeriesData.seasons.length) return;
      const firstSeason = currentSeriesData.seasons[0];
      if (!firstSeason.episodes || !firstSeason.episodes.length) return;
      playEpisode(0, 0);
    }

    function playTrailer() {
      if (!currentSeriesData || !currentSeriesData.trailer) {
        alert("Este contenido no tiene un tráiler disponible.");
        return;
      }
      document.getElementById('seriesModal').style.display = 'none';
      document.getElementById('epModalTitle').innerText = `Tráiler: ${currentSeriesData.title}`;
      document.getElementById('epModalDesc').innerText = "";
      const vBox = document.getElementById('episodeVideoBox');
      renderVideoInBox(vBox, currentSeriesData.trailer);
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function openSingleEpisodeEdit(seasonIdx, epIdx) {
      const season = currentSeriesData.seasons[seasonIdx];
      const ep = season.episodes[epIdx];
      document.getElementById('editEpSeasonIdx').value = seasonIdx;
      document.getElementById('editEpItemIdx').value = epIdx;
      document.getElementById('modalEpNum').value = ep.num !== undefined ? ep.num : 1;
      document.getElementById('modalEpTitle').value = ep.title || '';
      document.getElementById('modalEpDuration').value = ep.duration || '45 min';
      document.getElementById('modalEpImg').value = (ep.img && ep.img !== 'null') ? ep.img : '';
      document.getElementById('modalEpDesc').value = ep.desc || '';
      document.getElementById('modalEpVideo').value = ep.video || '';
      document.getElementById('seriesModal').style.display = 'none';
      document.getElementById('editEpisodeModal').style.display = 'flex';
    }

    async function saveSingleEpisodeEdit(e) {
      e.preventDefault();
      const sIdx = parseInt(document.getElementById('editEpSeasonIdx').value);
      const eIdx = parseInt(document.getElementById('editEpItemIdx').value);

      const updatedEp = {
        num: parseInt(document.getElementById('modalEpNum').value) || 1,
        title: document.getElementById('modalEpTitle').value.trim(),
        duration: document.getElementById('modalEpDuration').value.trim() || '45 min',
        img: document.getElementById('modalEpImg').value.trim(),
        desc: document.getElementById('modalEpDesc').value.trim(),
        video: document.getElementById('modalEpVideo').value.trim()
      };

      currentSeriesData.seasons[sIdx].episodes[eIdx] = updatedEp;
      currentSeriesData.seasons[sIdx].episodes.sort((a, b) => a.num - b.num);

      const catIdx = catalog.findIndex(x => x.id === currentSeriesData.id);
      if (catIdx !== -1) {
        catalog[catIdx] = currentSeriesData;
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      closeModal('editEpisodeModal');
      openContentDetail(currentSeriesData.id);
      await publishToGitHubAutomatically();
    }

    function playEpisode(seasonIdx, epIdx) {
      const ep = currentSeriesData.seasons[seasonIdx].episodes[epIdx];
      document.getElementById('seriesModal').style.display = 'none';
      const epNumDisplay = ep.num !== undefined ? ep.num : '1';
      document.getElementById('epModalTitle').innerText = `Capítulo ${epNumDisplay}: ${ep.title || ''}`;
      document.getElementById('epModalDesc').innerText = ep.desc || '';
      const vBox = document.getElementById('episodeVideoBox');
      renderVideoInBox(vBox, ep.video);
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function closeEpisodePlayer() {
      document.getElementById('episodeModal').style.display = 'none';
      document.getElementById('episodeVideoBox').innerHTML = '';
      if (currentSeriesData) {
        document.getElementById('seriesModal').style.display = 'block';
      }
    }

    function shareCurrentSeries() {
      if (navigator.share && currentSeriesData) {
        navigator.share({ title: currentSeriesData.title, text: currentSeriesData.desc, url: window.location.href }).catch(() => {});
      } else {
        alert("Enlace copiado al portapapeles.");
      }
    }

    function renderVideoInBox(vBox, vInput) {
      if (!vInput) {
        vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>';
        return;
      }

      if (vInput.includes('<iframe')) {
        vBox.innerHTML = vInput;
        const iframeEl = vBox.querySelector('iframe');
        if (iframeEl) {
          iframeEl.style.cssText = 'width:100%;height:100%;border:none;position:absolute;top:0;left:0;';
          iframeEl.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share');
          iframeEl.setAttribute('allowfullscreen', '');
          iframeEl.setAttribute('webkitallowfullscreen', '');
          iframeEl.setAttribute('mozallowfullscreen', '');
          iframeEl.setAttribute('scrolling', 'no');
        }
        return;
      }

      if (vInput.includes('youtube.com') || vInput.includes('youtu.be')) {
        let embedUrl = vInput.trim();
        if (embedUrl.includes('watch?v=')) {
          const videoId = embedUrl.split('watch?v=')[1].split('&')[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        } else if (embedUrl.includes('youtu.be/')) {
          const videoId = embedUrl.split('youtu.be/')[1].split(/[?#]/)[0];
          embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        } else if (!embedUrl.includes('/embed/')) {
          embedUrl = embedUrl.replace('watch?v=', 'embed/');
        }
        vBox.innerHTML = `
          <iframe 
            src="${embedUrl}" 
            frameborder="0" 
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;">
          </iframe>`;
        return;
      }

      if (vInput.includes('voe.sx')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('/e/') && !embedUrl.includes('/embed')) {
          const parts = embedUrl.split('voe.sx/');
          if (parts[1]) {
            const id = parts[1].split(/[?#/]/)[0];
            embedUrl = `https://voe.sx/e/${id}`;
          }
        }
        vBox.innerHTML = `
          <iframe 
            src="${embedUrl}" 
            frameborder="0" 
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;">
          </iframe>`;
        return;
      }

      if (vInput.includes('ok.ru')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('videoembed')) {
          const match = embedUrl.match(/\/video\/([0-9]+)/);
          if (match && match[1]) embedUrl = `https://ok.ru/videoembed/${match[1]}`;
        }
        vBox.innerHTML = `
          <iframe 
            src="${embedUrl}" 
            frameborder="0" 
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;">
          </iframe>`;
        return;
      }

      if (vInput.includes('vk.com') || vInput.includes('vkvideo.ru')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('video_ext.php')) {
          const match = embedUrl.match(/video(-?[0-9]+)_([0-9]+)/);
          if (match && match[1] && match[2]) {
            embedUrl = `https://vk.com/video_ext.php?oid=${match[1]}&id=${match[2]}&hd=2`;
          }
        }
        vBox.innerHTML = `
          <iframe 
            src="${embedUrl}" 
            frameborder="0" 
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;">
          </iframe>`;
        return;
      }

      if (vInput.includes('odysee.com')) {
        let embedUrl = vInput.trim();
        if (!embedUrl.includes('$/embed/')) {
          embedUrl = embedUrl.replace('odysee.com/', 'odysee.com/$/embed/');
        }
        vBox.innerHTML = `
          <iframe 
            src="${embedUrl}" 
            frameborder="0" 
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen; web-share"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;">
          </iframe>`;
        return;
      }

      let directUrl = vInput.trim();
      if (directUrl.includes('drive.google.com/file/d/')) {
        const match = directUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          directUrl = `https://docs.google.com/uc?export=download&id=${match[1]}`;
        }
      }

      vBox.innerHTML = `
        <div class="native-player-container">
          <div class="player-controls-bar">
            <label for="qualitySelect">Calidad:</label>
            <select id="qualitySelect" class="quality-selector" onchange="changeVideoQuality(this)">
              <option value="auto">Automática</option>
              <option value="1080">1080p</option>
              <option value="720">720p</option>
              <option value="480">480p</option>
            </select>
          </div>
          <video id="customHtmlVideo" src="${directUrl}" controls autoplay playsinline webkit-playsinline></video>
        </div>
      `;
    }

    function changeVideoQuality(selectElem) {
      const quality = selectElem.value;
      const videoEl = document.getElementById('customHtmlVideo');
      if (!videoEl) return;
      const isPaused = videoEl.paused;
      console.log("Cambiando calidad de video a: ", quality);
      if (!isPaused) videoEl.play();
    }

    renderHomeSections();
  </script>
</body>
