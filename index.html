<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  
  <!-- CONFIGURACIÓN PWA OFICIAL -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7c3aed">

  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    button { transition: transform 0.15s ease; }
    button:active { transform: scale(0.95); }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 0;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    /* ANIMACIONES PERSONALIZADAS */
    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.35); }
      50% { transform: scale(0.9); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .anim-pop {
      animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .anim-heart {
      animation: heartBeat 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* BARRA SUPERIOR */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transform: translateZ(0);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* NAVEGACIÓN INFERIOR (ESTILO HBO / 5 BOTONES) */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
      transform: translateZ(0);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.62rem;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 20%;
      transition: color 0.2s ease;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); transform: scale(1.08); }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; will-change: opacity; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList, #viewSearch { padding-top: 75px; }

    /* CARRUSEL HERO AUTOMÁTICO */
    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
      transform: translateZ(0);
    }

    .hbo-slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .hbo-slide {
      position: relative;
      min-width: 100%;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }

    .hbo-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.5) 60%, var(--bg-dark) 100%);
      pointer-events: none;
    }

    .hbo-slide-content {
      position: relative;
      z-index: 3;
      text-align: left;
    }

    .hbo-slide-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .hbo-slide-meta {
      font-size: 0.8rem;
      color: var(--accent-light);
      margin-bottom: 12px;
      font-weight: 500;
    }

    .hbo-slide-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hbo-btn-play {
      background: #fff;
      color: #000;
      border: none;
      padding: 9px 20px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .hbo-btn-add:hover { background: rgba(0, 0, 0, 0.8); }
    .hbo-btn-add svg {
      width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .hbo-btn-add.saved {
      border-color: var(--accent-light);
      background: rgba(124, 58, 237, 0.25);
    }
    .hbo-btn-add.saved svg {
      fill: var(--accent-light);
      stroke: var(--accent-light);
    }

    .hbo-slider-dots {
      position: absolute;
      bottom: 12px; right: 20px;
      z-index: 10;
      display: flex;
      gap: 5px;
      pointer-events: none;
    }

    .hbo-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    /* BUSCADOR DEDICADO */
    .search-hero { padding: 15px 20px 10px; }
    .search-box { width: 100%; max-width: 500px; position: relative; margin: 0 auto; }
    .search-box .search-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-gray);
      display: flex; align-items: center;
      pointer-events: none;
    }
    .search-box .search-icon svg {
      width: 17px; height: 17px;
      fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    }
    .search-box input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent-light); background: rgba(255, 255, 255, 0.08); }

    .clear-search-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-gray); font-size: 1.1rem;
      cursor: pointer; padding: 4px;
    }
    .clear-search-btn:hover { color: #fff; }

    /* TÍTULOS DE SECCIÓN */
    .section-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin: 28px 20px 12px;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    /* CARRUSEL GENERAL */
    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    .horizontal-scroll-large {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 20px 12px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0);
    }
    .horizontal-scroll-large::-webkit-scrollbar { display: none; }
    .horizontal-scroll-large .card { min-width: 145px; width: 145px; flex-shrink: 0; }

    /* TOP 10 */
    .top10-section-wrapper { margin: 28px 0 10px 0; }
    .top10-header-title {
      padding: 0 20px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      line-height: 1;
    }
    .top10-title-main {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      font-family: system-ui, -apple-system, sans-serif;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .top10-title-sub {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
    }
    .top10-scroll-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 15px 20px 20px 20px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      align-items: flex-end;
    }
    .top10-scroll-container::-webkit-scrollbar { display: none; }
    .top10-item-card {
      position: relative;
      min-width: 225px;
      width: 225px;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      cursor: pointer;
    }
    .top10-number-svg {
      position: absolute;
      left: -8px; bottom: -4px;
      width: 48px; height: 70px;
      z-index: 1; pointer-events: none; user-select: none;
      filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.9));
    }
    .top10-poster-box {
      position: relative;
      width: 180px; aspect-ratio: 2/3;
      border-radius: 9px; overflow: hidden;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 2; margin-left: 36px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.75);
      transition: transform 0.2s ease;
    }
    .top10-item-card:active .top10-poster-box { transform: scale(0.96); }
    .top10-poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .top10-fav-btn {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 5;
    }
    .top10-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .top10-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    /* GRILLAS GENERALES */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 12px;
      padding: 0 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer; position: relative;
      transform: translateZ(0);
    }
    .card:active { transform: scale(0.97); }
    .card img {
      width: 100%; aspect-ratio: 2/3;
      object-fit: cover; display: block;
      background: #1a1528; pointer-events: none;
    }
    .card-info { padding: 6px 8px; pointer-events: none; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff; width: 30px; height: 30px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10;
    }
    .card-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .admin-btns {
      display: none; position: absolute;
      top: 6px; right: 6px; gap: 4px; z-index: 10;
    }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      width: 26px; height: 26px; border-radius: 50%;
      font-size: 0.7rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* MODALES */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      z-index: 2000; padding: 15px;
      align-items: center; justify-content: center;
      overflow-y: auto;
    }
    .modal-box {
      background: #11091e; padding: 20px;
      border-radius: 10px; width: 100%; max-width: 480px;
      border: 1px solid var(--border-purple); position: relative;
      max-height: 90vh; overflow-y: auto;
    }

    /* MODAL DETALLE PELÍCULA */
    .modal-box-movie {
      background: #07040d; padding: 0; border-radius: 0;
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      position: fixed; inset: 0; overflow-y: auto; z-index: 2100;
      display: none; -webkit-overflow-scrolling: touch;
    }
    .movie-header-bg {
      position: relative; width: 100%; min-height: 520px;
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 75px 20px 20px 20px;
    }
    .movie-header-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.1) 0%, rgba(7,4,13,0.5) 50%, #07040d 100%);
    }
    .movie-info-container { position: relative; z-index: 2; }
    .movie-main-title {
      font-size: 2.2rem; font-weight: 900; line-height: 1.1;
      margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }
    .movie-meta-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; font-weight: 500; }
    .movie-btn-play {
      background: #ffffff; color: #000000; border: none; width: 100%;
      padding: 13px; border-radius: 8px; font-size: 0.95rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(255,255,255,0.15);
    }
    .movie-actions-row { display: flex; justify-content: flex-start; gap: 36px; margin-bottom: 18px; }
    .movie-action-ico-btn {
      background: none; border: none; color: var(--text-gray);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-size: 0.72rem; font-weight: 500; cursor: pointer;
    }
    .movie-action-ico-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; color: #fff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .movie-action-ico-btn.active-list .movie-action-ico-circle,
    .movie-action-ico-btn.liked .movie-action-ico-circle {
      background: rgba(124, 58, 237, 0.3); border-color: var(--accent-light); color: var(--accent-light);
    }
    .movie-synopsis { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; }
    .movie-genres-tags { font-size: 0.75rem; color: var(--accent-light); margin-bottom: 24px; font-weight: 600; }

    .movie-recommendations-area { padding: 0 0 40px 0; background: #07040d; }
    .movie-rec-title { font-size: 1.1rem; font-weight: 800; color: #fff; margin: 0 20px 14px 20px; }

    .stream-top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 65px;
      display: flex; justify-content: flex-end; align-items: center; gap: 10px;
      padding: 0 20px; background: linear-gradient(180deg, rgba(7,4,13,0.7) 0%, rgba(7,4,13,0) 100%);
      z-index: 2260; pointer-events: none;
    }
    .stream-top-btn {
      pointer-events: auto; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; transition: transform 0.2s ease, background 0.2s ease;
    }
    .stream-top-btn:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }

    /* MODAL DETALLE SERIE */
    .modal-box-series {
      background: #07040d; padding: 0; border-radius: 0;
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      position: fixed; inset: 0; overflow-y: auto; z-index: 2100;
      display: none; -webkit-overflow-scrolling: touch;
    }
    .stream-header-bg {
      position: relative; width: 100%;
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 70px 20px 16px 20px;
    }
    .stream-header-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.7) 75%, #07040d 100%);
    }
    .stream-info-container { position: relative; z-index: 2; }
    .stream-title-text { font-size: 1.8rem; font-weight: 900; line-height: 1.1; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .stream-badges-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.75rem; }
    .stream-badge-box { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.65rem; }
    .stream-meta-info { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 10px; font-weight: 500; }
    .stream-play-main-btn {
      background: #ffffff; color: #000000; border: none; width: 100%;
      padding: 11px; border-radius: 8px; font-size: 0.95rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(255,255,255,0.15);
    }
    .stream-actions-row { display: flex; justify-content: flex-start; gap: 28px; margin-bottom: 10px; }
    .stream-action-ico-btn {
      background: none; border: none; color: var(--text-gray);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 0.7rem; cursor: pointer; position: relative;
    }
    .stream-action-ico-circle {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .stream-action-ico-btn.active-list .stream-action-ico-circle,
    .stream-action-ico-btn.liked .stream-action-ico-circle {
      background: rgba(124, 58, 237, 0.3); border-color: var(--accent-light); color: var(--accent-light);
    }
    .stream-synopsis { font-size: 0.85rem; color: var(--text-gray); line-height: 1.35; margin-bottom: 4px; }
    .stream-synopsis.truncated {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .stream-read-more {
      background: none; border: none; color: var(--accent-light); font-weight: 700;
      font-size: 0.8rem; cursor: pointer; padding: 0; margin-top: 2px; display: inline-block;
    }

    .stream-tabs-bar {
      display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 20px; gap: 30px;
    }
    .stream-tab {
      background: none; border: none; color: var(--text-gray);
      font-size: 0.95rem; font-weight: 600; padding: 10px 0; cursor: pointer; position: relative;
    }
    .stream-tab.active { color: #fff; font-weight: 700; }
    .stream-tab.active::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 3px; background: #fff; border-radius: 3px 3px 0 0;
    }

    .stream-content-area { padding: 14px 20px 40px 20px; }
    .stream-season-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .stream-season-select { background: transparent; border: none; color: #fff; font-size: 1.1rem; font-weight: 800; outline: none; cursor: pointer; }

    .stream-episodes-list { display: flex; flex-direction: column; gap: 14px; }
    .stream-ep-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
    .stream-ep-thumb-box {
      width: 120px; height: 68px; border-radius: 6px; overflow: hidden;
      background: #1a1528; position: relative; flex-shrink: 0; margin-top: 2px;

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "index.html";
    const DB_FILE_PATH = "database.json";

    /*CATALOG_START*/
    let catalog = [];
    /*CATALOG_END*/

    const localDb = JSON.parse(localStorage.getItem('naPlus_permanent_db'));
    if (Array.isArray(localDb) && localDb.length > 0) {
      catalog = localDb;
    }

    let movieLikes = JSON.parse(localStorage.getItem('naPlus_movie_likes')) || [];
    let seriesLikes = JSON.parse(localStorage.getItem('naPlus_series_likes')) || [];

    function preloadAllImages() {
      const urls = new Set();
      catalog.forEach(item => {
        if (item.cover) urls.add(item.cover);
        if (item.seasons) {
          item.seasons.forEach(s => {
            if (s.episodes) {
              s.episodes.forEach(e => {
                if (e.img && e.img.trim() && e.img !== 'null') urls.add(e.img.trim());
              });
            }
          });
        }
      });
      urls.forEach(url => {
        const img = new Image();
        img.src = url;
      });
    }

    let sessionRecommendedPool = [];
    function computeSessionRecommendations() {
      if (catalog.length === 0) {
        sessionRecommendedPool = [];
        return;
      }
      let targetItems = [...catalog].sort(() => 0.5 - Math.random());
      sessionRecommendedPool = targetItems;
    }
    computeSessionRecommendations();
    preloadAllImages();

    async function autoSyncCatalogFromCloud() {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${REPO}/main/${DB_FILE_PATH}?_t=` + Date.now();
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const cloudCatalog = await res.json();
          if (Array.isArray(cloudCatalog)) {
            catalog = cloudCatalog;
            localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
            computeSessionRecommendations();
            preloadAllImages();
            renderHomeSections();
            if (document.getElementById('viewMovies').classList.contains('active')) renderMoviesGrid();
            if (document.getElementById('viewSeries').classList.contains('active')) renderSeriesGrid();
            if (document.getElementById('viewList').classList.contains('active')) renderMyList();
            return;
          }
        }
      } catch (e) {
        console.log("Intentando respaldo desde index.html...");
      }

      try {
        const rawUrlIndex = `https://raw.githubusercontent.com/${REPO}/main/${FILE_PATH}?_t=` + Date.now();
        const res = await fetch(rawUrlIndex, { cache: 'no-store' });
        if (res.ok) {
          const text = await res.text();
          const startMarker = "/*CATALOG_START*/";
          const endMarker = "/*CATALOG_END*/";
          const startIndex = text.indexOf(startMarker);
          const endIndex = text.indexOf(endMarker);
          if (startIndex !== -1 && endIndex !== -1) {
            const jsonStr = text.substring(startIndex + startMarker.length, endIndex).trim();
            const cloudCatalog = JSON.parse(jsonStr);
            if (Array.isArray(cloudCatalog)) {
              catalog = cloudCatalog;
              localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
              computeSessionRecommendations();
              preloadAllImages();
              renderHomeSections();
            }
          }
        }
      } catch (err) {
        console.log("Modo offline o error de sincronización total:", err);
      }
    }

    function handleImgError(img) {

        setTimeout(() => { img.src = img.dataset.orig; }, 300 * (tries + 1));

    function renderHeroSlider() {
      const wrapper = document.getElementById('hboSlidesWrapper');
      const dotsContainer = document.getElementById('hboSliderDots');
      
      let displayItems = catalog.filter(item => item.featured);
      if (displayItems.length === 0) {
        displayItems = [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).slice(0, 6);
      } else {
        displayItems = displayItems.slice(0, 6);
      }

      if (displayItems.length === 0) return;

      wrapper.innerHTML = '';
      dotsContainer.innerHTML = '';

      displayItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'hbo-slide';
        slide.style.backgroundImage = `url('${item.cover}')`;
        slide.onclick = () => openContentDetail(item.id);

        const isFav = myFavorites.includes(item.id);
        const genreText = item.genre ? item.genre.split(',')[0] : '';
        
        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">${item.year} • ${genreText}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="event.stopPropagation(); openContentDetail(${item.id})">▶ Reproducir</button>
              <button class="hbo-btn-add ${isFav ? 'saved anim-pop' : ''}" onclick="toggleFavorite(${item.id}, event)" title="${isFav ? 'Quitar' : 'Guardar'}">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
          </div>
        `;
        wrapper.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      });

      if (sliderInterval) clearInterval(sliderInterval);
      currentSlide = 0;
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % displayItems.length;
        goToSlide(currentSlide);
      }, 4500);
    }

    function goToSlide(idx) {
      currentSlide = idx;
      const wrapper = document.getElementById('hboSlidesWrapper');
      const dots = document.querySelectorAll('.hbo-dot');
      if (wrapper) {

      searchGrid.innerHTML = '';

      if (query.length === 0) {
        searchGrid.innerHTML = '<div class="empty-msg">Escribe algo para comenzar la búsqueda.</div>';
        return;
      }

      const matches = catalog.filter(i => i.title.toLowerCase().includes(query) || (i.genre && i.genre.toLowerCase().includes(query)));
      if (matches.length > 0) {
        matches.forEach(item => searchGrid.appendChild(createCardElement(item)));

      } else {
        document.getElementById('movieVideoGroup').style.display = 'block';
        document.getElementById('seriesSeasonsGroup').style.display = 'none';
        seasonsContainer.innerHTML = '';
      }
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('ageRatingInput').value = item && item.ageRating ? item.ageRating : '+18';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('trailerInput').value = item && item.trailer ? item.trailer : '';
      document.getElementById('videoInput').value = item && item.video ? item.video : '';
      document.getElementById('featuredInput').checked = item && item.featured === true;

      toggleContentTypeFields();

      if (item && item.type === 'series' && item.seasons) {
        const container = document.getElementById('seasonsContainer');
        container.innerHTML = '';
        item.seasons.forEach((season) => addSeasonField(season));
      }

      pushModalState('uploadModal');
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function addSeasonField(seasonData = null) {
      const container = document.getElementById('seasonsContainer');
      const sIndex = container.children.length + 1;
      const seasonDiv = document.createElement('div');
      seasonDiv.className = 'admin-episode-card season-item-block';
      seasonDiv.style.background = '#120b20';
      seasonDiv.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <input type="text" class="season-name" value="${seasonData ? seasonData.name : 'Temporada ' + sIndex}" style="width:70%; padding:5px 8px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.8rem;">
          <button type="button" onclick="this.closest('.season-item-block').remove()" style="background:#ef4444; border:none; color:#fff; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:0.7rem;">Eliminar</button>
        </div>
        <div class="episodes-admin-container"></div>
        <button type="button" class="btn-submit" style="background:#7c3aed; font-size:0.7rem; padding:4px 8px; margin-top:4px;" onclick="addEpisodeField(this.previousElementSibling)">+ Agregar Capítulo</button>
      `;
      container.appendChild(seasonDiv);
      const epContainer = seasonDiv.querySelector('.episodes-admin-container');
      if (seasonData && seasonData.episodes) {
        seasonData.episodes.forEach(ep => addEpisodeField(epContainer, ep));
      } else {
        addEpisodeField(epContainer);
      }
    }

    function addEpisodeField(container, epData = null) {
      const defaultEpNum = epData && epData.num !== undefined ? epData.num : (container.children.length + 1);
      const epDiv = document.createElement('div');
      epDiv.className = 'admin-episode-card ep-item-row';
      epDiv.innerHTML = `
        <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center;">
          <span style="font-size:0.7rem; color:var(--accent-light); white-space:nowrap;">N°:</span>
          <input type="number" class="ep-num" value="${defaultEpNum}" style="width:55px; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.75rem;" required>
          <input type="text" class="ep-title" placeholder="Título" value="${epData ? (epData.title || '') : ''}" style="flex-grow:1; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.75rem;" required>
          <input type="text" class="ep-duration" placeholder="Duración" value="${epData ? (epData.duration || '45 min') : '45 min'}" style="width:85px; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.75rem;" required>
          <button type="button" onclick="this.closest('.ep-item-row').remove()" style="background:#ef4444; border:none; color:#fff; padding:3px 6px; border-radius:4px; cursor:pointer; font-size:0.7rem;">✕</button>
        </div>
        <input type="text" class="ep-img" placeholder="Miniatura opcional" value="${epData ? (epData.img || '') : ''}" style="width:100%; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.7rem; margin-bottom:6px;">
        <textarea class="ep-desc" rows="2" placeholder="Sinopsis" style="width:100%; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.7rem; margin-bottom:6px;" required>${epData ? (epData.desc || '') : ''}</textarea>
        <input type="text" class="ep-video" placeholder="Enlace de video" value="${epData ? (epData.video || '') : ''}" style="width:100%; padding:5px; background:#07040d; border:1px solid var(--border-purple); color:#fff; border-radius:4px; font-size:0.7rem;" required>
      `;
      container.appendChild(epDiv);
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta obra del catálogo?")) {
        catalog = catalog.filter(x => x.id != id);
        localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
        renderHomeSections();
        renderMoviesGrid();
        renderSeriesGrid();
        renderMyList();
        await publishToGitHubAutomatically();
      }
    }

    function utoa(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const type = document.getElementById('typeInput').value;

      let token = localStorage.getItem('naPlus_gh_token');
      if (!token || !token.trim()) {
        token = prompt("Introduce tu token de GitHub (ghp_... o github_pat_...):");
        if (token && token.trim()) {
          localStorage.setItem('naPlus_gh_token', token.trim());
        } else {
          alert("⚠️ Se necesita el token de GitHub para publicar automáticamente.");
          return;
        }
      }

      let seasonsData = [];
      if (type === 'series') {
        const seasonBlocks = document.querySelectorAll('.season-item-block');
        seasonBlocks.forEach(sBlock => {
          const sName = sBlock.querySelector('.season-name').value.trim();
          const epRows = sBlock.querySelectorAll('.ep-item-row');
          let eps = [];
          epRows.forEach((row, rIdx) => {
            eps.push({
              num: parseInt(row.querySelector('.ep-num').value) || (rIdx + 1),
              title: row.querySelector('.ep-title').value.trim(),
              duration: row.querySelector('.ep-duration').value.trim() || '45 min',
              img: row.querySelector('.ep-img').value.trim(),
              desc: row.querySelector('.ep-desc').value.trim(),
              video: row.querySelector('.ep-video').value.trim()
            });
          });
          eps.sort((a, b) => a.num - b.num);
          seasonsData.push({ name: sName, episodes: eps });
        });
      }

      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: type,
        title: document.getElementById('titleInput').value.trim(),
        ageRating: document.getElementById('ageRatingInput').value,
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        trailer: document.getElementById('trailerInput').value.trim(),
        video: type === 'movie' ? document.getElementById('videoInput').value.trim() : '',
        seasons: type === 'series' ? seasonsData : [],
        featured: document.getElementById('featuredInput').checked,
        views: id ? (catalog.find(x => x.id == id)?.views || 0) : Math.floor(Math.random() * 500) + 50,
        dateAdded: id ? (catalog.find(x => x.id == id)?.dateAdded || Date.now()) : Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      preloadAllImages();
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
      closeModal('uploadModal');

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Publicando en base y nube...";

      const success = await publishToGitHubAutomatically();
      if (saveBtn) saveBtn.innerText = "Guardar y Publicar";

      if (success) {
        alert("¡Guardado y sincronizado automáticamente con database.json y GitHub!");
      }
    }

    async function publishToGitHubAutomatically() {
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) return false;

      try {
        const catalogJson = JSON.stringify(catalog, null, 2);

        let dbSha = null;
        const getDbRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${DB_FILE_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token.trim(), 'Accept': 'application/vnd.github+json' }
        });
        if (getDbRes.ok) {
          const dbData = await getDbRes.json();
          dbSha = dbData.sha;
        }

        await fetch(`https://api.github.com/repos/${REPO}/contents/${DB_FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token.trim(),
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: 'Actualización automática de database.json',
            content: utoa(catalogJson),
            sha: dbSha
          })
        });

        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token.trim(), 'Accept': 'application/vnd.github+json' }
        });
        if (getRes.ok) {
          const getData = await getRes.json();
          let fileText = decodeURIComponent(escape(atob(getData.content)));
          if (fileText.includes('/*CATALOG_START*/')) {
            fileText = fileText.replace(/\/\*CATALOG_START\*\/[\s\S]*?\/\*CATALOG_END\*\//, `/*CATALOG_START*/\n${catalogJson}\n/*CATALOG_END*/`);
          }
          await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
            method: 'PUT',
            headers: {
              'Authorization': 'Bearer ' + token.trim(),
              'Content-Type': 'application/json',
              'Accept': 'application/vnd.github+json'
            },
            body: JSON.stringify({
              message: 'Sincronización de catálogo en index.html',
              content: utoa(fileText),
              sha: getData.sha
            })
          });
        }
        return true;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    let currentSeriesData = null;
    let currentMovieData = null;

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;

      item.views = (item.views || 0) + 1;
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));

      if (item.type === 'series') {
        currentSeriesData = item;
        document.getElementById('streamHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('seriesTitle').innerText = item.title;
        const seasonsCount = item.seasons ? item.seasons.length : 0;
        document.getElementById('seriesMeta').innerText = `${item.ageRating || '+18'} • ${item.year} • ${seasonsCount} temporada${seasonsCount > 1 ? 's' : ''} • ${item.genre}`;
        
        const descEl = document.getElementById('seriesDesc');
        descEl.innerText = item.desc || 'Sin sinopsis.';
        descEl.classList.add('truncated');

        setTimeout(() => {
          document.getElementById('readMoreBtn').style.display = descEl.scrollHeight > descEl.clientHeight ? 'inline-block' : 'none';
        }, 50);

        updateSeriesModalFavoriteState();
        updateSeriesLikeState();

        switchSeriesTab('episodes');
        const seasonSelect = document.getElementById('seasonSelect');
        seasonSelect.innerHTML = '';
        if (item.seasons) {
          item.seasons.forEach((s, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.innerText = s.name;
            seasonSelect.appendChild(opt);
          });
        }
        renderEpisodesForSelectedSeason();

        const recScroll = document.getElementById('seriesRecommendationsScroll');
        recScroll.innerHTML = '';
        const otherSeries = catalog.filter(s => s.id !== item.id).sort(() => 0.5 - Math.random());
        otherSeries.forEach(s => recScroll.appendChild(createLargeCardElement(s)));

        document.getElementById('seriesModal').scrollTop = 0;
        pushModalState('seriesModal');
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        currentMovieData = item;
        document.getElementById('movieHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('movieTitle').innerText = item.title;
        document.getElementById('movieMeta').innerText = `${item.ageRating || '+18'} • ${item.year}`;
        document.getElementById('movieDesc').innerText = item.desc || 'Sin descripción.';
        document.getElementById('movieGenres').innerText = item.genre || '';
        
        updateMovieModalFavoriteState();
        updateMovieLikeState();

        const recScroll = document.getElementById('movieRecommendationsScroll');
        recScroll.innerHTML = '';
        const otherMovies = catalog.filter(m => m.id !== item.id).sort(() => 0.5 - Math.random());
        otherMovies.forEach(m => recScroll.appendChild(createLargeCardElement(m)));

        document.getElementById('movieDetailModal').scrollTop = 0;
        pushModalState('movieDetailModal');
        document.getElementById('movieDetailModal').style.display = 'block';
      }
    }

    function switchSeriesTab(tabName) {
      const episodesBtn = document.getElementById('tabEpisodesBtn');
      const recBtn = document.getElementById('tabRecommendationsBtn');
      const episodesContent = document.getElementById('seriesTabContentEpisodes');
      const recContent = document.getElementById('seriesTabContentRecommendations');

      if (tabName === 'episodes') {
        episodesBtn.classList.add('active');
        recBtn.classList.remove('active');
        episodesContent.style.display = 'block';
        recContent.style.display = 'none';
      } else {
        recBtn.classList.add('active');
        episodesBtn.classList.remove('active');
        recContent.style.display = 'block';
        episodesContent.style.display = 'none';
      }
    }

    function playCurrentMovie() {
      if (!currentMovieData) return;
      const modal = document.getElementById('moviePlayerModal');
      renderVideoInBox(document.getElementById('fullscreenMovieVideoBox'), currentMovieData.video);
      pushModalState('moviePlayerModal');
      modal.style.display = 'flex';
    }

    function closeMoviePlayerModal() {
      document.getElementById('moviePlayerModal').style.display = 'none';
      document.getElementById('fullscreenMovieVideoBox').innerHTML = '';
    }

    function toggleSynopsis() {
      const descEl = document.getElementById('seriesDesc');
      const btn = document.getElementById('readMoreBtn');
      if (descEl.classList.contains('truncated')) {
        descEl.classList.remove('truncated');
        btn.innerText = 'Menos';
      } else {
        descEl.classList.add('truncated');
        btn.innerText = 'Más';
      }
    }

    function renderEpisodesForSelectedSeason() {
      if (!currentSeriesData || !currentSeriesData.seasons) return;
      const sIdx = document.getElementById('seasonSelect').value;
      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');

      if (!season || !season.episodes || season.episodes.length === 0) {
        container.innerHTML = '<div class="empty-msg">No hay capítulos en esta temporada.</div>';
        return;
      }

      const fragment = document.createDocumentFragment();
      season.episodes.forEach((ep, eIdx) => {
        const epNumDisplay = ep.num !== undefined ? ep.num : (eIdx + 1);
        const thumbImg = (ep.img && ep.img.trim()) ? ep.img.trim() : currentSeriesData.cover;
        
        const itemDiv = document.createElement('div');
        itemDiv.className = 'stream-ep-item';
        itemDiv.innerHTML = `
          <div class="stream-ep-thumb-box" onclick="playEpisode(${sIdx}, ${eIdx})">
            <img src="${thumbImg}" data-orig="${thumbImg}" alt="Ep" loading="eager" onerror="handleImgError(this)">
            <div class="stream-ep-play-overlay">▶</div>
          </div>
          <div class="stream-ep-info" onclick="playEpisode(${sIdx}, ${eIdx})">
            <div class="stream-ep-title">${epNumDisplay}. ${ep.title || 'Capítulo ' + epNumDisplay}</div>
            <div class="stream-ep-duration">${ep.duration || '45 min'}</div>
            ${ep.desc ? `<div class="stream-ep-desc">${ep.desc}</div>` : ''}
            <button class="stream-edit-ep-btn" onclick="event.stopPropagation(); openSingleEpisodeEdit(${sIdx}, ${eIdx})">✏ Editar</button>
          </div>
        `;
        fragment.appendChild(itemDiv);
      });

      container.innerHTML = '';
      container.appendChild(fragment);
    }

    function playFirstEpisodeOfSeries() {
      if (!currentSeriesData || !currentSeriesData.seasons || !currentSeriesData.seasons.length) return;
      playEpisode(0, 0);
    }

    function playTrailer() {
      if (!currentSeriesData || !currentSeriesData.trailer) return alert("Sin tráiler disponible.");
      document.getElementById('seriesModal').style.display = 'none';
      document.getElementById('epModalTitle').innerText = `Tráiler: ${currentSeriesData.title}`;
      document.getElementById('epModalDesc').innerText = "";
      renderVideoInBox(document.getElementById('episodeVideoBox'), currentSeriesData.trailer);
      pushModalState('episodeModal');
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function openSingleEpisodeEdit(seasonIdx, epIdx) {
      const ep = currentSeriesData.seasons[seasonIdx].episodes[epIdx];
      document.getElementById('editEpSeasonIdx').value = seasonIdx;
      document.getElementById('editEpItemIdx').value = epIdx;
      document.getElementById('modalEpNum').value = ep.num !== undefined ? ep.num : 1;
      document.getElementById('modalEpTitle').value = ep.title || '';
      document.getElementById('modalEpDuration').value = ep.duration || '45 min';
      document.getElementById('modalEpImg').value = (ep.img && ep.img !== 'null') ? ep.img : '';
      document.getElementById('modalEpDesc').value = ep.desc || '';
      document.getElementById('modalEpVideo').value = ep.video || '';
      document.getElementById('seriesModal').style.display = 'none';
      pushModalState('editEpisodeModal');
      document.getElementById('editEpisodeModal').style.display = 'flex';
    }

    async function saveSingleEpisodeEdit(e) {
      e.preventDefault();
      const sIdx = parseInt(document.getElementById('editEpSeasonIdx').value);
      const eIdx = parseInt(document.getElementById('editEpItemIdx').value);

      currentSeriesData.seasons[sIdx].episodes[eIdx] = {
        num: parseInt(document.getElementById('modalEpNum').value) || 1,
        title: document.getElementById('modalEpTitle').value.trim(),
        duration: document.getElementById('modalEpDuration').value.trim() || '45 min',
        img: document.getElementById('modalEpImg').value.trim(),
        desc: document.getElementById('modalEpDesc').value.trim(),
        video: document.getElementById('modalEpVideo').value.trim()
      };
      currentSeriesData.seasons[sIdx].episodes.sort((a, b) => a.num - b.num);

      const catIdx = catalog.findIndex(x => x.id === currentSeriesData.id);
      if (catIdx !== -1) catalog[catIdx] = currentSeriesData;

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      closeModal('editEpisodeModal');
      openContentDetail(currentSeriesData.id);
      await publishToGitHubAutomatically();
    }

    function playEpisode(seasonIdx, epIdx) {
      const ep = currentSeriesData.seasons[seasonIdx].episodes[epIdx];
      document.getElementById('seriesModal').style.display = 'none';
      document.getElementById('epModalTitle').innerText = `Capítulo ${ep.num || 1}: ${ep.title || ''}`;
      document.getElementById('epModalDesc').innerText = ep.desc || '';
      renderVideoInBox(document.getElementById('episodeVideoBox'), ep.video);
      pushModalState('episodeModal');
      document.getElementById('episodeModal').style.display = 'flex';
    }

    function closeEpisodePlayer() {
      document.getElementById('episodeModal').style.display = 'none';
      document.getElementById('episodeVideoBox').innerHTML = '';
      if (currentSeriesData) document.getElementById('seriesModal').style.display = 'block';
      else if (currentMovieData) document.getElementById('movieDetailModal').style.display = 'block';
    }

    function shareCurrentSeries() {
      if (navigator.share && currentSeriesData) navigator.share({ title: currentSeriesData.title, url: window.location.href }).catch(() => {});
      else alert("Enlace copiado.");
    }

    function shareCurrentMovie() {
      if (navigator.share && currentMovieData) navigator.share({ title: currentMovieData.title, url: window.location.href }).catch(() => {});
      else alert("Enlace copiado.");
    }

    function renderVideoInBox(vBox, vInput) {
      if (!vInput) {
        vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>';
        return;
      }
      if (vInput.includes('<iframe')) {
        vBox.innerHTML = vInput;
        return;
      }
      if (vInput.includes('youtube.com') || vInput.includes('youtu.be')) {
        let embedUrl = vInput.trim();
        if (embedUrl.includes('watch?v=')) embedUrl = `https://www.youtube.com/embed/${embedUrl.split('watch?v=')[1].split('&')[0]}?autoplay=1`;
        else if (embedUrl.includes('youtu.be/')) embedUrl = `https://www.youtube.com/embed/${embedUrl.split('youtu.be/')[1].split(/[?#]/)[0]}?autoplay=1`;
        vBox.innerHTML = `<iframe src="${embedUrl}" frameborder="0" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;"></iframe>`;
        return;
      }
      if (vInput.includes('ok.ru')) {
        let okEmbed = vInput.trim();
        if (!okEmbed.includes('/videoembed/')) {
          okEmbed = okEmbed.replace('/video/', '/videoembed/');
        }
        vBox.innerHTML = `<iframe src="${okEmbed}" frameborder="0" allow="autoplay" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;"></iframe>`;
        return;
      }
      if (vInput.includes('odysee.com')) {
        let odyseeEmbed = vInput.trim();
        if (!odyseeEmbed.includes('/$/embed/')) {
          odyseeEmbed = odyseeEmbed.replace('odysee.com/', 'odysee.com/$/embed/');
        }
        vBox.innerHTML = `<iframe src="${odyseeEmbed}" frameborder="0" allow="autoplay" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;"></iframe>`;
        return;
      }
      vBox.innerHTML = `<div class="native-player-container"><video src="${vInput.trim()}" controls autoplay playsinline></video></div>`;
    }

    autoSyncCatalogFromCloud();
    renderHomeSections();
  </script>
