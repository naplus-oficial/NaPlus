<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus Cinema</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f0c20; color: #ffffff; padding-bottom: 40px; }

    /* BARRA SUPERIOR */
    .navbar {
      background: #171233;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 1.6rem; font-weight: 800; color: #a855f7; letter-spacing: 1px; }
    .btn-admin {
      background: #8b5cf6; color: #fff; border: none; padding: 10px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
    }

    /* CONTENEDOR PRINCIPAL */
    .container { padding: 20px 15px; max-width: 1200px; margin: auto; }

    /* BUSCADOR */
    .search-container { margin-bottom: 25px; }
    .search-bar {
      width: 100%; padding: 14px 18px; background: #1c163d;
      border: 1px solid #3b2d70; border-radius: 10px; color: #fff;
      font-size: 1rem; outline: none;
    }

    /* TITULOS DE SECCION */
    .section-head { font-size: 1.3rem; margin-bottom: 15px; color: #c084fc; border-left: 4px solid #a855f7; padding-left: 10px; }

    /* GRILLA DE PELICULAS */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .movie-card {
      background: #1c163d; border-radius: 10px; overflow: hidden;
      border: 1px solid #3b2d70; position: relative; cursor: pointer;
      transition: transform 0.2s;
    }
    .movie-card:active { transform: scale(0.97); }

    .poster-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    
    .card-info { padding: 10px; }
    .title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .genre { font-size: 0.75rem; color: #a1a1aa; margin-top: 3px; }

    /* BOTONES DE ADMINISTRADOR EN TARJETA */
    .card-admin-tools {
      display: none; position: absolute; top: 6px; right: 6px; gap: 5px; z-index: 10;
    }
    body.admin-mode .card-admin-tools { display: flex; }
    
    .btn-tool {
      background: rgba(0,0,0,0.85); border: 1px solid #a855f7; color: #fff;
      padding: 5px 8px; border-radius: 5px; font-size: 0.75rem; cursor: pointer;
    }

    /* MODAL DE REPRODUCTOR DE VIDEO */
    .player-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
      z-index: 1000; flex-direction: column; padding: 15px;
    }
    .player-modal.open { display: flex; }

    .btn-close-player {
      align-self: flex-end; background: #e11d48; color: #fff; border: none;
      padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer;
      margin-bottom: 15px;
    }

    .iframe-box {
      width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px;
      overflow: hidden; border: 1px solid #3b2d70;
    }
    .iframe-box iframe, .iframe-box video { width: 100%; height: 100%; border: none; }

    /* FORMULARIO DE CARGA */
    .admin-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 900; align-items: center; justify-content: center; padding: 15px;
    }
    .admin-modal.open { display: flex; }

    .form-box {
      background: #171233; padding: 20px; border-radius: 12px;
      width: 100%; max-width: 450px; border: 1px solid #8b5cf6;
    }
    .form-box h3 { margin-bottom: 15px; color: #c084fc; }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 0.8rem; color: #a1a1aa; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 10px; background: #0f0c20; border: 1px solid #3b2d70;
      color: #fff; border-radius: 6px; outline: none;
    }

    .form-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: #a1a1aa; border: none; padding: 8px; cursor: pointer; }
    .btn-save { background: #8b5cf6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGACION -->
  <div class="navbar">
    <div class="logo">NaPlus</div>
    <button class="btn-admin" id="btnAdmin" onclick="toggleModoCreador()">Modo Creador</button>
  </div>

  <div class="container">
    <!-- BUSCADOR -->
    <div class="search-container">
      <input type="text" class="search-bar" id="searchInput" placeholder="🔍 Buscar película o serie..." oninput="buscar()">
    </div>

    <!-- SECCION PELICULAS -->
    <div class="section-head">Películas</div>
    <div class="movie-grid" id="moviesGrid"></div>

    <!-- SECCION SERIES -->
    <div class="section-head">Series</div>
    <div class="movie-grid" id="seriesGrid"></div>
  </div>

  <!-- REPRODUCTOR EN PANTALLA COMPLETA -->
  <div class="player-modal" id="playerModal">
    <button class="btn-close-player" onclick="cerrarReproductor()">✕ Cerrar Video</button>
    <div class="iframe-box" id="iframeBox"></div>
    <h2 id="movieTitle" style="margin-top: 15px;"></h2>
    <p id="movieGenre" style="color: #a1a1aa; font-size: 0.9rem; margin-top: 5px;"></p>
  </div>

  <!-- FORMULARIO CREADOR PARA SUBIR/EDITAR -->
  <div class="admin-modal" id="adminModal">
    <div class="form-box">
      <h3 id="formTitle">Agregar a NaPlus</h3>
      <form onsubmit="guardarPelicula(event)">
        <input type="hidden" id="editIndex">
        <div class="field">
          <label>Tipo de Contenido</label>
          <select id="typeInput">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="field">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Ej: Spider-Man">
        </div>
        <div class="field">
          <label>Género</label>
          <input type="text" id="genreInput" required placeholder="Ej: Acción, Terror">
        </div>
        <div class="field">
          <label>URL Imagen de Portada</label>
          <input type="url" id="coverInput" required placeholder="https://...">
        </div>
        <div class="field">
          <label>URL Video (OK.ru, Google Drive, MP4)</label>
          <input type="url" id="videoInput" required placeholder="https://ok.ru/videoembed/...">
        </div>
        <div class="form-btns">
          <button type="button" class="btn-cancel" onclick="cerrarFormulario()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // BASE DE DATOS INICIAL PREDETERMINADA
    const CATALOGO_INICIAL = [
      {
        id: 1,
        type: 'movie',
        title: 'Ejemplo OK.ru Película',
        genre: 'Acción / Terror',
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=500',
        video: 'https://ok.ru/videoembed/237592963750'
      },
      {
        id: 2,
        type: 'series',
        title: 'Ejemplo Serie Demo',
        genre: 'Drama',
        cover: 'https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=500',
        video: 'https://www.w3schools.com/html/mov_bbb.mp4'
      }
    ];

    let db = JSON.parse(localStorage.getItem('naplus_db_v2026')) || CATALOGO_INICIAL;
    let esCreador = false;

    // RENDERIZAR CATALOGO EN PANTALLA
    function cargarCatalogo(filtro = '') {
      const mGrid = document.getElementById('moviesGrid');
      const sGrid = document.getElementById('seriesGrid');
      mGrid.innerHTML = '';
      sGrid.innerHTML = '';

      const query = filtro.toLowerCase().trim();

      db.forEach((item, index) => {
        if (item.title.toLowerCase().includes(query) || item.genre.toLowerCase().includes(query)) {
          const card = document.createElement('div');
          card.className = 'movie-card';
          card.onclick = () => verPelicula(index);

          card.innerHTML = `
            <div class="card-admin-tools">
              <button class="btn-tool" onclick="event.stopPropagation(); editar(${index})">✏️</button>
              <button class="btn-tool" onclick="event.stopPropagation(); borrar(${index})">🗑️</button>
            </div>
            <img class="poster-img" src="${item.cover}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Portada'">
            <div class="card-info">
              <div class="title">${item.title}</div>
              <div class="genre">${item.genre}</div>
            </div>
          `;

          if (item.type === 'movie') mGrid.appendChild(card);
          else sGrid.appendChild(card);
        }
      });
    }

    // BUSCADOR
    function buscar() {
      cargarCatalogo(document.getElementById('searchInput').value);
    }

    // REPRODUCTOR NATIVO OK.RU / DRIVE / DIRECTO
    function verPelicula(index) {
      const item = db[index];
      if (!item) return;

      document.getElementById('movieTitle').innerText = item.title;
      document.getElementById('movieGenre').innerText = item.genre;

      const box = document.getElementById('iframeBox');
      box.innerHTML = '';
      const url = item.video;

      // SI ES LINK DE OK.RU
      if (url.includes('ok.ru')) {
        let embed = url;
        if (!url.includes('videoembed')) {
          const m = url.match(/\/video\/([0-9]+)/);
          if (m && m[1]) embed = `https://ok.ru/videoembed/${m[1]}`;
        }
        box.innerHTML = `<iframe src="${embed}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      } 
      // SI ES LINK DE GOOGLE DRIVE
      else if (url.includes('drive.google.com')) {
        let id = '';
        const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (m && m[1]) id = m[1];
        const embed = id ? `https://drive.google.com/file/d/${id}/preview` : url;
        box.innerHTML = `<iframe src="${embed}" allow="autoplay" allowfullscreen></iframe>`;
      } 
      // CUALQUIER OTRO VIDEO DIRECTO (.MP4)
      else {
        box.innerHTML = `<video src="${url}" controls autoplay></video>`;
      }

      document.getElementById('playerModal').classList.add('open');
    }

    function cerrarReproductor() {
      document.getElementById('iframeBox').innerHTML = '';
      document.getElementById('playerModal').classList.remove('open');
    }

    // ACTIVAR MODO CREADOR
    function toggleModoCreador() {
      if (esCreador) {
        abrirFormulario();
        return;
      }

      const pass = prompt("Ingresá la clave de creador (9009):");
      if (pass === "9009") {
        esCreador = true;
        document.body.classList.add('admin-mode');
        document.getElementById('btnAdmin').innerText = "+ Agregar Video";
        abrirFormulario();
      } else if (pass !== null) {
        alert("Clave incorrecta. Usá 9009");
      }
    }

    function abrirFormulario() {
      document.getElementById('editIndex').value = '';
      document.getElementById('formTitle').innerText = "Subir Nuevo Contenido";
      document.getElementById('titleInput').value = '';
      document.getElementById('genreInput').value = '';
      document.getElementById('coverInput').value = '';
      document.getElementById('videoInput').value = '';
      document.getElementById('adminModal').classList.add('open');
    }

    function cerrarFormulario() {
      document.getElementById('adminModal').classList.remove('open');
    }

    function editar(index) {
      const item = db[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('formTitle').innerText = "Editar Contenido";
      document.getElementById('typeInput').value = item.type;
      document.getElementById('titleInput').value = item.title;
      document.getElementById('genreInput').value = item.genre;
      document.getElementById('coverInput').value = item.cover;
      document.getElementById('videoInput').value = item.video;
      document.getElementById('adminModal').classList.add('open');
    }

    function borrar(index) {
      if (confirm("¿Seguro que querés eliminar esta película?")) {
        db.splice(index, 1);
        localStorage.setItem('naplus_db_v2026', JSON.stringify(db));
        cargarCatalogo();
      }
    }

    function guardarPelicula(e) {
      e.preventDefault();
      const idx = document.getElementById('editIndex').value;

      const nuevo = {
        id: Date.now(),
        type: document.getElementById('typeInput').value,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim()
      };

      if (idx !== '') db[parseInt(idx)] = nuevo;
      else db.unshift(nuevo);

      localStorage.setItem('naplus_db_v2026', JSON.stringify(db));
      cargarCatalogo();
      cerrarFormulario();
    }

    // INICIALIZAR
    cargarCatalogo();
  </script>
</body>
</html>
