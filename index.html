  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-dark); color: var(--text-white); padding-bottom: 85px; -webkit-font-smoothing: antialiased; }

    header {
      position: absolute; top: 0; left: 0; right: 0; height: 65px; padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex; justify-content: space-between; align-items: center; z-index: 1000;
    }
    .logo { font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, var(--accent-light), var(--accent-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
      background: rgba(7, 4, 13, 0.95); backdrop-filter: blur(12px);
      display: flex; justify-content: space-around; align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 1000;
    }
    .nav-item { background: none; border: none; color: var(--text-gray); font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 25%; }
    .nav-item svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); }

    .view-section { display: none; padding-bottom: 20px; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList { padding-top: 75px; }

    .hero { padding: 15px 20px 5px; }
    body.search-active .hero#searchContainer { padding-top: 80px; }

    .hbo-hero-slider { position: relative; width: 100%; height: 460px; background: #000; overflow: hidden; margin-bottom: 15px; }
    .hbo-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.4s ease-in-out; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 20px; background-size: cover; background-position: center; }
    .hbo-slide.active { opacity: 1; z-index: 2; }
    .hbo-slide-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,4,13,0.3) 0%, rgba(7,4,13,0.6) 60%, var(--bg-dark) 100%); }
    .hbo-slide-content { position: relative; z-index: 3; }
    .hbo-slide-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
    .hbo-slide-meta { font-size: 0.8rem; color: var(--accent-light); margin-bottom: 12px; }
    .hbo-slide-btns { display: flex; gap: 10px; align-items: center; }
    .hbo-btn-play { background: #fff; color: #000; border: none; padding: 9px 20px; border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .hbo-btn-add { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; height: 38px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .hbo-btn-add.saved { border-color: var(--accent-light); background: rgba(124, 58, 237, 0.25); }
    .hbo-btn-add svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .hbo-slider-dots { position: absolute; bottom: 12px; right: 20px; z-index: 10; display: flex; gap: 5px; }
    .hbo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    .search-box { width: 100%; max-width: 500px; position: relative; }
    .search-box input { width: 100%; padding: 11px 40px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-purple); color: #fff; border-radius: 8px; font-size: 0.95rem; outline: none; }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-gray); }
    .search-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }

    .section-title { font-size: 1rem; font-weight: 700; margin: 20px 20px 10px; color: #e2e8f0; }
    .horizontal-scroll { display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 0 20px; }

    .card { background: var(--card-bg); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; position: relative; }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; }
    .card-info { padding: 6px 8px; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }
    .card-fav-btn { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }
    .card-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

    .admin-btns { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; z-index: 10; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; padding: 15px; align-items: center; justify-content: center; overflow-y: auto; }
    .modal-box { background: #11091e; padding: 20px; border-radius: 10px; width: 100%; max-width: 480px; border: 1px solid var(--border-purple); position: relative; max-height: 90vh; overflow-y: auto; }
    .modal-box-series { background: #000; width: 100vw; height: 100vh; position: fixed; inset: 0; overflow-y: auto; z-index: 2100; display: none; }
    .btn-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.15); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; z-index: 2250; display: flex; align-items: center; justify-content: center; }

    .server-selector-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .server-btn {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-gray); padding: 7px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
    }
    .server-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .server-btn.active { background: var(--accent-purple); border-color: var(--accent-light); color: #fff; }

    .video-box { 
      width: 100%; aspect-ratio: 16/9; background: #000; margin-bottom: 15px; border-radius: 10px; 
      overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;
      border: 1px solid rgba(124, 58, 237, 0.35); box-shadow: 0 10px 30px rgba(0,0,0,0.75);
    }
    .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; display: block; }
    .video-loading { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; background: #000; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--accent-light); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 9px 12px; background: #07040d; border: 1px solid var(--border-purple); color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    .hbo-backdrop-header { position: relative; width: 100%; min-height: 230px; padding: 40px 20px 20px; display: flex; flex-direction: column; justify-content: flex-end; background-size: cover; background-position: center; }
    .hbo-backdrop-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 70%, #000 100%); }
    .hbo-header-content { position: relative; z-index: 2; }
    .season-selector-container { padding: 15px 20px 5px; }

    .hbo-ep-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .hbo-thumb { width: 130px; height: 74px; object-fit: cover; border-radius: 4px; background: #1a1528; flex-shrink: 0; position: relative; }
    .hbo-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); color: #fff; }
    .admin-episode-card { background: #07040d; border: 1px solid var(--border-purple); padding: 10px; border-radius: 6px; margin-bottom: 8px; }

</head>

        <div class="form-group">

        <div class="form-group"><label>Sinopsis</label><textarea id="descInput" rows="2"></textarea></div>
        <div class="form-group"><label>Portada URL</label><input type="url" id="coverInput" required></div>

        <div class="form-group" id="movieServersGroup">
          <label style="color:var(--accent-light); font-weight:600;">Servidores (VK Video, Tokyvideo, OK.ru, VOE, etc.)</label>

        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];

    if (isCreatorMode) document.body.classList.add('creator-mode');

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      if (viewName === 'home') { document.getElementById('viewHome').classList.add('active'); document.getElementById('navHome').classList.add('active'); renderHomeSections(); }
      else if (viewName === 'movies') { document.getElementById('viewMovies').classList.add('active'); document.getElementById('navMovies').classList.add('active'); renderMoviesGrid(); }
      else if (viewName === 'series') { document.getElementById('viewSeries').classList.add('active'); document.getElementById('navSeries').classList.add('active'); renderSeriesGrid(); }
      else if (viewName === 'list') { document.getElementById('viewList').classList.add('active'); document.getElementById('navList').classList.add('active'); renderMyList(); }
      window.scrollTo(0, 0);
    }

    function toggleFavorite(id, e) {
      e.stopPropagation();
      myFavorites.includes(id) ? myFavorites = myFavorites.filter(i => i !== id) : myFavorites.push(id);
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderHomeSections(); renderMoviesGrid(); renderSeriesGrid(); renderMyList();
    }

    function renderHomeSections() {
      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      [...catalog].sort((a,b) => b.dateAdded - a.dateAdded).forEach(item => recentScroll.appendChild(createCardElement(item)));
      
      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      [...catalog].sort((a,b) => b.views - a.views).slice(0,10).forEach(item => topScroll.appendChild(createCardElement(item)));
    }

    function renderMoviesGrid() {
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      catalog.filter(i => i.type === 'movie').forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderSeriesGrid() {
      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = '';
      catalog.filter(i => i.type === 'series').forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderMyList() {
      const grid = document.getElementById('myListGrid');
      grid.innerHTML = '';
      catalog.filter(i => myFavorites.includes(i.id)).forEach(item => grid.appendChild(createCardElement(item)));
      if (!grid.children.length) grid.innerHTML = '<div style="padding:20px; color:var(--text-gray)">No hay favoritos guardados.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);
      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})">✏️️</button>
          <button onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
        </div>
        <img src="${item.cover}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Imagen'">
        <div class="card-info"><div class="card-title">${item.title}</div><div class="card-sub">${item.year}</div></div>
      `;
      return card;
    }

    function checkSecretCode(e) {
      if (e.key === 'Enter' && e.target.value === "9009") {
        e.preventDefault(); e.target.value = '';
        isCreatorMode = !isCreatorMode;
        localStorage.setItem('naPlus_is_creator_active', isCreatorMode);
        document.body.classList.toggle('creator-mode', isCreatorMode);
        if (isCreatorMode) openUploadModal();
        renderHomeSections();
      }
    }

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;
      item.views = (item.views || 0) + 1;
      localStorage.setItem('naPlus_multiserver_db', JSON.stringify(catalog));

      if (item.type === 'series') {
        currentSeriesData = item;
        document.getElementById('hboBackdropHeader').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('seriesTitle').innerText = item.title;
        document.getElementById('seriesMeta').innerText = `${item.year} • ${item.genre}`;
        const select = document.getElementById('seasonSelect');
        select.innerHTML = '';
        if (item.seasons) item.seasons.forEach((s, idx) => select.innerHTML += `<option value="${idx}">${s.name}</option>`);
        renderEpisodesForSelectedSeason();
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        document.getElementById('detailTitle').innerText = item.title;
        document.getElementById('detailMeta').innerText = `${item.genre} • ${item.year}`;
        document.getElementById('detailDesc').innerText = item.desc || '';
        renderServersBar(item.servers || [], document.getElementById('movieServersBar'), document.getElementById('videoBox'));
        document.getElementById('detailModal').style.display = 'flex';
      }
    }

    function renderServersBar(servers, barContainer, videoBoxContainer) {
      barContainer.innerHTML = '';
      if (!servers || servers.length === 0) {
        videoBoxContainer.innerHTML = '<div style="color:var(--text-gray); text-align:center;">No hay servidores disponibles.</div>';
        return;
      }

      servers.forEach((srv, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `server-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerHTML = `<span>▶</span> ${srv.name || 'Servidor ' + (idx + 1)}`;
        btn.onclick = () => {
          barContainer.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadVideoUrl(videoBoxContainer, srv.url);
        };
        barContainer.appendChild(btn);
      });

      loadVideoUrl(videoBoxContainer, servers[0].url);
    }

    // --- FUNCIÓN OPTIMIZADA PARA VK VIDEO, TOKYVIDEO, OK.RU Y VOE ---
    function loadVideoUrl(vBox, url) {
      if (!url) {
        vBox.innerHTML = '<div style="color:var(--text-gray)">Enlace no válido.</div>';
        return;
      }
      let embed = url;

      if (url.includes('<iframe')) {
        const matchSrc = url.match(/src="([^"]+)"/);
        if (matchSrc && matchSrc[1]) embed = matchSrc[1];
      } else if (url.includes('voe.sx') && !url.includes('/e/')) {
        const id = url.split('/').pop();
        embed = `https://voe.sx/e/${id}`;
      } else if (url.includes('ok.ru') && !url.includes('videoembed')) {
        const match = url.match(/\/video\/([0-9]+)/);
        if (match) embed = `https://ok.ru/videoembed/${match[1]}`;
      } else if (url.includes('tokyvideo.com') && !url.includes('/embed/')) {
        const match = url.match(/\/video\/([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
          embed = `https://www.tokyvideo.com/embed/${match[1]}`;
        }
      } else if (url.includes('vk.com') || url.includes('vkvideo.ru')) {
        if (!url.includes('video_ext.php')) {
          const match = url.match(/video(-?[0-9]+)_([0-9]+)/);
          if (match && match[1] && match[2]) {
            embed = `https://vk.com/video_ext.php?oid=${match[1]}&id=${match[2]}&hd=2`;
          }
        }
      }

      vBox.innerHTML = `
        <div class="video-loading"><div class="spinner"></div></div>
        <iframe src="${embed}" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" onload="this.previousElementSibling.style.display='none'"></iframe>
      `;
    }

      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = '';
      if (!season || !season.episodes) return;

      season.episodes.forEach((ep, eIdx) => {
        const card = document.createElement('div');
        card.className = 'hbo-ep-row';
        card.onclick = () => playEpisode(sIdx, eIdx);
        card.innerHTML = `
          <div class="hbo-thumb">
            <img src="${ep.img || currentSeriesData.cover}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='https://via.placeholder.com/130x74?text=Capítulo'">
            <div class="hbo-play-icon">▶</div>
          </div>
          <div>
            <div style="font-weight:700;font-size:0.9rem;">${ep.num}. ${ep.title}</div>
            <div style="font-size:0.75rem;color:var(--text-gray);">${ep.desc || ''}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';

      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      
      const sContainer = document.getElementById('movieServersContainer');
      sContainer.innerHTML = '';

        item.servers.forEach(s => addMovieServerField(s.name, s.url));

        addMovieServerField('VK Video', '');
        addMovieServerField('Tokyvideo', '');

      const seasonsContainer = document.getElementById('seasonsContainer');
      seasonsContainer.innerHTML = '';

        item.seasons.forEach(s => addSeasonField(s));

        localStorage.setItem('naPlus_multiserver_db', JSON.stringify(catalog));
        renderHomeSections(); renderMoviesGrid(); renderSeriesGrid();

    function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const type = document.getElementById('typeInput').value;

      let servers = [];
      if (type === 'movie') {
        document.querySelectorAll('#movieServersContainer > div').forEach(div => {
          const name = div.querySelector('.srv-name').value.trim();
          const url = div.querySelector('.srv-url').value.trim();
          if (url) servers.push({ name: name || 'Servidor', url });
        });
      }

      let seasons = [];
      if (type === 'series') {
        document.querySelectorAll('#seasonsContainer > div').forEach(sDiv => {
          const sName = sDiv.querySelector('.season-name').value.trim() || 'Temporada';
          let episodes = [];
          sDiv.querySelectorAll('.episodes-admin-list > div').forEach(eDiv => {
            let epServers = [];
            eDiv.querySelectorAll('.ep-servers-container > div').forEach(srDiv => {
              const sName = srDiv.querySelector('.ep-srv-name').value.trim();
              const sUrl = srDiv.querySelector('.ep-srv-url').value.trim();
              if (sUrl) epServers.push({ name: sName || 'Servidor', url: sUrl });
            });
            episodes.push({
              num: parseInt(eDiv.querySelector('.ep-num').value) || 1,
              title: eDiv.querySelector('.ep-title').value.trim() || 'Capítulo',
              servers: epServers
            });
          });
          seasons.push({ name: sName, episodes });
        });
      }

      const existing = id ? catalog.find(x => x.id == id) : null;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        servers,
        seasons,
        views: existing ? existing.views : 10,
        dateAdded: existing ? existing.dateAdded : Date.now()
      };

      if (id) {
        catalog = catalog.map(x => x.id == id ? newItem : x);
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_multiserver_db', JSON.stringify(catalog));
      renderHomeSections(); renderMoviesGrid(); renderSeriesGrid();
      document.getElementById('uploadModal').style.display = 'none';
    }

    renderHomeSections();
  </script>
</body>
</html>
