<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }
    button { transition: transform 0.15s ease; }
    button:active { transform: scale(0.95); }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 0;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    /* BARRA SUPERIOR */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transform: translateZ(0);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* NAVEGACIÓN INFERIOR */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
      transform: translateZ(0);
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-gray);
      font-size: 0.65rem;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      width: 25%;
      transition: color 0.2s ease;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); transform: scale(1.08); }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; will-change: opacity; }
    .view-section.active { display: block; }
    #viewMovies, #viewSeries, #viewList { padding-top: 75px; }

    .hero { padding: 15px 20px 5px; }
    .hero#searchContainer { padding: 15px 20px 10px; }
    body.search-active .hero#searchContainer { padding-top: 80px; }

    /* CARRUSEL HERO */
    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
      transform: translateZ(0);
      touch-action: pan-y;
    }

    .hbo-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 24px 20px;
      background-size: cover;
      background-position: center;
      cursor: pointer;
    }

    .hbo-slide.active { opacity: 1; z-index: 2; }

    .hbo-slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.3) 0%, rgba(7,4,13,0.6) 60%, var(--bg-dark) 100%);
      pointer-events: none;
    }

    .hbo-slide-content { position: relative; z-index: 3; text-align: left; }

    .hbo-slide-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    .hbo-slide-meta { font-size: 0.8rem; color: var(--accent-light); margin-bottom: 12px; font-weight: 500; }
    .hbo-slide-btns { display: flex; gap: 10px; align-items: center; }

    .hbo-btn-play {
      background: #fff; color: #000; border: none; padding: 9px 20px;
      border-radius: 6px; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px); color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; height: 38px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .hbo-btn-add.saved { border-color: var(--accent-light); background: rgba(124, 58, 237, 0.25); }
    .hbo-btn-add.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }
    .hbo-btn-add svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

    .hbo-slider-dots {
      position: absolute; bottom: 12px; right: 20px; z-index: 10; display: flex; gap: 5px;
    }
    .hbo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    /* BUSCADOR */
    .search-box { width: 100%; max-width: 500px; position: relative; }
    .search-box .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-gray); }
    .search-box .search-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; }
    .search-box input {
      width: 100%; padding: 11px 40px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple); color: #fff; border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .clear-search-btn { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-gray); cursor: pointer; display: none; }

    /* SECCIONES Y SCROLL HORIZONTAL */
    .section-title {
      font-size: 1.05rem; font-weight: 700; margin: 22px 20px 10px; color: #f1f5f9; display: flex; align-items: center; gap: 6px;
    }

    .horizontal-scroll {
      display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    /* TOP 10 ESTILO NETFLIX/HBO CON NÚMEROS VECTORIALES */
    .horizontal-scroll.top-10-scroll {
      gap: 24px;
      padding-left: 36px;
    }
    .horizontal-scroll.top-10-scroll .top-card-wrapper {
      position: relative;
      min-width: 115px;
      width: 115px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .top-rank-number {
      position: absolute;
      left: -32px;
      bottom: 12px;
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      color: #07040d;
      -webkit-text-stroke: 2px #94a3b8;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
      z-index: 5;
      pointer-events: none;
      font-family: Impact, sans-serif;
    }
    .top-card-wrapper .card { width: 100%; min-width: 100%; z-index: 2; }

    /* GRILLAS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 0 20px; }

    .card {
      background: var(--card-bg); border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; position: relative;
    }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; }
    .card-info { padding: 6px 8px; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute; top: 6px; left: 6px; background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
      width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }
    .card-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }

    /* BOTONES DE ADMINISTRADOR / CREADOR */
    .admin-btns {
      display: none; position: absolute; top: 6px; right: 6px; gap: 4px; z-index: 10;
    }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff; width: 26px; height: 26px; border-radius: 50%; font-size: 0.7rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* MODALES Y FORMULARIO DE SUBIDA */
    .modal-overlay, .modal-box-movie, .modal-box-series {
      display: none; position: fixed; inset: 0; z-index: 2000; background: #07040d; overflow-y: auto;
    }
    .modal-box-movie, .modal-box-series { width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; }
    
    .modal-box {
      background: #11091e; padding: 20px; border-radius: 10px; width: 100%; max-width: 480px;
      border: 1px solid var(--border-purple); position: relative; margin: 40px auto;
    }

    .stream-top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 65px;
      display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 20px; z-index: 2260;
    }
    .stream-top-btn {
      background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff;
      width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .movie-header-bg, .stream-header-bg {
      position: relative; width: 100%; min-height: 420px; background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 75px 20px 20px 20px;
    }
    .movie-header-gradient, .stream-header-gradient {
      position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.7) 75%, #07040d 100%);
    }

    .movie-main-title, .stream-title-text { font-size: 1.8rem; font-weight: 900; margin-bottom: 6px; position: relative; z-index: 2; }
    .movie-meta-info, .stream-meta-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; position: relative; z-index: 2; }
    
    .movie-btn-play, .stream-play-main-btn {
      background: #fff; color: #000; border: none; width: 100%; padding: 12px;
      border-radius: 8px; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-bottom: 12px; position: relative; z-index: 2;
    }
    .movie-synopsis, .stream-synopsis { font-size: 0.82rem; color: #cbd5e1; line-height: 1.4; margin-bottom: 10px; position: relative; z-index: 2; }
    
    .movie-content-area, .stream-content-area { padding: 15px 20px 50px 20px; }
    .video-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
    .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px 12px; background: #07040d; border: 1px solid var(--border-purple);
      color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 0 20px; font-style: italic; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
  </header>

  <div id="viewHome" class="view-section active">
    <div class="hbo-hero-slider" id="hboHeroSlider">
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>

    <div class="hero" id="searchContainer">
      <div class="search-box">
        <span class="search-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
        <input type="text" id="searchInput" placeholder="Buscar película o serie..." oninput="handleSearch()" onkeydown="checkSecretCode(event)">
        <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearchInput()">✕</button>
      </div>
    </div>

    <div id="searchResultsContainer" style="display: none;">
      <div class="section-title">Resultados de Búsqueda</div>
      <div class="grid" id="searchGrid"></div>
    </div>

    <div id="mainHomeContent">
      <div class="section-title">🔥 Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

      <div class="section-title">⭐ Top 10 Más Vistas</div>
      <div class="horizontal-scroll top-10-scroll" id="topScroll"></div>

      <div id="genreRowsContainer"></div>
    </div>
  </div>

  <div id="viewMovies" class="view-section">
    <div class="section-title" style="margin-top: 10px;">🎬 Películas</div>
    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll top-10-scroll" id="moviesTopScroll"></div>
    <div class="section-title">Todas las Películas</div>
    <div class="grid" id="moviesGrid"></div>
  </div>

  <div id="viewSeries" class="view-section">
    <div class="section-title" style="margin-top: 10px;">📺 Series</div>
    <div class="section-title">⭐ Top 10 Más Vistas</div>
    <div class="horizontal-scroll top-10-scroll" id="seriesTopScroll"></div>
    <div class="section-title">Todas las Series</div>
    <div class="grid" id="seriesGrid"></div>
  </div>

  <div id="viewList" class="view-section">
    <div class="section-title" style="margin-top: 10px;">🔖 Mi Lista - Guardados</div>
    <div class="grid" id="myListGrid"></div>
  </div>

  <nav>
    <button class="nav-item active" id="navHome" onclick="switchView('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </button>
    <button class="nav-item" id="navMovies" onclick="switchView('movies')">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line></svg>
      Películas
    </button>
    <button class="nav-item" id="navSeries" onclick="switchView('series')">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
      Series
    </button>
    <button class="nav-item" id="navList" onclick="switchView('list')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      Mi Lista
    </button>
  </nav>

  <!-- MODAL PELÍCULA -->
  <div class="modal-box-movie" id="movieDetailModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="closeModal('movieDetailModal')">✕</button>
    </div>
    <div class="movie-header-bg" id="movieHeaderBg">
      <div class="movie-header-gradient"></div>
      <div>
        <div class="movie-main-title" id="movieTitle"></div>
        <div class="movie-meta-info" id="movieMeta"></div>
        <button class="movie-btn-play" onclick="playCurrentMovie()">▶ Ver ahora</button>
        <div class="movie-synopsis" id="movieDesc"></div>
      </div>
    </div>
  </div>

  <!-- MODAL REPRODUCTOR -->
  <div class="modal-overlay" id="moviePlayerModal">
    <div style="max-width: 750px; background:#000; width:100%; height:100%; position:relative; margin:0 auto;">
      <button class="stream-top-btn" style="position:absolute; top:15px; right:15px; z-index:3000;" onclick="closeMoviePlayerModal()">✕</button>
      <div class="video-box" id="fullscreenMovieVideoBox" style="width:100%; height:100%;"></div>
    </div>
  </div>

  <!-- MODAL SERIE -->
  <div class="modal-box-series" id="seriesModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="closeModal('seriesModal')">✕</button>
    </div>
    <div class="stream-header-bg" id="streamHeaderBg">
      <div class="stream-header-gradient"></div>
      <div>
        <div class="stream-title-text" id="seriesTitle"></div>
        <div class="stream-meta-info" id="seriesMeta"></div>
        <button class="stream-play-main-btn" onclick="playFirstEpisodeOfSeries()">▶ Reproducir</button>
        <div class="stream-synopsis" id="seriesDesc"></div>
      </div>
    </div>
    <div class="stream-content-area">
      <select id="seasonSelect" style="background:#07040d; color:#fff; padding:6px; margin-bottom:12px;" onchange="renderEpisodesForSelectedSeason()"></select>
      <div id="episodesListContainer"></div>
    </div>
  </div>

  <!-- MODAL SUBIR / EDITAR CONTENIDO -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="stream-top-btn" style="position:absolute; top:15px; right:15px;" onclick="closeModal('uploadModal')">✕</button>
      <h3 id="formTitle" style="margin-bottom:12px;">Subir Contenido</h3>
      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo</label>
          <select id="typeInput">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required>
        </div>
        <div class="form-group">
          <label>Género</label>
          <input type="text" id="genreInput" required placeholder="Terror, Acción">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required value="2026">
        </div>
        <div class="form-group">
          <label>Sinopsis</label>
          <textarea id="descInput" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label>URL de Portada</label>
          <input type="text" id="coverInput" required>
        </div>
        <div class="form-group">
          <label>Enlace de Video / Odysee</label>
          <input type="text" id="videoInput" placeholder="https://...">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "database.json";

    let catalog = [];
    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = localStorage.getItem('naPlus_is_creator_active') === 'true';
    if (isCreatorMode) document.body.classList.add('creator-mode');

    let currentSeriesData = null;
    let currentMovieData = null;

    // Cargar catálogo desde database.json con anti-caché
    async function loadCatalog() {
      try {
        const res = await fetch(FILE_PATH + '?v=' + Date.now(), { cache: 'no-store' });
        if (res.ok) {
          catalog = await res.json();
          initApp();
        }
      } catch (err) {
        console.error("Error al cargar database.json:", err);
      }
    }

    function initApp() {
      renderHomeSections();
      renderMoviesGrid();
      renderSeriesGrid();
      renderMyList();
    }

    function switchView(viewName) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
      } else if (viewName === 'movies') {
        document.getElementById('viewMovies').classList.add('active');
        document.getElementById('navMovies').classList.add('active');
      } else if (viewName === 'series') {
        document.getElementById('viewSeries').classList.add('active');
        document.getElementById('navSeries').classList.add('active');
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
      }
      window.scrollTo(0, 0);
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      initApp();
    }

    function checkSecretCode(e) {
      if (e.key === 'Enter') {
        const val = document.getElementById('searchInput').value.trim();
        if (val === "9009") {
          e.preventDefault();
          document.getElementById('searchInput').value = '';
          isCreatorMode = !isCreatorMode;
          localStorage.setItem('naPlus_is_creator_active', isCreatorMode ? 'true' : 'false');
          document.body.classList.toggle('creator-mode', isCreatorMode);
          if (isCreatorMode) openUploadModal();
          initApp();
        }
      }
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item && item.video ? item.video : '';
      document.getElementById('uploadModal').style.display = 'block';
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) {
        token = prompt("Introduce tu token de GitHub (ghp_...):");
        if (token) localStorage.setItem('naPlus_gh_token', token.trim());
        else return;
      }

      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: document.getElementById('typeInput').value,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim(),
        seasons: [],
        featured: false,
        views: Math.floor(Math.random() * 300) + 50,
        dateAdded: Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      closeModal('uploadModal');
      document.getElementById('saveBtn').innerText = "Publicando...";
      
      const success = await publishToGitHubAutomatically(token.trim());
      document.getElementById('saveBtn').innerText = "Guardar y Publicar";

      if (success) {
        alert("¡Publicado exitosamente en tu database.json de GitHub!");
        initApp();
      }
    }

    async function publishToGitHubAutomatically(token) {
      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
        });
        if (!getRes.ok) { alert("Error al conectar con GitHub. Revisa tu token."); return false; }
        const getData = await getRes.json();

        const jsonString = JSON.stringify(catalog, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: 'Actualización automática database.json desde NaPlus',
            content: encodedContent,
            sha: getData.sha
          })
        });

        return putRes.ok;
      } catch (err) {
        console.error(err);
        return false;
      }
    }

    function renderHomeSections() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const searchContainer = document.getElementById('searchResultsContainer');
      const mainContent = document.getElementById('mainHomeContent');
      const heroSlider = document.getElementById('hboHeroSlider');

      if (query.length > 0 && query !== "9009") {
        heroSlider.style.display = 'none';
        searchContainer.style.display = 'block';
        mainContent.style.display = 'none';
        const searchGrid = document.getElementById('searchGrid');
        searchGrid.innerHTML = '';
        catalog.filter(i => i.title.toLowerCase().includes(query)).forEach(item => searchGrid.appendChild(createCardElement(item)));
        return;
      } else {
        heroSlider.style.display = 'block';
        searchContainer.style.display = 'none';
        mainContent.style.display = 'block';
        renderHeroSlider();
      }

      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      [...catalog].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).forEach(item => recentScroll.appendChild(createCardElement(item)));

      const topScroll = document.getElementById('topScroll');
      topScroll.innerHTML = '';
      [...catalog].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach((item, index) => {
        topScroll.appendChild(createTopCardElement(item, index + 1));
      });
    }

    function renderMoviesGrid() {
      const movies = catalog.filter(i => i.type === 'movie');
      const topScroll = document.getElementById('moviesTopScroll');
      topScroll.innerHTML = '';
      [...movies].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach((item, index) => {
        topScroll.appendChild(createTopCardElement(item, index + 1));
      });
      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      movies.forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderSeriesGrid() {
      const series = catalog.filter(i => i.type === 'series');
      const topScroll = document.getElementById('seriesTopScroll');
      topScroll.innerHTML = '';
      [...series].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach((item, index) => {
        topScroll.appendChild(createTopCardElement(item, index + 1));
      });
      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = '';
      series.forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderMyList() {
      const grid = document.getElementById('myListGrid');
      grid.innerHTML = '';
      catalog.filter(i => myFavorites.includes(i.id)).forEach(item => grid.appendChild(createCardElement(item)));
      if (grid.children.length === 0) grid.innerHTML = '<div class="empty-msg">No tenés elementos guardados.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);
      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)">♥</button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
        </div>
        <img src="${item.cover}" alt="Portada" loading="lazy">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.year}</div>
        </div>
      `;
      return card;
    }

    function createTopCardElement(item, rank) {
      const wrapper = document.createElement('div');
      wrapper.className = 'top-card-wrapper';
      wrapper.onclick = () => openContentDetail(item.id);
      wrapper.innerHTML = `
        <div class="top-rank-number">${rank}</div>
        ${createCardElement(item).outerHTML}
      `;
      wrapper.querySelector('.card-fav-btn').onclick = (e) => toggleFavorite(item.id, e);
      wrapper.querySelector('.admin-btns button').onclick = (e) => { e.stopPropagation(); editItem(item.id); };
      return wrapper;
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    function renderHeroSlider() {
      const slider = document.getElementById('hboHeroSlider');
      const featured = catalog.slice(0, 5);
      if (!featured.length) return;
      const slide = document.createElement('div');
      slide.className = 'hbo-slide active';
      slide.style.backgroundImage = `url('${featured[0].cover}')`;
      slide.innerHTML = `
        <div class="hbo-slide-overlay"></div>
        <div class="hbo-slide-content">
          <div class="hbo-slide-title">${featured[0].title}</div>
          <div class="hbo-slide-meta">${featured[0].year}</div>
          <button class="hbo-btn-play" onclick="openContentDetail(${featured[0].id})">▶ Reproducir</button>
        </div>
      `;
      const dots = document.getElementById('hboSliderDots');
      slider.innerHTML = '';
      slider.appendChild(slide);
      slider.appendChild(dots);
    }

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item) return;
      if (item.type === 'series') {
        currentSeriesData = item;
        document.getElementById('streamHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('seriesTitle').innerText = item.title;
        document.getElementById('seriesMeta').innerText = `${item.year} • ${item.genre}`;
        document.getElementById('seriesDesc').innerText = item.desc || '';
        
        const seasonSelect = document.getElementById('seasonSelect');
        seasonSelect.innerHTML = '';
        (item.seasons || []).forEach((s, idx) => {
          const opt = document.createElement('option');
          opt.value = idx;
          opt.innerText = s.name;
          seasonSelect.appendChild(opt);
        });
        renderEpisodesForSelectedSeason();
        document.getElementById('seriesModal').style.display = 'block';
      } else {
        currentMovieData = item;
        document.getElementById('movieHeaderBg').style.backgroundImage = `url('${item.cover}')`;
        document.getElementById('movieTitle').innerText = item.title;
        document.getElementById('movieMeta').innerText = `${item.year} • ${item.genre}`;
        document.getElementById('movieDesc').innerText = item.desc || '';
        document.getElementById('movieDetailModal').style.display = 'block';
      }
    }

    function renderEpisodesForSelectedSeason() {
      const sIdx = document.getElementById('seasonSelect').value;
      const season = currentSeriesData.seasons[sIdx];
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = '';
      if (!season || !season.episodes) return;
      season.episodes.forEach((ep) => {
        const div = document.createElement('div');
        div.style.cssText = "display:flex; gap:10px; margin-bottom:10px; cursor:pointer;";
        div.onclick = () => playVideoDirect(ep.video);
        div.innerHTML = `
          <img src="${ep.img || currentSeriesData.cover}" style="width:100px; height:60px; object-fit:cover; border-radius:4px;">
          <div>
            <div style="font-size:0.85rem; font-weight:700;">${ep.num}. ${ep.title}</div>
            <div style="font-size:0.7rem; color:var(--text-gray);">${ep.duration || ''}</div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function playCurrentMovie() { if (currentMovieData) playVideoDirect(currentMovieData.video); }
    function playFirstEpisodeOfSeries() {
      if (currentSeriesData && currentSeriesData.seasons?.[0]?.episodes?.[0]) {
        playVideoDirect(currentSeriesData.seasons[0].episodes[0].video);
      }
    }
    function playVideoDirect(videoUrl) {
      const modal = document.getElementById('moviePlayerModal');
      const vBox = document.getElementById('fullscreenMovieVideoBox');
      vBox.innerHTML = `<iframe src="${videoUrl}" style="width:100%;height:100%;border:none;" allowfullscreen></iframe>`;
      modal.style.display = 'block';
    }
    function closeMoviePlayerModal() {
      document.getElementById('moviePlayerModal').style.display = 'none';
      document.getElementById('fullscreenMovieVideoBox').innerHTML = '';
    }

    function handleSearch() { renderHomeSections(); }
    function clearSearchInput() {
      document.getElementById('searchInput').value = '';
      renderHomeSections();
    }

    // Cargar aplicación al iniciar
    loadCatalog();
  </script>
</body>
</html>
