<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Estilo HBO Max</title>
  
  <!-- MANIFEST Y ESTILOS -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#07040d">

  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-bottom: 85px;
    }

    /* BARRA SUPERIOR */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    /* GRILLA INICIAL DE EJEMPLO */
    .catalog-preview {
      padding: 80px 20px 20px;
    }
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #f1f5f9;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
    }
    .card-info { padding: 8px; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ESTILO MODAL PELÍCULA - EXACTO A HBO MAX */
    .modal-box-movie {
      background: #07040d;
      padding: 0;
      border-radius: 0;
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
      overflow-y: auto;
      z-index: 2100;
      display: none;
      -webkit-overflow-scrolling: touch;
    }

    .stream-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.8) 0%, rgba(7,4,13,0) 100%);
      z-index: 2260;
    }
    .stream-top-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
    }

    .movie-header-bg {
      position: relative;
      width: 100%;
      min-height: 480px;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 80px 20px 20px 20px;
    }
    
    .movie-header-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.1) 0%, rgba(7,4,13,0.5) 50%, #07040d 100%);
    }

    .movie-info-container {
      position: relative;
      z-index: 2;
    }

    .movie-main-title {
      font-size: 2.2rem;
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .movie-meta-info {
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 16px;
      font-weight: 500;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* BOTÓN PRINCIPAL "VER AHORA" */
    .movie-btn-play {
      background: #ffffff;
      color: #000000;
      border: none;
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(255,255,255,0.15);
    }

    /* FILA DE ACCIONES (Mi lista, Calificar, Tráiler) */
    .movie-actions-row {
      display: flex;
      justify-content: flex-start;
      gap: 32px;
      margin-bottom: 18px;
    }
    .movie-action-ico-btn {
      background: none;
      border: none;
      color: var(--text-gray);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
    }
    .movie-action-ico-circle {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }

    .movie-synopsis {
      font-size: 0.82rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    /* PESTAÑAS INFERIORES: "Quizá también te guste" e "Información" */
    .stream-tabs-bar {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0 20px;
      gap: 24px;
      background: #07040d;
    }
    .stream-tab {
      background: none; border: none;
      color: var(--text-gray);
      font-size: 0.9rem; font-weight: 600;
      padding: 12px 0;
      cursor: pointer;
      position: relative;
    }
    .stream-tab.active {
      color: #fff;
      font-weight: 700;
    }
    .stream-tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 3px;
      background: #fff;
      border-radius: 3px 3px 0 0;
    }

    .stream-content-area {
      padding: 16px 20px 40px 20px;
      background: #07040d;
    }

    .horizontal-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    /* REPRODUCTOR */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 2500;
      align-items: center;
      justify-content: center;
    }
    .video-box {
      width: 100%; aspect-ratio: 16/9; background: #000; position: relative;
    }
    .video-box iframe, .video-box video { width: 100%; height: 100%; border: none; position: absolute; inset: 0; }
  </style>
</head>
<body>

  <header>
    <div class="logo">NaPlus</div>
  </header>

  <div class="catalog-preview">
    <div class="section-title">Películas Disponibles</div>
    <div class="grid" id="homeGrid"></div>
  </div>

  <!-- MODAL DE PELÍCULA (ESTILO HBO MAX) -->
  <div class="modal-box-movie" id="movieDetailModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="closeModal()">‹</button>
      <div style="display:flex; gap:16px;">
        <button class="stream-top-btn" title="Compartir">🔗</button>
        <button class="stream-top-btn" title="Transmitir">📺</button>
      </div>
    </div>

    <div class="movie-header-bg" id="movieHeaderBg">
      <div class="movie-header-gradient"></div>
      <div class="movie-info-container">
        <div class="movie-main-title" id="movieTitle"></div>
        <div class="movie-meta-info" id="movieMeta"></div>
        
        <!-- BOTÓN DE REPRODUCCIÓN (SIN DESCARGAR) -->
        <button class="movie-btn-play" onclick="playMovie()">
          ▶ Ver ahora
        </button>

        <!-- ACCIONES (MI LISTA, CALIFICAR, TRÁILER) -->
        <div class="movie-actions-row">
          <button class="movie-action-ico-btn">
            <div class="movie-action-ico-circle">✓</div>
            Mi lista
          </button>
          <button class="movie-action-ico-btn">
            <div class="movie-action-ico-circle">👍</div>
            Calificar
          </button>
          <button class="movie-action-ico-btn">
            <div class="movie-action-ico-circle">🎬</div>
            Tráiler
          </button>
        </div>

        <div class="movie-synopsis" id="movieDesc"></div>
      </div>
    </div>

    <!-- PESTAÑAS INFERIORES -->
    <div class="stream-tabs-bar">
      <button class="stream-tab active" id="tabRec" onclick="switchTab('rec')">Quizá también te guste</button>
      <button class="stream-tab" id="tabInfo" onclick="switchTab('info')">Información</button>
    </div>

    <div class="stream-content-area" id="contentRec">
      <div class="section-title" style="font-size:0.9rem; color:var(--text-gray); margin-bottom:8px;">Recomendaciones</div>
      <div class="horizontal-scroll" id="recScroll"></div>
    </div>

    <div class="stream-content-area" id="contentInfo" style="display: none;">
      <p id="infoText" style="font-size: 0.8rem; color: var(--text-gray); line-height: 1.5;"></p>
    </div>
  </div>

  <!-- REPRODUCTOR DE VIDEO -->
  <div class="modal-overlay" id="playerModal">
    <div style="width:100%; max-width:750px; position:relative;">
      <button onclick="closePlayer()" style="position:absolute; top:-40px; right:0; background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">✕</button>
      <div class="video-box" id="videoBox"></div>
    </div>
  </div>

  <script>
    // Catálogo de ejemplo con el estilo exacto solicitado
    const moviesCatalog = [
      {
        id: 1,
        title: "Observados",
        year: "2024",
        rating: "13+",
        duration: "1h 42min",
        genre: "Terror, Misterio",
        cover: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80",
        desc: "Cuatro extraños atrapados en un bosque deben tomar una decisión: ser vigilados por criaturas extrañas y vivir o huir y morir.",
        video: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
      },
      {
        id: 2,
        title: "Ex-Máquina",
        year: "2015",
        rating: "16+",
        duration: "1h 48min",
        genre: "Ciencia Ficción, Drama",
        cover: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80",
        desc: "Un joven programador es invitado a la mansión de montaña de su jefe para evaluar una nueva inteligencia artificial con forma de mujer.",
        video: "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
      }
    ];

    let currentMovie = null;

    function renderHome() {
      const grid = document.getElementById('homeGrid');
      grid.innerHTML = '';
      moviesCatalog.forEach(m => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openMovie(m.id);
        card.innerHTML = `
          <img src="${m.cover}" alt="${m.title}">
          <div class="card-info">
            <div class="card-title">${m.title}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openMovie(id) {
      currentMovie = moviesCatalog.find(x => x.id === id);
      if (!currentMovie) return;

      document.getElementById('movieHeaderBg').style.backgroundImage = `url('${currentMovie.cover}')`;
      document.getElementById('movieTitle').innerText = currentMovie.title;
      document.getElementById('movieMeta').innerHTML = `<span>${currentMovie.rating}</span> • <span>${currentMovie.duration}</span> • <span>${currentMovie.year}</span>`;
      document.getElementById('movieDesc').innerText = currentMovie.desc;
      document.getElementById('infoText').innerText = `Género: ${currentMovie.genre}. Directores y detalles adicionales de producción exclusivos de ${currentMovie.title}.`;

      // Renderizar recomendaciones abajo
      const recScroll = document.getElementById('recScroll');
      recScroll.innerHTML = '';
      moviesCatalog.filter(x => x.id !== id).forEach(m => {
        const rCard = document.createElement('div');
        rCard.className = 'card';
        rCard.onclick = () => openMovie(m.id);
        rCard.innerHTML = `
          <img src="${m.cover}" alt="${m.title}">
          <div class="card-info">
            <div class="card-title">${m.title}</div>
          </div>
        `;
        recScroll.appendChild(rCard);
      });

      switchTab('rec');
      document.getElementById('movieDetailModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('movieDetailModal').style.display = 'none';
    }

    function switchTab(tab) {
      const rBtn = document.getElementById('tabRec');
      const iBtn = document.getElementById('tabInfo');
      const rCont = document.getElementById('contentRec');
      const iCont = document.getElementById('contentInfo');

      if (tab === 'rec') {
        rBtn.classList.add('active'); iBtn.classList.remove('active');
        rCont.style.display = 'block'; iCont.style.display = 'none';
      } else {
        iBtn.classList.add('active'); rBtn.classList.remove('active');
        iCont.style.display = 'block'; rCont.style.display = 'none';
      }
    }

    function playMovie() {
      const vBox = document.getElementById('videoBox');
      vBox.innerHTML = `<iframe src="${currentMovie.video}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      document.getElementById('playerModal').style.display = 'flex';
    }

    function closePlayer() {
      document.getElementById('playerModal').style.display = 'none';
      document.getElementById('videoBox').innerHTML = '';
    }

    renderHome();
  </script>
</body>
</html>
