<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NaPlus - Películas y Series</title>
<style>
  :root {
    --bg: #090a0f;
    --surface: #13151f;
    --primary: #7c3aed;
    --accent: #06b6d4;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }

  /* Barra Superior Limpia */
  header {
    background: var(--surface); padding: 15px; display: flex;
    justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 1.4rem; font-weight: 900; color: var(--accent); letter-spacing: 0.5px; }

  .nav-tabs { display: flex; gap: 8px; }
  .nav-tab {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer;
  }
  .nav-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* Contenedores de Vistas */
  .container { padding: 15px; }
  .section { display: none; }
  .section.active { display: block; }

  /* Buscador táctil rápido */
  .search-box {
    width: 100%; padding: 14px; background: var(--surface);
    border: 1px solid var(--border); color: #fff; border-radius: 10px;
    font-size: 1rem; outline: none; margin-bottom: 20px;
  }
  .search-box:focus { border-color: var(--accent); }

  .title { font-size: 1.1rem; font-weight: bold; margin: 20px 0 10px; color: var(--text); border-left: 3px solid var(--accent); padding-left: 8px; }
  
  /* Grilla de Películas */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card {
    background: var(--surface); border-radius: 8px; overflow: hidden;
    border: 1px solid var(--border); position: relative; cursor: pointer;
  }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #000; }
  .card-body { padding: 8px; }
  .card-title { font-size: 0.75rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 0.65rem; color: var(--muted); }

  /* Botones de Administrador Directos sobre la tarjeta */
  .card-admin {
    display: none; position: absolute; top: 5px; right: 5px; gap: 4px; z-index: 10;
  }
  body.admin-on .card-admin { display: flex; }
  .card-admin button {
    background: rgba(0,0,0,0.9); border: 1px solid var(--primary); color: #fff;
    width: 30px; height: 30px; border-radius: 6px; font-size: 0.8rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* Formulario Panel Creador / Ajustes */
  .panel-box { background: var(--surface); border-radius: 12px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--border); }
  .panel-box h3 { font-size: 1rem; margin-bottom: 12px; color: var(--accent); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border);
    color: #fff; border-radius: 8px; font-size: 0.95rem; outline: none;
  }

  .btn { background: var(--primary); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
  .btn:active { opacity: 0.8; }

  /* Reproductor Pantalla Completa */
  .player-modal {
    display: none; position: fixed; inset: 0; background: #000; z-index: 99999; flex-direction: column;
  }
  .player-modal.active { display: flex; }
  .player-top { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(0,0,0,0.8); }
  .btn-close { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
  
  .player-screen { flex: 1; display: flex; align-items: center; justify-content: center; }
  .player-screen iframe { width: 100%; height: 100%; border: none; }

  .player-info { padding: 20px; background: var(--surface); max-height: 40vh; overflow-y: auto; }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #000; padding: 10px 20px; border-radius: 20px;
    font-size: 0.85rem; font-weight: bold; z-index: 999999; display: none; text-align: center;
  }
</style>
</head>
<body>

  <header>
    <div class="logo">NaPlus</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="app.switchTab('home', this)">Inicio</button>
      <button class="nav-tab" onclick="app.switchTab('list', this)">Mi Lista</button>
      <button class="nav-tab" onclick="app.switchTab('settings', this)">Ajustes</button>
    </div>
  </header>

  <div class="container">
    <!-- PESTAÑA INICIO -->
    <div id="tab-home" class="section active">
      <input type="search" class="search-box" id="searchInput" placeholder="🔍 Buscar películas o series..." oninput="app.render()">
      
      <div class="title">Películas</div>
      <div class="grid" id="movieGrid"></div>

      <div class="title" style="margin-top: 30px;">Series</div>
      <div class="grid" id="seriesGrid"></div>
    </div>

    <!-- PESTAÑA MI LISTA -->
    <div id="tab-list" class="section">
      <div class="title">Mi Lista Guardada</div>
      <div class="grid" id="listGrid"></div>
      <p id="emptyListMsg" style="color:var(--muted); text-align:center; margin-top:30px; display:none;">No guardaste nada todavía.</p>
    </div>

    <!-- PESTAÑA AJUSTES / ADMIN -->
    <div id="tab-settings" class="section">
      <div class="panel-box" id="creatorCard" style="display:none;">
        <h3>Panel de Creador</h3>
        <button class="btn" onclick="app.openEditor()">+ Subir Contenido Nuevo</button>
      </div>

      <div class="panel-box">
        <h3>Modo Administrador</h3>
        <div class="field">
          <label>Clave (9009) o Token de GitHub (ghp_...)</label>
          <input type="password" placeholder="Ingresar credencial..." oninput="app.auth(this.value)">
        </div>
      </div>
    </div>
  </div>

  <!-- REPRODUCTOR -->
  <div class="player-modal" id="playerModal">
    <div class="player-top">
      <h3 id="pTitleTop" style="font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:80%;"></h3>
      <button class="btn-close" onclick="app.closePlayer()">✕</button>
    </div>
    <div class="player-screen" id="pScreen"></div>
    <div class="player-info">
      <h2 id="pTitle" style="font-size:1.2rem; margin-bottom:5px;"></h2>
      <p id="pMeta" style="color:var(--accent); font-size:0.85rem; margin-bottom:10px;"></p>
      <p id="pDesc" style="color:var(--muted); font-size:0.9rem; line-height:1.4;"></p>
      <button class="btn" id="listBtn" style="margin-top:15px;" onclick="app.toggleMyList()">+ Agregar a Mi Lista</button>
    </div>
  </div>

  <!-- MODAL EDITAR / SUBIR -->
  <div class="player-modal" id="editorModal" style="background:rgba(0,0,0,0.85); justify-content:flex-end;">
    <div style="background:var(--surface); width:100%; max-height:90vh; border-radius:20px 20px 0 0; padding:20px; overflow-y:auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 id="editorHeading" style="color:var(--accent);">Subir Contenido</h3>
        <button class="btn-close" onclick="app.closeEditor()">✕</button>
      </div>
      <form onsubmit="app.saveContent(event)">
        <input type="hidden" id="eId">
        <div class="field"><label>Tipo</label><select id="eType"><option value="movie">Película</option><option value="series">Serie</option></select></div>
        <div class="field"><label>Título</label><input type="text" id="eTitle" required></div>
        <div class="field"><label>Género</label><input type="text" id="eGenre" required placeholder="Terror, Acción..."></div>
        <div class="field"><label>Año</label><input type="number" id="eYear" required value="2026"></div>
        <div class="field"><label>Sinopsis</label><textarea id="eDesc" rows="3"></textarea></div>
        <div class="field"><label>URL de Portada</label><input type="url" id="eCover" required placeholder="https://..."></div>
        <div class="field"><label>Link de Video (OK.ru)</label><input type="url" id="eVideo" required placeholder="https://ok.ru/video/..."></div>
        <button type="submit" class="btn" style="margin-top:10px;">Guardar y Sincronizar</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

<script>
const DEFAULT_CATALOG = /*CATALOG_START*/[
  {
    "id": 1,
    "type": "movie",
    "title": "[REC]",
    "genre": "Terror",
    "year": "2007",
    "desc": "Película de prueba.",
    "cover": "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400",
    "video": "https://ok.ru/videoembed/237592963750"
  }
]/*CATALOG_END*/;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ADMIN_PASS = String(90 * 100 + 9);
const isToken = t => /^(ghp_|github_pat_)[A-Za-z0-9_]{20,}$/.test(t || '');
const MARK_REGEX = /\/\*CATALOG_START\*\/([\s\S]*?)\/\*CATALOG_END\*\//;
const wrapCatalog = json => '/*CATALOG_' + 'START*/' + json + '/*CATALOG_' + 'END*/';
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));
const b64enc = s => {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return btoa(bin);
};
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch(e){return null;} },
  set(k, v) { try { localStorage.setItem(k, v); } catch(e){} },
  del(k) { try { localStorage.removeItem(k); } catch(e){} }
};

function parseOk(url) {
  let u;
  try { u = new URL(url); } catch(e){return null;}
  if(u.hostname.replace(/^(www\.|m\.)/, '') !== 'ok.ru') return null;
  const m = u.pathname.match(/\/(?:video|videoembed)\/(\d+)/);
  return m ? 'https://ok.ru/videoembed/' + m[1] : null;
}

class NaPlusApp {
  constructor() {
    this.repo = "ignacio12adrian-ux/NaPlus";
    this.file = "index.html";
    this.catalog = DEFAULT_CATALOG.slice();
    this.myList = [];
    try { this.myList = JSON.parse(storage.get('naplus_favs_v2')) || []; } catch(e){}
    this.currentId = null;
    this.isAdmin = false;
  }

  showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  switchTab(tabName, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    $('tab-' + tabName).classList.add('active');
    btn.classList.add('active');
    window.scrollTo(0,0);
    if(tabName === 'home') this.render();
    if(tabName === 'list') this.renderList();
  }

  createCard(item) {
    const div = document.createElement('div');
    div.className = 'card';
    const id = Number(item.id);
    
    div.onclick = () => this.openPlayer(id);

    div.innerHTML = `
      <div class="card-admin">
        <button onclick="event.stopPropagation(); app.openEditor(${id})">✏️</button>
        <button onclick="event.stopPropagation(); app.deleteItem(${id})">🗑️</button>
      </div>
      <img src="${esc(item.cover)}" alt="Poster" loading="lazy">
      <div class="card-body">
        <div class="card-title">${esc(item.title)}</div>
        <div class="card-sub">${esc(item.genre)} • ${item.year}</div>
      </div>
    `;
    return div;
  }

  render() {
    const q = norm($('searchInput').value);
    const mGrid = $('movieGrid'), sGrid =$('seriesGrid');
    mGrid.innerHTML = ''; sGrid.innerHTML = '';

    const filtered = this.catalog.filter(i => norm(i.title).includes(q) || norm(i.genre).includes(q));
    const movies = filtered.filter(i => i.type === 'movie');
    const series = filtered.filter(i => i.type === 'series');

    movies.forEach(i => mGrid.appendChild(this.createCard(i)));
    series.forEach(i => sGrid.appendChild(this.createCard(i)));

    if(!movies.length) mGrid.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;">Sin resultados.</p>';
    if(!series.length) sGrid.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;">Sin resultados.</p>';
  }

  renderList() {
    const grid = $('listGrid');
    grid.innerHTML = '';
    const items = this.catalog.filter(i => this.myList.includes(i.id));
    const msg = $('emptyListMsg');

    if(!items.length) {
      msg.style.display = 'block';
    } else {
      msg.style.display = 'none';
      items.forEach(i => grid.appendChild(this.createCard(i)));
    }
  }

  openPlayer(id) {
    this.currentId = id;
    const item = this.catalog.find(x => x.id === id);
    if(!item) return;

    $('pTitleTop').textContent = item.title;
    $('pTitle').textContent = item.title;
    $('pMeta').textContent = `${item.genre} • ${item.year}`;
    $('pDesc').textContent = item.desc || 'Sin sinopsis.';
    this.updateListBtn();

    const embed = parseOk(item.video);
    $('pScreen').innerHTML = embed ? `<iframe src="${esc(embed)}" allowfullscreen allow="autoplay"></iframe>` : '<div style="color:var(--accent);">Video no disponible</div>';
    $('playerModal').classList.add('active');
  }

  closePlayer() {
    $('pScreen').innerHTML = '';$('playerModal').classList.remove('active');
  }

  updateListBtn() {
    const inList = this.myList.includes(this.currentId);
    const btn = $('listBtn');
    btn.textContent = inList ? '✓ En Mi Lista' : '+ Agregar a Mi Lista';
    btn.style.background = inList ? '#332b4a' : 'var(--primary)';
  }

  toggleMyList() {
    const idx = this.myList.indexOf(this.currentId);
    if(idx > -1) {
      this.myList.splice(idx, 1);
      this.showToast('Eliminado de Mi Lista');
    } else {
      this.myList.push(this.currentId);
      this.showToast('Agregado a Mi Lista');
    }
    storage.set('naplus_favs_v2', JSON.stringify(this.myList));
    this.updateListBtn();
    this.renderList();
  }

  auth(val) {
    const v = val.trim();
    if(v === ADMIN_PASS || isToken(v)) {
      if(isToken(v)) storage.set('naplus_token', v);
      this.activateAdmin();
    }
  }

  activateAdmin() {
    if(this.isAdmin) return;
    this.isAdmin = true;
    $('creatorCard').style.display = 'block';
    document.body.classList.add('admin-on');
    this.showToast('Modo Administrador Activo');
  }

  openEditor(id = null) {
    if(id) {
      const item = this.catalog.find(x => x.id === id);
      if(!item) return;
      $('editorHeading').textContent = 'Editar Contenido';$('eId').value = item.id;
      $('eType').value = item.type;
      $('eTitle').value = item.title;
      $('eGenre').value = item.genre;
      $('eYear').value = item.year;
      $('eDesc').value = item.desc \vert{}\vert{} '';$('eCover').value = item.cover;
      $('eVideo').value = item.video;
    } else {
      $('editorHeading').textContent = 'Subir Contenido';
      $('eId').value = '';$('eType').value = 'movie';
      $('eTitle').value = '';$('eGenre').value = '';
      $('eYear').value = '2026';$('eDesc').value = '';
      $('eCover').value = '';$('eVideo').value = '';
    }
    $('editorModal').classList.add('active');
  }

  closeEditor() { $('editorModal').classList.remove('active'); }

  async deleteItem(id) {
    if(!confirm("¿Eliminar este título?")) return;
    this.catalog = this.catalog.filter(x => x.id !== id);
    this.myList = this.myList.filter(x => x !== id);
    storage.set('naplus_favs_v2', JSON.stringify(this.myList));
    this.render();
    this.renderList();
    this.showToast('Eliminado');
    await this.syncGitHub();
  }

  async saveContent(e) {
    e.preventDefault();
    const vUrl = $('eVideo').value.trim();
    if(!parseOk(vUrl)) {
      alert("El enlace debe ser de OK.ru (ej: https://ok.ru/video/...)");
      return;
    }

    const eId = $('eId').value;
    const item = {
      id: eId ? parseInt(eId, 10) : Date.now(),
      type: $('eType').value,
      title: $('eTitle').value.trim(),
      genre: $('eGenre').value.trim(),
      year: $('eYear').value,
      desc: $('eDesc').value.trim(),
      cover: $('eCover').value.trim(),
      video: vUrl
    };

    const idx = eId ? this.catalog.findIndex(x => x.id == eId) : -1;
    if(idx !== -1) this.catalog[idx] = item;
    else this.catalog.unshift(item);

    this.closeEditor();
    this.render();
    this.renderList();
    this.showToast('Guardado con éxito');
    await this.syncGitHub();
  }

  async syncGitHub() {
    let token = storage.get('naplus_token');
    if(!isToken(token)) {
      token = prompt("Ingresá tu Token de GitHub (ghp_...) para publicar globalmente:");
      if(isToken(token)) {
        token = token.trim();
        storage.set('naplus_token', token);
        this.activateAdmin();
      } else {
        return;
      }
    }

    this.showToast('Sincronizando con GitHub...');
    const url = `https://api.github.com/repos/${this.repo}/contents/${this.file}`;
    const headers = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' };

    try {
      const res = await fetch(url, { headers });
      if(!res.ok) { this.showToast('Error de Token'); return; }
      const data = await res.json();
      const code = b64dec(data.content);

      const jsonStr = JSON.stringify(this.catalog, null, 2);
      const newCode = MARK_REGEX.test(code) ? code.replace(MARK_REGEX, wrapCatalog(jsonStr)) : code;

      const putRes = await fetch(url, {
        method: 'PUT',
        headers: { ...headers, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'Actualización NaPlus',
          content: b64enc(newCode),
          sha: data.sha
        })
      });

      if(putRes.ok) this.showToast('✅ ¡Publicado globalmente!');
      else this.showToast('❌ Error al publicar');
    } catch(err) {
      this.showToast('❌ Error de red');
    }
  }

  async initCloud() {
    const token = storage.get('naplus_token');
    if(!isToken(token)) return;
    try {
      const res = await fetch(`https://api.github.com/repos/${this.repo}/contents/${this.file}`, {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
      });
      if(!res.ok) return;
      const data = await res.json();
      const code = b64dec(data.content);
      const match = code.match(MARK_REGEX);
      if(match) {
        const remote = JSON.parse(match[1]);
        if(Array.isArray(remote) && remote.length) {
          this.catalog = remote;
          this.render();
          this.renderList();
        }
      }
    } catch(e){}
  }
}

const app = new NaPlusApp();
app.initCloud();
app.render();

if(isToken(storage.get('naplus_token'))) {
  app.activateAdmin();
}
</script>
</body>
</html>
