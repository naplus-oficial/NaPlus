<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  
  <!-- CONFIGURACIÓN PWA OFICIAL -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7c3aed">

  <!-- Estilos y Librería de Video.js (Estilo VLC) -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg: #120b20;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { scroll-behavior: smooth; }

    button { transition: transform 0.15s ease; }
    button:active { transform: scale(0.95); }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 0;
      padding-bottom: 85px;
      -webkit-font-smoothing: antialiased;
    }

    /* REPRODUCTOR ESTILO VLC (VIDEO.JS) PERSONALIZADO */
    .native-player-box {
      width: 100%;
      height: 100%;
      background: #000;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 8px 8px 0 0;
    }

    .video-js.vjs-fluid { width: 100%; height: 100%; }
    .video-js .vjs-control-bar {
      background-color: rgba(20, 15, 30, 0.9) !important;
      border-top: 1px solid var(--border-purple);
    }
    .video-js .vjs-play-progress { background-color: var(--accent-purple) !important; }
    .video-js .vjs-slider { background-color: rgba(255, 255, 255, 0.2) !important; }
    .video-js .vjs-big-play-button {
      background-color: rgba(124, 58, 237, 0.8) !important;
      border: none !important;
      border-radius: 50% !important;
      width: 60px !important;
      height: 60px !important;
      line-height: 60px !important;
      margin-top: -30px !important;
      margin-left: -30px !important;
    }
    .video-js .vjs-big-play-button:hover { background-color: var(--accent-purple) !important; }

    /* ANIMACIONES */
    @keyframes heartBeat {
      0% { transform: scale(1); }
      30% { transform: scale(1.35); }
      50% { transform: scale(0.9); }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.25); }
      80% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    .anim-pop { animation: popBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .anim-heart { animation: heartBeat 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* BARRA SUPERIOR */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 65px;
      padding: 0 20px;
      background: linear-gradient(180deg, rgba(7,4,13,0.9) 0%, rgba(7,4,13,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      transform: translateZ(0);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* NAVEGACIÓN INFERIOR */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background: rgba(7, 4, 13, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 1000;
      transform: translateZ(0);
    }

    .nav-item {
      background: none; border: none;
      color: var(--text-gray);
      font-size: 0.62rem; font-weight: 500;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; width: 25%;
      transition: color 0.2s ease;
    }

    .nav-item svg {
      width: 22px; height: 22px;
      fill: none; stroke: currentColor;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s ease;
    }

    .nav-item.active { color: var(--accent-light); font-weight: 700; }
    .nav-item.active svg { stroke: var(--accent-light); transform: scale(1.08); }

    /* VISTAS */
    .view-section { display: none; padding-bottom: 20px; will-change: opacity; }
    .view-section.active { display: block; }
    #viewMovies, #viewList, #viewSearch { padding-top: 75px; }

    /* CARRUSEL HERO */
    .hbo-hero-slider {
      position: relative;
      width: 100%;
      height: 460px;
      background: #000;
      overflow: hidden;
      margin-bottom: 15px;
      transform: translateZ(0);
    }

    .hbo-slides-wrapper {
      display: flex; width: 100%; height: 100%;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .hbo-slide {
      position: relative; min-width: 100%; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 24px 20px; background-size: cover; background-position: center;
      flex-shrink: 0; cursor: pointer; user-select: none;
    }

    .hbo-slide-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.2) 0%, rgba(7,4,13,0.5) 60%, var(--bg-dark) 100%);
      pointer-events: none;
    }

    .hbo-slide-content { position: relative; z-index: 3; text-align: left; }
    .hbo-slide-title { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; line-height: 1.2; text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
    .hbo-slide-meta { font-size: 0.8rem; color: var(--accent-light); margin-bottom: 12px; font-weight: 500; }
    .hbo-slide-btns { display: flex; gap: 10px; align-items: center; }

    .hbo-btn-play {
      background: #fff; color: #000; border: none;
      padding: 9px 20px; border-radius: 6px;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }

    .hbo-btn-add {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
      width: 38px; height: 38px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s ease;
    }
    .hbo-btn-add:hover { background: rgba(0, 0, 0, 0.8); }
    .hbo-btn-add svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .hbo-btn-add.saved { border-color: var(--accent-light); background: rgba(124, 58, 237, 0.25); }
    .hbo-btn-add.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .hbo-slider-dots {
      position: absolute; bottom: 12px; right: 20px; z-index: 10;
      display: flex; gap: 5px; pointer-events: none;
    }
    .hbo-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .hbo-dot.active { background: #fff; width: 18px; border-radius: 3px; }

    /* BUSCADOR */
    .search-hero { padding: 15px 20px 10px; }
    .search-box { width: 100%; max-width: 500px; position: relative; margin: 0 auto; }
    .search-box .search-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--text-gray); display: flex; align-items: center; pointer-events: none;
    }
    .search-box .search-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .search-box input {
      width: 100%; padding: 11px 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple); color: #fff;
      border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .search-box input:focus { border-color: var(--accent-light); background: rgba(255, 255, 255, 0.08); }

    .clear-search-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-gray); font-size: 1.1rem; cursor: pointer; padding: 4px;
    }
    .clear-search-btn:hover { color: #fff; }

    .section-title {
      font-size: 1.2rem; font-weight: 800;
      margin: 28px 20px 12px; color: #ffffff; letter-spacing: -0.3px;
    }

    .horizontal-scroll {
      display: flex; gap: 12px; overflow-x: auto;
      padding: 0 20px 10px; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; transform: translateZ(0);
    }
    .horizontal-scroll::-webkit-scrollbar { display: none; }
    .horizontal-scroll .card { min-width: 110px; width: 110px; flex-shrink: 0; }

    .horizontal-scroll-large {
      display: flex; gap: 14px; overflow-x: auto;
      padding: 0 20px 12px; scrollbar-width: none;
      -webkit-overflow-scrolling: touch; transform: translateZ(0);
    }
    .horizontal-scroll-large::-webkit-scrollbar { display: none; }
    .horizontal-scroll-large .card { min-width: 145px; width: 145px; flex-shrink: 0; }

    /* TOP 10 */
    .top10-section-wrapper { margin: 28px 0 10px 0; }
    .top10-header-title { padding: 0 20px; margin-bottom: 12px; display: flex; flex-direction: column; line-height: 1; }
    .top10-title-main {
      font-size: 1.9rem; font-weight: 900; letter-spacing: 2px;
      color: #ffffff; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .top10-title-sub { font-size: 0.8rem; font-weight: 700; letter-spacing: 3px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; }
    .top10-scroll-container {
      display: flex; gap: 16px; overflow-x: auto; padding: 15px 20px 20px 20px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; align-items: flex-end;
    }
    .top10-scroll-container::-webkit-scrollbar { display: none; }
    .top10-item-card { position: relative; min-width: 225px; width: 225px; flex-shrink: 0; display: flex; align-items: flex-end; cursor: pointer; }
    .top10-number-svg {
      position: absolute; left: -8px; bottom: -4px; width: 48px; height: 70px;
      z-index: 1; pointer-events: none; user-select: none; filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.9));
    }
    .top10-poster-box {
      position: relative; width: 180px; aspect-ratio: 2/3;
      border-radius: 9px; overflow: hidden; background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.12); z-index: 2; margin-left: 36px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.75); transition: transform 0.2s ease;
    }
    .top10-item-card:active .top10-poster-box { transform: scale(0.96); }
    .top10-poster-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .top10-fav-btn {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5;
    }
    .top10-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; }
    .top10-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    /* GRILLAS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; padding: 0 20px; }
    .card {
      background: var(--card-bg); border-radius: 6px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04); cursor: pointer; position: relative; transform: translateZ(0);
    }
    .card:active { transform: scale(0.97); }
    .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; background: #1a1528; pointer-events: none; }
    .card-info { padding: 6px 8px; pointer-events: none; }
    .card-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub { font-size: 0.65rem; color: var(--text-gray); }

    .card-fav-btn {
      position: absolute; top: 6px; left: 6px;
      background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; width: 30px; height: 30px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10;
    }
    .card-fav-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .card-fav-btn.saved svg { fill: var(--accent-light); stroke: var(--accent-light); }

    .admin-btns { display: none; position: absolute; top: 6px; right: 6px; gap: 4px; z-index: 10; }
    body.creator-mode .admin-btns { display: flex; }
    .admin-btns button {
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; width: 26px; height: 26px;
      border-radius: 50%; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* MODALES GENERALES */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
      z-index: 3000; padding: 15px; align-items: center; justify-content: center; overflow-y: auto;
    }
    .modal-box {
      background: #11091e; padding: 20px; border-radius: 10px; width: 100%; max-width: 480px;
      border: 1px solid var(--border-purple); position: relative; max-height: 90vh; overflow-y: auto;
    }

    /* MODAL PELÍCULA */
    .modal-box-movie {
      background: #07040d; padding: 0; border-radius: 0;
      width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh;
      position: fixed; inset: 0; overflow-y: auto; z-index: 2100; display: none; -webkit-overflow-scrolling: touch;
    }
    .movie-header-bg {
      position: relative; width: 100%; min-height: 520px;
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 75px 20px 20px 20px;
      pointer-events: auto;
    }
    .movie-header-gradient {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(7,4,13,0.1) 0%, rgba(7,4,13,0.5) 50%, #07040d 100%);
      pointer-events: none;
    }
    .movie-info-container { position: relative; z-index: 5; pointer-events: auto; }
    .movie-main-title { font-size: 2.2rem; font-weight: 900; line-height: 1.1; margin-bottom: 6px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    .movie-meta-info { font-size: 0.8rem; color: #94a3b8; margin-bottom: 16px; font-weight: 500; }
    
    .movie-btn-play {
      background: #ffffff; color: #000000; border: none; width: 100%; padding: 13px;
      border-radius: 8px; font-size: 0.95rem; font-weight: 800; display: flex; align-items: center;
      justify-content: center; gap: 8px; cursor: pointer; margin-bottom: 16px; box-shadow: 0 4px 14px rgba(255,255,255,0.15);
      position: relative; z-index: 10; pointer-events: auto;
    }

    .movie-actions-row { display: flex; justify-content: flex-start; gap: 36px; margin-bottom: 18px; position: relative; z-index: 10; pointer-events: auto; }
    .movie-action-ico-btn {
      background: none; border: none; color: var(--text-gray);
      display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 500; cursor: pointer;
    }
    .movie-action-ico-circle {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center; color: #fff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .movie-action-ico-btn.active-list .movie-action-ico-circle,
    .movie-action-ico-btn.liked .movie-action-ico-circle {
      background: rgba(124, 58, 237, 0.3); border-color: var(--accent-light); color: var(--accent-light);
    }
    .movie-synopsis { font-size: 0.82rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; }
    .movie-genres-tags { font-size: 0.75rem; color: var(--accent-light); margin-bottom: 24px; font-weight: 600; }
    .movie-recommendations-area { padding: 0 0 40px 0; background: #07040d; position: relative; z-index: 5; }
    .movie-rec-title { font-size: 1.1rem; font-weight: 800; color: #fff; margin: 0 20px 14px 20px; }

    .stream-top-bar {
      position: absolute; top: 0; left: 0; right: 0; height: 65px;
      display: flex; justify-content: flex-end; align-items: center; gap: 10px;
      padding: 0 20px; background: linear-gradient(180deg, rgba(7,4,13,0.7) 0%, rgba(7,4,13,0) 100%);
      z-index: 2260; pointer-events: none;
    }
    .stream-top-btn {
      pointer-events: auto; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; width: 36px; height: 36px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; transition: transform 0.2s ease, background 0.2s ease;
    }
    .stream-top-btn:hover { background: rgba(0, 0, 0, 0.8); transform: scale(1.05); }

    .btn-close {
      position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px); color: #fff; border: 1px solid rgba(255,255,255,0.2);
      width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; cursor: pointer;
      z-index: 3100; display: flex; align-items: center; justify-content: center;
    }

    .modal-box h3 { margin-bottom: 12px; padding-right: 30px; font-size: 1.1rem; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-gray); margin-bottom: 4px; font-weight: 500; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px 12px; background: #07040d; border: 1px solid var(--border-purple);
      color: #fff; border-radius: 6px; font-size: 0.9rem; outline: none;
    }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 15px; }
    .btn-cancel { background: transparent; color: var(--text-gray); border: none; padding: 8px 12px; cursor: pointer; font-size: 0.85rem; }
    .btn-submit { background: var(--accent-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

    /* 🎴 ESTILO TARJETA FLOTANTE */
    .player-card-container {
      background: #11091e;
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      width: 90%;
      max-width: 440px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      flex-direction: column;
      z-index: 3050;
    }

    .video-frame-box {
      width: 100%;
      aspect-ratio: 16/9;
      position: relative;
      background: #000;
    }
    .video-frame-box iframe, 
    .video-frame-box .native-player-box {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      border: none;
    }

    .player-card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .player-card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
    }
    .player-card-desc {
      font-size: 0.78rem;
      color: var(--text-gray);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .player-card-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .player-card-back-btn {
      background: none;
      border: none;
      color: var(--accent-light);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 8px;
    }
    .player-card-back-btn:hover {
      color: #fff;
    }
    
    .empty-msg { font-size: 0.8rem; color: var(--text-gray); padding: 0 20px; font-style: italic; }
    :fullscreen .btn-close, :-webkit-full-screen .btn-close { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="logo" onclick="switchView('home')">NaPlus</div>
  </header>

  <!-- VISTA INICIO -->
  <div id="viewHome" class="view-section active">
    <div class="hbo-hero-slider" id="hboHeroSlider">
      <div class="hbo-slides-wrapper" id="hboSlidesWrapper"></div>
      <div class="hbo-slider-dots" id="hboSliderDots"></div>
    </div>

    <div id="mainHomeContent">
      <div id="recommendedContainer"></div>
      
      <div class="top10-section-wrapper">
        <div class="top10-header-title">
          <span class="top10-title-main">TOP 10</span>
          <span class="top10-title-sub">Películas Hoy</span>
        </div>
        <div class="top10-scroll-container" id="topMoviesScroll"></div>
      </div>

      <div class="section-title">Lo Más Reciente</div>
      <div class="horizontal-scroll" id="recentScroll"></div>

      <div id="genreRowsContainer"></div>
    </div>
  </div>

  <!-- VISTA PELÍCULAS -->
  <div id="viewMovies" class="view-section">
    <div class="section-title" style="margin-top: 10px;">Películas</div>

  <!-- VISTA BÚSQUEDA -->

        <input type="text" id="searchInput" placeholder="Buscar película..." oninput="handleSearch()" onkeydown="checkSecretCode(event)">

  <!-- VISTA MI LISTA -->
  <div id="viewList" class="view-section">

  </div>

  <!-- NAVEGACIÓN INFERIOR -->
  <nav>

      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Inicio
    </button>
    <button class="nav-item" id="navMovies" onclick="switchView('movies')">
      <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
      Películas
    </button>
    <button class="nav-item" id="navSearch" onclick="switchView('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Buscar
    </button>
    <button class="nav-item" id="navList" onclick="switchView('list')">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      Mi Lista
    </button>
  </nav>

  <!-- MODAL DETALLE PELÍCULA -->
  <div class="modal-box-movie" id="movieDetailModal">
    <div class="stream-top-bar">
      <button class="stream-top-btn" onclick="shareCurrentMovie()" title="Compartir">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      </button>
      <button class="stream-top-btn" onclick="closeModal('movieDetailModal')">✕</button>
    </div>

    <div class="movie-header-bg" id="movieHeaderBg">
      <div class="movie-header-gradient"></div>
      <div class="movie-info-container">
        <div class="movie-main-title" id="movieTitle"></div>
        <div class="movie-meta-info" id="movieMeta"></div>
        
        <button class="movie-btn-play" id="playMovieBtn" onclick="playCurrentMovie()">▶ Ver ahora</button>

        <div class="movie-actions-row">
          <button class="movie-action-ico-btn" id="movieFavBtn" onclick="toggleFavoriteFromMovieModal(event)">
            <div class="movie-action-ico-circle" id="movieFavCircle">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
            </div>
            Mi lista
          </button>
          <button class="movie-action-ico-btn" id="movieLikeBtn" onclick="toggleLikeMovie(event)">
            <div class="movie-action-ico-circle" id="movieLikeCircle">
              <svg id="movieLikeSvg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
            </div>
            Calificar
          </button>

        <div class="movie-synopsis" id="movieDesc"></div>
        <div class="movie-genres-tags" id="movieGenres"></div>

    <div class="movie-recommendations-area">

  <!-- REPRODUCTOR PELÍCULA TIPO TARJETA FLOTANTE -->
  <div class="modal-overlay" id="moviePlayerModal">

  <!-- MODAL SUBIR / EDITAR -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('uploadModal')">✕</button>
      <h3 id="formTitle">Subir Película</h3>
      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <input type="hidden" id="typeInput" value="movie">
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Nombre de la película">
        </div>
        <div class="form-group">
          <label>Clasificación por Edad</label>
          <select id="ageRatingInput">
            <option value="Todos">Todos</option>
            <option value="+13">+13</option>
            <option value="+16">+16</option>
            <option value="+18" selected>+18</option>
          </select>
        </div>
        <div class="form-group">
          <label>Géneros (separados por coma)</label>
          <input type="text" id="genreInput" required placeholder="Acción, Terror, Animación">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required value="2026">
        </div>
        <div class="form-group">
          <label>Sinopsis</label>
          <textarea id="descInput" rows="2" placeholder="Resumen general..."></textarea>
        </div>
        <div class="form-group">
          <label>URL de Portada</label>
          <input type="text" id="coverInput" required placeholder="https://...">
        </div>

        <div class="form-group" id="movieVideoGroup">
          <label>Enlace de Video (Telegram, Archive.org, Iframe, MP4 directo, etc.)</label>
          <input type="text" id="videoInput" placeholder="https://..." required>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 15px; background: rgba(124, 58, 237, 0.15); padding: 10px; border-radius: 6px; border: 1px solid var(--border-purple);">
          <input type="checkbox" id="featuredInput" style="width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent-purple);">
          <label for="featuredInput" style="margin-bottom: 0; font-size: 0.85rem; cursor: pointer; color: #fff;">⭐ Destacar en el Carrusel Principal</label>
        </div>

        <div class="form-actions" style="margin-top: 15px;">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Script de Video.js -->
  <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const DB_FILE_PATH = "database.json";

    let catalog = [];

    const localDb = JSON.parse(localStorage.getItem('naPlus_permanent_db'));
    if (Array.isArray(localDb) && localDb.length > 0) {
      catalog = localDb;
    }

    let movieLikes = JSON.parse(localStorage.getItem('naPlus_movie_likes')) || [];

    function preloadAllImages() {}

    let sessionRecommendedPool = [];
    function computeSessionRecommendations() {
      const moviesOnly = catalog.filter(i => i.type === 'movie');
      if (moviesOnly.length === 0) {
        sessionRecommendedPool = [];
        return;
      }
      let targetItems = [...moviesOnly].sort(() => 0.5 - Math.random());
      sessionRecommendedPool = targetItems;
    }
    computeSessionRecommendations();
    preloadAllImages();

    async function autoSyncCatalogFromCloud() {
      try {
        const rawUrl = `https://raw.githubusercontent.com/${REPO}/main/${DB_FILE_PATH}?_t=` + Date.now();
        const res = await fetch(rawUrl, { cache: 'no-store' });
        if (res.ok) {
          const cloudCatalog = await res.json();
          if (Array.isArray(cloudCatalog)) {
            catalog = cloudCatalog;
            localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
            computeSessionRecommendations();
            preloadAllImages();
            renderHomeSections();
            if (document.getElementById('viewMovies').classList.contains('active')) renderMoviesGrid();
            if (document.getElementById('viewList').classList.contains('active')) renderMyList();
            return;
          }
        }
      } catch (e) {
        console.log("No se pudo sincronizar automáticamente con la nube, usando almacenamiento local.");
      }
    }

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = localStorage.getItem('naPlus_is_creator_active') === 'true';

    if (isCreatorMode) {
      document.body.classList.add('creator-mode');
    }

    const NO_COVER_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='#1a1528'/><text x='50%' y='50%' fill='#94a3b8' font-size='14' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>Sin portada</text></svg>"
    );

    function handleImgError(img) {
      const tries = parseInt(img.dataset.retries || '0', 10);
      if (tries < 2 && img.dataset.orig) {
        img.dataset.retries = String(tries + 1);
        setTimeout(() => { img.src = img.dataset.orig; }, 300 * (tries + 1));
      } else {
        img.onerror = null;
        img.src = NO_COVER_SVG;
      }
    }

    let activeModalStack = [];

    function pushModalState(modalId) {
      if (!activeModalStack.includes(modalId)) {
        activeModalStack.push(modalId);
        history.pushState({ modalOpen: modalId }, '', location.href);
      }
    }

    window.addEventListener('popstate', () => {
      if (activeModalStack.length > 0) {
        const topModal = activeModalStack.pop();
        const el = document.getElementById(topModal);
        if (el) el.style.display = 'none';
        if (topModal === 'moviePlayerModal') {
          closeMoviePlayerModal();
        }
        return;
      }
      history.pushState(null, '', location.href);
    });

    history.pushState(null, '', location.href);

    function switchView(viewName) {
      activeModalStack = [];
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (viewName === 'home') {
        document.getElementById('viewHome').classList.add('active');
        document.getElementById('navHome').classList.add('active');
        renderHomeSections();
      } else if (viewName === 'movies') {
        document.getElementById('viewMovies').classList.add('active');
        document.getElementById('navMovies').classList.add('active');
        renderMoviesGrid();
      } else if (viewName === 'search') {
        document.getElementById('viewSearch').classList.add('active');
        document.getElementById('navSearch').classList.add('active');
        setTimeout(() => {
          const sInput = document.getElementById('searchInput');
          if (sInput) sInput.focus();
        }, 100);
      } else if (viewName === 'list') {
        document.getElementById('viewList').classList.add('active');
        document.getElementById('navList').classList.add('active');
        renderMyList();
      }
      window.scrollTo(0, 0);
    }

    function clearSearchInput() {
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.value = '';
        handleSearch();
        searchInput.focus();
      }
    }

    function toggleFavorite(id, e) {
      if (e) e.stopPropagation();
      
      const btn = e ? e.currentTarget : null;
      if (btn) {
        btn.classList.add('anim-pop');
        setTimeout(() => btn.classList.remove('anim-pop'), 400);
      }

      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderHeroSlider();
      renderHomeSections();
      renderMoviesGrid();
      renderMyList();
      if (currentMovieData && currentMovieData.id === id) updateMovieModalFavoriteState();
    }

    function toggleLikeMovie(e) {
      if (e) e.stopPropagation();
      if (!currentMovieData) return;
      const id = currentMovieData.id;

      const circle = document.getElementById('movieLikeCircle');
      if (circle) {
        circle.classList.add('anim-heart');
        setTimeout(() => circle.classList.remove('anim-heart'), 500);
      }

      if (movieLikes.includes(id)) {
        movieLikes = movieLikes.filter(lId => lId !== id);
      } else {
        movieLikes.push(id);
      }
      localStorage.setItem('naPlus_movie_likes', JSON.stringify(movieLikes));
      updateMovieLikeState();
      computeSessionRecommendations();
      renderHomeRecommendations();
    }

    function updateMovieLikeState() {
      if (!currentMovieData) return;
      const isLiked = movieLikes.includes(currentMovieData.id);
      const btn = document.getElementById('movieLikeBtn');
      const circle = document.getElementById('movieLikeCircle');
      const svgBox = document.getElementById('movieLikeSvg');

      if (isLiked) {
        btn.classList.add('liked');
        circle.style.borderColor = 'var(--accent-light)';
        circle.style.background = 'rgba(124, 58, 237, 0.3)';
        circle.style.color = 'var(--accent-light)';
        svgBox.outerHTML = `<svg id="movieLikeSvg" viewBox="0 0 24 24" width="18" height="18" fill="var(--accent-light)" stroke="var(--accent-light)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>`;
      } else {
        btn.classList.remove('liked');
        circle.style.borderColor = 'rgba(255,255,255,0.15)';
        circle.style.background = 'rgba(255,255,255,0.08)';
        circle.style.color = '#fff';
        svgBox.outerHTML = `<svg id="movieLikeSvg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>`;
      }
    }

    function updateMovieModalFavoriteState() {
      if (!currentMovieData) return;
      const isFav = myFavorites.includes(currentMovieData.id);
      const btn = document.getElementById('movieFavBtn');
      const circle = document.getElementById('movieFavCircle');
      if (isFav) {
        btn.classList.add('active-list');
        circle.style.borderColor = 'var(--accent-light)';
        circle.style.background = 'rgba(124, 58, 237, 0.3)';
        circle.style.color = 'var(--accent-light)';
        circle.classList.add('anim-pop');
        setTimeout(() => circle.classList.remove('anim-pop'), 400);
      } else {
        btn.classList.remove('active-list');
        circle.style.borderColor = 'rgba(255,255,255,0.15)';
        circle.style.background = 'rgba(255,255,255,0.08)';
        circle.style.color = '#fff';
      }
    }

    function toggleFavoriteFromMovieModal(e) {
      if (!currentMovieData) return;
      toggleFavorite(currentMovieData.id, e);
      updateMovieModalFavoriteState();
    }

    let currentSlide = 0;
    let sliderInterval = null;

    function renderHeroSlider() {
      const wrapper = document.getElementById('hboSlidesWrapper');
      const dotsContainer = document.getElementById('hboSliderDots');
      
      const moviesOnly = catalog.filter(item => item.type === 'movie');
      let displayItems = moviesOnly.filter(item => item.featured);
      if (displayItems.length === 0) {
        displayItems = [...moviesOnly].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).slice(0, 6);
      } else {
        displayItems = displayItems.slice(0, 6);
      }

      if (displayItems.length === 0) {
        wrapper.innerHTML = '';
        dotsContainer.innerHTML = '';
        return;
      }

      wrapper.innerHTML = '';
      dotsContainer.innerHTML = '';

      displayItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'hbo-slide';
        slide.style.backgroundImage = `url('${item.cover}')`;
        slide.onclick = () => openContentDetail(item.id);

        const isFav = myFavorites.includes(item.id);
        const genreText = item.genre ? item.genre.split(',')[0] : '';
        
        slide.innerHTML = `
          <div class="hbo-slide-overlay"></div>
          <div class="hbo-slide-content">
            <div class="hbo-slide-title">${item.title}</div>
            <div class="hbo-slide-meta">${item.year} • ${genreText}</div>
            <div class="hbo-slide-btns">
              <button class="hbo-btn-play" onclick="event.stopPropagation(); openContentDetail(${item.id})">▶ Reproducir</button>
              <button class="hbo-btn-add ${isFav ? 'saved anim-pop' : ''}" onclick="toggleFavorite(${item.id}, event)" title="${isFav ? 'Quitar' : 'Guardar'}">
                <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </button>
            </div>
          </div>
        `;
        wrapper.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `hbo-dot ${idx === 0 ? 'active' : ''}`;
        dotsContainer.appendChild(dot);
      });

      if (sliderInterval) clearInterval(sliderInterval);
      currentSlide = 0;
      sliderInterval = setInterval(() => {
        currentSlide = (currentSlide + 1) % displayItems.length;
        goToSlide(currentSlide);
      }, 4500);
    }

    function goToSlide(idx) {
      currentSlide = idx;
      const wrapper = document.getElementById('hboSlidesWrapper');
      const dots = document.querySelectorAll('.hbo-dot');
      if (wrapper) wrapper.style.transform = `translateX(-${idx * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    function getCleanTop10Svg(rank) {
      return `
        <svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" class="top10-number-svg">
          <style>
            .num-text {
              font-family: system-ui, -apple-system, sans-serif;
              font-weight: 900;
              font-size: 100px;
              fill: #07040d;
              stroke: rgba(255, 255, 255, 0.9);
              stroke-width: 3.5px;
              paint-order: stroke fill;
            }
          </style>
          <text x="50%" y="112" text-anchor="middle" class="num-text">${rank}</text>
        </svg>
      `;
    }

    function renderTop10Element(item, rank) {
      const div = document.createElement('div');
      div.className = 'top10-item-card';
      div.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);

      div.innerHTML = `
        ${getCleanTop10Svg(rank)}
        <div class="top10-poster-box">
          <button class="top10-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="Guardar">
            <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
          </button>
          <img src="${item.cover}" data-orig="${item.cover}" alt="Poster" loading="lazy" decoding="async" onerror="handleImgError(this)">
        </div>
      `;
      return div;
    }

    function renderHomeSections() {
      renderHeroSlider();
      computeSessionRecommendations();
      renderHomeRecommendations();

      const moviesOnly = catalog.filter(i => i.type === 'movie');

      const topMoviesScroll = document.getElementById('topMoviesScroll');
      topMoviesScroll.innerHTML = '';
      moviesOnly.sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach((item, idx) => topMoviesScroll.appendChild(renderTop10Element(item, idx + 1)));

      const recentScroll = document.getElementById('recentScroll');
      recentScroll.innerHTML = '';
      [...moviesOnly].sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)).forEach(item => recentScroll.appendChild(createCardElement(item)));

      const genreContainer = document.getElementById('genreRowsContainer');
      genreContainer.innerHTML = '';
      let allIndividualGenres = [];
      moviesOnly.forEach(item => {
        if (item.genre) item.genre.split(',').forEach(g => { if (g.trim() && !allIndividualGenres.includes(g.trim())) allIndividualGenres.push(g.trim()); });
      });
      allIndividualGenres.sort();

      allIndividualGenres.forEach(genre => {
        const genreItems = moviesOnly.filter(i => i.genre && i.genre.split(',').map(x => x.trim().toLowerCase()).includes(genre.toLowerCase()));
        if (genreItems.length > 0) {
          const titleDiv = document.createElement('div'); titleDiv.className = 'section-title'; titleDiv.innerText = genre;
          const scrollDiv = document.createElement('div'); scrollDiv.className = 'horizontal-scroll';
          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));
          genreContainer.appendChild(titleDiv); genreContainer.appendChild(scrollDiv);
        }
      });
    }

    function renderHomeRecommendations() {
      const recContainer = document.getElementById('recommendedContainer');
      recContainer.innerHTML = '';
      if (sessionRecommendedPool.length === 0) return;
      const titleDiv = document.createElement('div'); titleDiv.className = 'section-title'; titleDiv.innerText = "Recomendado";
      const scrollDiv = document.createElement('div'); scrollDiv.className = 'horizontal-scroll';
      sessionRecommendedPool.forEach(item => scrollDiv.appendChild(createCardElement(item)));
      recContainer.appendChild(titleDiv); recContainer.appendChild(scrollDiv);
    }

    function checkSecretCode(e) {
      if (e.key === 'Enter') {
        const val = document.getElementById('searchInput').value.trim();
        if (val === "9009") {
          e.preventDefault();
          document.getElementById('searchInput').value = '';
          isCreatorMode = !isCreatorMode;
          localStorage.setItem('naPlus_is_creator_active', isCreatorMode ? 'true' : 'false');
          document.body.classList.toggle('creator-mode', isCreatorMode);
          if (isCreatorMode) openUploadModal();
        }
      }
    }

    function handleSearch() {
      const searchInput = document.getElementById('searchInput');
      const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
      const clearBtn = document.getElementById('clearSearchBtn');
      if (clearBtn) clearBtn.style.display = query.length > 0 ? 'block' : 'none';

      const searchGrid = document.getElementById('searchGrid');
      searchGrid.innerHTML = '';

      if (query.length === 0) {
        searchGrid.innerHTML = '<div class="empty-msg">Escribe algo para comenzar la búsqueda.</div>';
        return;
      }

      const moviesOnly = catalog.filter(i => i.type === 'movie');
      const matches = moviesOnly.filter(i => i.title.toLowerCase().includes(query) || (i.genre && i.genre.toLowerCase().includes(query)));
      if (matches.length > 0) {
        matches.forEach(item => searchGrid.appendChild(createCardElement(item)));
      } else {
        searchGrid.innerHTML = '<div class="empty-msg">No se encontraron resultados.</div>';
      }
    }

    function renderMoviesGrid() {
      const movies = catalog.filter(i => i.type === 'movie');
      const topScroll = document.getElementById('moviesTopScroll');
      topScroll.innerHTML = '';
      [...movies].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10).forEach((item, idx) => topScroll.appendChild(renderTop10Element(item, idx + 1)));

      const genreRowsContainer = document.getElementById('moviesGenreRowsContainer');
      genreRowsContainer.innerHTML = '';
      let movieGenres = [];
      movies.forEach(item => {
        if (item.genre) item.genre.split(',').forEach(g => { if (g.trim() && !movieGenres.includes(g.trim())) movieGenres.push(g.trim()); });
      });
      movieGenres.sort();

      movieGenres.forEach(genre => {
        const genreItems = movies.filter(i => i.genre && i.genre.split(',').map(x => x.trim().toLowerCase()).includes(genre.toLowerCase()));
        if (genreItems.length > 0) {
          const titleDiv = document.createElement('div'); titleDiv.className = 'section-title'; titleDiv.innerText = genre;
          const scrollDiv = document.createElement('div'); scrollDiv.className = 'horizontal-scroll';
          genreItems.forEach(item => scrollDiv.appendChild(createCardElement(item)));
          genreRowsContainer.appendChild(titleDiv); genreRowsContainer.appendChild(scrollDiv);
        }
      });

      const grid = document.getElementById('moviesGrid');
      grid.innerHTML = '';
      movies.forEach(item => grid.appendChild(createCardElement(item)));
    }

    function renderMyList() {
      const grid = document.getElementById('myListGrid');
      grid.innerHTML = '';
      catalog.filter(i => i.type === 'movie' && myFavorites.includes(i.id)).forEach(item => grid.appendChild(createCardElement(item)));
      if (grid.children.length === 0) grid.innerHTML = '<div class="empty-msg">No tenés películas guardadas.</div>';
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);

      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="Guardar">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})" title="Editar">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem(${item.id})" title="Eliminar">🗑️</button>
        </div>
        <img src="${item.cover}" data-orig="${item.cover}" alt="Portada" loading="lazy" decoding="async" onerror="handleImgError(this)">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.year}</div>
        </div>
      `;
      return card;
    }

    function createLargeCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openContentDetail(item.id);
      const isFav = myFavorites.includes(item.id);

      card.innerHTML = `
        <button class="card-fav-btn ${isFav ? 'saved' : ''}" onclick="toggleFavorite(${item.id}, event)" title="Guardar">
          <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </button>
        <img src="${item.cover}" data-orig="${item.cover}" alt="Portada" loading="lazy" decoding="async" onerror="handleImgError(this)">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.year}</div>
        </div>
      `;
      return card;
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Película' : 'Subir Película';
      document.getElementById('typeInput').value = 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('ageRatingInput').value = item && item.ageRating ? item.ageRating : '+18';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item && item.video ? item.video : '';
      document.getElementById('featuredInput').checked = item && item.featured === true;

      pushModalState('uploadModal');
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta película del catálogo?")) {
        catalog = catalog.filter(x => x.id != id);
        localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
        renderHomeSections();
        renderMoviesGrid();
        renderMyList();
        await publishToGitHubAutomatically();
      }
    }

    function utoa(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(match, p1) {
        return String.fromCharCode('0x' + p1);
      }));
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;

      let token = localStorage.getItem('naPlus_gh_token');
      if (!token || !token.trim()) {
        token = prompt("Introduce tu token de GitHub (ghp_... o github_pat_...):");
        if (token && token.trim()) {
          localStorage.setItem('naPlus_gh_token', token.trim());
        } else {
          alert("⚠️ Se necesita un token válido de GitHub para publicar.");
          return;
        }
      }

      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: 'movie',
        title: document.getElementById('titleInput').value.trim(),
        ageRating: document.getElementById('ageRatingInput').value,
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim(),
        seasons: [],
        featured: document.getElementById('featuredInput').checked,
        views: id ? (catalog.find(x => x.id == id)?.views || 0) : Math.floor(Math.random() * 500) + 50,
        dateAdded: id ? (catalog.find(x => x.id == id)?.dateAdded || Date.now()) : Date.now()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));
      preloadAllImages();
      renderHomeSections();
      renderMoviesGrid();
      renderMyList();
      closeModal('uploadModal');

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Publicando en database.json...";

      const success = await publishToGitHubAutomatically();
      if (saveBtn) saveBtn.innerText = "Guardar y Publicar";

      if (success) {
        alert("¡Guardado y sincronizado perfectamente en database.json!");
      }
    }

    async function publishToGitHubAutomatically() {
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) return false;

      try {
        const catalogJson = JSON.stringify(catalog, null, 2);

        let dbSha = null;
        const getDbRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${DB_FILE_PATH}?_t=` + Date.now(), {
          headers: { 
            'Authorization': 'Bearer ' + token.trim(), 
            'Accept': 'application/vnd.github+json',
            'Cache-Control': 'no-cache'
          }
        });
        
        if (getDbRes.ok) {
          const dbData = await getDbRes.json();
          dbSha = dbData.sha;
        } else if (getDbRes.status !== 404) {
          const errJson = await getDbRes.json().catch(() => ({}));
          alert("Error de GitHub: " + (errJson.message || getDbRes.statusText));
          localStorage.removeItem('naPlus_gh_token');
          return false;
        }

        const putDbRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${DB_FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token.trim(),
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github+json'
          },
          body: JSON.stringify({
            message: 'Actualización automática de database.json (NaPlus)',
            content: utoa(catalogJson),
            sha: dbSha
          })
        });

        if (!putDbRes.ok) {
          const putErr = await putDbRes.json().catch(() => ({}));
          alert("Error al guardar en GitHub: " + (putErr.message || putDbRes.statusText));
          localStorage.removeItem('naPlus_gh_token');
          return false;
        }

        return true;
      } catch (err) {
        console.error("Excepción con GitHub:", err);
        alert("Error de red: " + err.message);
        return false;
      }
    }

    let currentMovieData = null;

    function openContentDetail(id) {
      const item = catalog.find(x => x.id == id);
      if (!item || item.type !== 'movie') return;

      item.views = (item.views || 0) + 1;
      localStorage.setItem('naPlus_permanent_db', JSON.stringify(catalog));

      currentMovieData = item;
      document.getElementById('movieHeaderBg').style.backgroundImage = `url('${item.cover}')`;
      document.getElementById('movieTitle').innerText = item.title;
      document.getElementById('movieMeta').innerText = `${item.ageRating || '+18'} • ${item.year}`;
      document.getElementById('movieDesc').innerText = item.desc || 'Sin descripción.';
      document.getElementById('movieGenres').innerText = item.genre || '';
      
      updateMovieModalFavoriteState();
      updateMovieLikeState();

      const recScroll = document.getElementById('movieRecommendationsScroll');
      recScroll.innerHTML = '';
      const otherMovies = catalog.filter(m => m.type === 'movie' && m.id !== item.id).sort(() => 0.5 - Math.random());
      otherMovies.forEach(m => recScroll.appendChild(createLargeCardElement(m)));

      document.getElementById('movieDetailModal').scrollTop = 0;
      pushModalState('movieDetailModal');
      document.getElementById('movieDetailModal').style.display = 'block';
    }

    function playCurrentMovie() {
      if (!currentMovieData) return;
      document.getElementById('playerMovieTitle').innerText = currentMovieData.title;
      document.getElementById('playerMovieDesc').innerText = currentMovieData.desc || 'Sin descripción.';
      
      const modal = document.getElementById('moviePlayerModal');
      renderVideoInBox(document.getElementById('fullscreenMovieVideoBox'), currentMovieData.video);
      pushModalState('moviePlayerModal');
      modal.style.display = 'flex';
    }

    function closeMoviePlayerModal() {
      const existingVideo = videojs.getPlayer('naplus-vlc-player');
      if (existingVideo) {
        existingVideo.dispose();
      }
      document.getElementById('fullscreenMovieVideoBox').innerHTML = '';
      document.getElementById('moviePlayerModal').style.display = 'none';
    }

    function shareCurrentMovie() {
      if (navigator.share && currentMovieData) navigator.share({ title: currentMovieData.title, url: window.location.href }).catch(() => {});
      else alert("Enlace copiado.");
    }

    /* REPRODUCTOR MULTIPLATAFORMA ROBUSTO */
    function renderVideoInBox(vBox, vInput) {
      if (!vInput) {
        vBox.innerHTML = '<div class="empty-msg">Enlace no disponible.</div>';
        return;
      }
      
      vBox.innerHTML = '';
      let cleanUrl = vInput.trim();

      if (cleanUrl.includes('<iframe')) {
        vBox.innerHTML = cleanUrl;
        const iframeEl = vBox.querySelector('iframe');
        if (iframeEl) {
          iframeEl.style.width = '100%';
          iframeEl.style.height = '100%';
          iframeEl.style.position = 'absolute';
          iframeEl.style.top = '0';
          iframeEl.style.left = '0';
          iframeEl.style.border = 'none';
          iframeEl.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock');
          iframeEl.setAttribute('allowfullscreen', 'true');
          iframeEl.setAttribute('referrerpolicy', 'unsafe-url');
        }
        return;
      }

      if (cleanUrl.includes('t.me/')) {
        let tgPath = '';
        if (cleanUrl.includes('t.me/c/')) {
          const parts = cleanUrl.split('t.me/c/');
          if (parts[1]) tgPath = parts[1].split('?')[0];
        } else if (cleanUrl.includes('t.me/')) {
          const parts = cleanUrl.split('t.me/');
          if (parts[1]) tgPath = parts[1].split('?')[0];
        }

        if (tgPath) {
          const container = document.createElement('div');
          container.style.cssText = "width:100%; height:100%; position:absolute; top:0; left:0; overflow-y:auto; background:#000; display:flex; align-items:center; justify-content:center;";
          
          const script = document.createElement('script');
          script.async = true;
          script.src = "https://telegram.org/js/telegram-widget.js?22";
          script.setAttribute('data-telegram-post', tgPath);
          script.setAttribute('data-width', '100%');
          
          container.appendChild(script);
          vBox.appendChild(container);
          return;
        }
      }

      if (cleanUrl.includes('archive.org/details/')) {
        try {
          const identifier = cleanUrl.split('/details/')[1].split('/')[0].split('?')[0];
          cleanUrl = `https://archive.org/download/${identifier}/${identifier}.mp4`;
        } catch (e) {
          console.log("No se pudo parsear el link de Archive automáticamente.");
        }
      }

      if (cleanUrl.includes('vimeo.com')) {
        let vimeoEmbed = cleanUrl;
        if (!vimeoEmbed.includes('/player.vimeo.com/video/')) {
          const vimeoMatch = vimeoEmbed.match(/vimeo\.com\/([0-9]+)/);
          if (vimeoMatch && vimeoMatch[1]) {
            vimeoEmbed = `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&title=0&byline=0&portrait=0`;
          }
        }
        vBox.innerHTML = `<iframe src="${vimeoEmbed}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;border:none;"></iframe>`;
        return;
      }

      if (cleanUrl.includes('vk.com') || cleanUrl.includes('vkvideo.ru')) {
        let vkEmbed = cleanUrl;
        if (!vkEmbed.includes('/video_ext.php')) {
          vkEmbed = vkEmbed.replace('vk.com/video', 'vk.com/video_ext.php?');
        }
        vBox.innerHTML = `<iframe src="${vkEmbed}" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;border:none;"></iframe>`;
        return;
      }

      if (cleanUrl.includes('ok.ru')) {
        let okEmbed = cleanUrl;
        if (!okEmbed.includes('/videoembed/')) {
          okEmbed = okEmbed.replace('/video/', '/videoembed/');
        }
        vBox.innerHTML = `<iframe src="${okEmbed}" frameborder="0" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;border:none;"></iframe>`;
        return;
      }

      if (cleanUrl.includes('odysee.com')) {
        let odyseeEmbed = cleanUrl;
        if (!odyseeEmbed.includes('/$/embed/')) {
          odyseeEmbed = odyseeEmbed.replace('odysee.com/', 'odysee.com/$/embed/');
        }
        vBox.innerHTML = `<iframe src="${odyseeEmbed}" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen style="width:100%;height:100%;position:absolute;top:0;left:0;border:none;"></iframe>`;
        return;
      }

      const playerWrapper = document.createElement('div');
      playerWrapper.className = 'native-player-box';

      playerWrapper.innerHTML = `
        <video-js id="naplus-vlc-player" class="vjs-big-play-centered vjs-fluid" controls preload="auto">
          <source src="${cleanUrl}" />
          <p class="vjs-no-js">
            Para ver este video, por favor habilita JavaScript y considera actualizar a un navegador que soporte video HTML5.
          </p>
        </video-js>
      `;
      vBox.appendChild(playerWrapper);

      try {
        const player = videojs('naplus-vlc-player');
        player.ready(() => {
          player.play().catch(err => console.log("Autoplay prevenido por el navegador:", err));
        });
      } catch (e) {
        console.error("Error al inicializar Video.js:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const playMovieBtn = document.getElementById('playMovieBtn');
      if (playMovieBtn) {
        playMovieBtn.addEventListener('click', (e) => { e.stopPropagation(); playCurrentMovie(); });
        playMovieBtn.addEventListener('touchend', (e) => { e.stopPropagation(); playCurrentMovie(); });
      }
    });

    autoSyncCatalogFromCloud();
    renderHomeSections();
  </script>
