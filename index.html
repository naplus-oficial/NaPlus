<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaPlus - Streaming</title>
  <style>
    :root {
      --bg-dark: #0a0612;
      --card-bg: #140d24;
      --accent-purple: #7c3aed;
      --accent-light: #c084fc;
      --text-white: #f8fafc;
      --text-gray: #94a3b8;
      --border-purple: rgba(124, 58, 237, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      padding-top: 65px;
      padding-bottom: 50px;
    }

    /* BARRA SUPERIOR */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 60px;
      padding: 0 15px;
      background: rgba(10, 6, 18, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid var(--border-purple);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-creator {
      background: linear-gradient(135deg, var(--accent-purple), #6d28d9);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* HERO & BUSCADOR */
    .hero {
      padding: 20px 15px;
      background: linear-gradient(180deg, #140d24 0%, #0a0612 100%);
      margin-bottom: 10px;
    }

    .hero h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .hero p {
      font-size: 0.85rem;
      color: var(--text-gray);
      margin-bottom: 12px;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(10, 6, 18, 0.8);
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-light);
    }

    /* SECCIONES Y GRILLAS */
    .section-title {
      font-size: 1.2rem;
      margin: 20px 15px 10px;
      color: var(--accent-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent-purple);
      border-radius: 2px;
    }

    .empty-msg {
      font-size: 0.85rem;
      color: var(--text-gray);
      padding: 0 15px;
      font-style: italic;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
      padding: 0 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-purple);
      cursor: pointer;
      position: relative;
    }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: #000;
      pointer-events: none;
    }

    .card-info {
      padding: 8px;
      pointer-events: none;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--text-gray);
    }

    .card-fav-btn {
      position: absolute;
      top: 5px; left: 5px;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border-purple);
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .admin-btns {
      display: none;
      position: absolute;
      top: 5px; right: 5px;
      gap: 4px;
      z-index: 10;
    }

    body.creator-mode .admin-btns {
      display: flex;
    }

    .admin-btns button {
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--accent-purple);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* MODALES FLOTANTES SEGUROS */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      border: 1px solid var(--border-purple);
      position: relative;
    }

    .btn-close {
      position: absolute;
      top: 12px; right: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: none;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .modal-box h3 {
      margin-bottom: 12px;
      padding-right: 30px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-gray);
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: #0a0612;
      border: 1px solid var(--border-purple);
      color: #fff;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-gray);
      border: none;
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn-submit {
      background: var(--accent-purple);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* REPRODUCTOR */
    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-box video, .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btn-telegram {
      background: #0088cc;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="logo">NaPlus</div>
    <button class="btn-creator" id="btnCreator" onclick="handleCreatorClick()">Modo Creador</button>
  </header>

  <div class="hero">
    <h1>NaPlus Streaming</h1>
    <p>Películas y series en alta definición.</p>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar película o serie..." oninput="handleSearch()">
    </div>
  </div>

  <!-- MI LISTA (FAVORITOS) -->
  <div id="myListContainer" style="display: none;">
    <div class="section-title">Mi Lista - Películas</div>
    <div class="grid" id="myListMoviesGrid"></div>
    <div class="section-title">Mi Lista - Series</div>
    <div class="grid" id="myListSeriesGrid"></div>
    <hr style="border: 0; border-top: 1px solid var(--border-purple); margin: 25px 15px 10px 15px;">
  </div>

  <!-- CATÁLOGO GENERAL -->
  <div class="section-title">Películas</div>
  <div class="grid" id="moviesGrid"></div>

  <div class="section-title">Series</div>
  <div class="grid" id="seriesGrid"></div>

  <!-- MODAL REPRODUCTOR / DETALLE -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('detailModal')">✕</button>
      <div class="video-box" id="videoBox"></div>
      <h3 id="detailTitle"></h3>
      <p id="detailMeta" style="color:var(--accent-light); font-size:0.85rem; margin-bottom:8px;"></p>
      <p id="detailDesc" style="color:var(--text-gray); font-size:0.85rem; margin-bottom:15px;"></p>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('detailModal')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ACCESO CREADOR -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('loginModal')">✕</button>
      <h3>Acceso Creador</h3>
      <form onsubmit="submitLogin(event)">
        <div class="form-group">
          <label>Ingresá la clave (9009) o tu Token de GitHub</label>
          <input type="password" id="passInput" placeholder="Clave o Token..." required autocomplete="off">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('loginModal')">Cancelar</button>
          <button type="submit" class="btn-submit">Entrar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL FORMULARIO SUBIR / EDITAR -->
  <div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
      <button class="btn-close" onclick="closeModal('uploadModal')">✕</button>
      <h3 id="formTitle">Subir Contenido</h3>
      <form onsubmit="submitContent(event)">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Tipo de Contenido</label>
          <select id="typeInput">
            <option value="movie">Película</option>
            <option value="series">Serie</option>
          </select>
        </div>
        <div class="form-group">
          <label>Título</label>
          <input type="text" id="titleInput" required placeholder="Nombre de la obra">
        </div>
        <div class="form-group">
          <label>Género</label>
          <input type="text" id="genreInput" required placeholder="Acción, Terror, Comedia">
        </div>
        <div class="form-group">
          <label>Año</label>
          <input type="number" id="yearInput" required placeholder="2026">
        </div>
        <div class="form-group">
          <label>Sinopsis / Descripción</label>
          <textarea id="descInput" rows="2" placeholder="Resumen del contenido..."></textarea>
        </div>
        <div class="form-group">
          <label>URL de Imagen de Portada</label>
          <input type="url" id="coverInput" required placeholder="https://ejemplo.com/imagen.jpg">
        </div>
        <div class="form-group">
          <label>URL del Video (MP4, YouTube, Telegram...)</label>
          <input type="url" id="videoInput" required placeholder="https://...">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" onclick="closeModal('uploadModal')">Cancelar</button>
          <button type="submit" class="btn-submit" id="saveBtn">Guardar y Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const REPO = "ignacio12adrian-ux/NaPlus";
    const FILE_PATH = "index.html";

    /* BASE DE DATOS PÚBLICA DEL CATÁLOGO */
    let catalog = [
      {
        id: 1,
        type: 'movie',
        title: 'Mi Primera Película',
        genre: 'Aventura',
        year: '2026',
        desc: 'Bienvenido a NaPlus.',
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400',
        video: 'https://www.w3schools.com/html/mov_bbb.mp4'
      }
    ];

    let myFavorites = JSON.parse(localStorage.getItem('naPlus_my_list')) || [];
    let isCreatorMode = false;

    // Alternar Favorito (Mi Lista)
    function toggleFavorite(id, e) {
      e.stopPropagation();
      if (myFavorites.includes(id)) {
        myFavorites = myFavorites.filter(favId => favId !== id);
      } else {
        myFavorites.push(id);
      }
      localStorage.setItem('naPlus_my_list', JSON.stringify(myFavorites));
      renderCatalog(document.getElementById('searchInput').value);
    }

    // Renderizar tarjetas de forma segura
    function renderCatalog(filterText = '') {
      const mGrid = document.getElementById('moviesGrid');
      const sGrid = document.getElementById('seriesGrid');
      const myListContainer = document.getElementById('myListContainer');
      const myListMGrid = document.getElementById('myListMoviesGrid');
      const myListSGrid = document.getElementById('myListSeriesGrid');

      if (!mGrid || !sGrid) return;

      mGrid.innerHTML = '';
      sGrid.innerHTML = '';
      myListMGrid.innerHTML = '';
      myListSGrid.innerHTML = '';

      const query = filterText.toLowerCase().trim();
      const filtered = catalog.filter(item => 
        item.title.toLowerCase().includes(query) || 
        item.genre.toLowerCase().includes(query)
      );

      // Render Catálogo General
      filtered.forEach(item => {
        const card = createCardElement(item);
        if (item.type === 'movie') mGrid.appendChild(card);
        else sGrid.appendChild(card);
      });

      // Render Mi Lista (Favoritos) separada
      const favoriteItems = catalog.filter(item => myFavorites.includes(item.id));
      if (favoriteItems.length > 0 && query === '') {
        myListContainer.style.display = 'block';
        favoriteItems.forEach(item => {
          const card = createCardElement(item);
          if (item.type === 'movie') myListMGrid.appendChild(card);
          else myListSGrid.appendChild(card);
        });

        if (myListMGrid.children.length === 0) myListMGrid.innerHTML = '<div class="empty-msg">No tenés películas guardadas.</div>';
        if (myListSGrid.children.length === 0) myListSGrid.innerHTML = '<div class="empty-msg">No tenés series guardadas.</div>';
      } else {
        myListContainer.style.display = 'none';
      }
    }

    function createCardElement(item) {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openDetail(item.id);

      const isFav = myFavorites.includes(item.id);

      card.innerHTML = `
        <button class="card-fav-btn" onclick="toggleFavorite(${item.id}, event)">
          ${isFav ? '❤️' : '🔖'}
        </button>
        <div class="admin-btns">
          <button onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
          <button onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
        </div>
        <img src="${item.cover}" alt="Portada" onerror="this.src='https://via.placeholder.com/200x300?text=Sin+Portada'">
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-sub">${item.genre} • ${item.year}</div>
        </div>
      `;
      return card;
    }

    function handleSearch() {
      renderCatalog(document.getElementById('searchInput').value);
    }

    function handleCreatorClick() {
      if (isCreatorMode) {
        openUploadModal();
      } else {
        document.getElementById('passInput').value = '';
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      if (id === 'detailModal') {
        document.getElementById('videoBox').innerHTML = '';
      }
    }

    function submitLogin(e) {
      e.preventDefault();
      const val = document.getElementById('passInput').value.trim();

      if (val === "9009" || val.startsWith("ghp_")) {
        if (val.startsWith("ghp_")) {
          localStorage.setItem('naPlus_gh_token', val);
        }
        isCreatorMode = true;
        document.body.classList.add('creator-mode');
        document.getElementById('btnCreator').innerText = '+ Agregar';
        closeModal('loginModal');
        openUploadModal();
      } else {
        alert("Clave o Token incorrecto.");
      }
    }

    function openUploadModal(item = null) {
      document.getElementById('editId').value = item ? item.id : '';
      document.getElementById('formTitle').innerText = item ? 'Editar Contenido' : 'Subir Contenido';
      document.getElementById('typeInput').value = item ? item.type : 'movie';
      document.getElementById('titleInput').value = item ? item.title : '';
      document.getElementById('genreInput').value = item ? item.genre : '';
      document.getElementById('yearInput').value = item ? item.year : '2026';
      document.getElementById('descInput').value = item ? item.desc : '';
      document.getElementById('coverInput').value = item ? item.cover : '';
      document.getElementById('videoInput').value = item ? item.video : '';
      document.getElementById('uploadModal').style.display = 'flex';
    }

    function editItem(id) {
      const item = catalog.find(x => x.id == id);
      if (item) openUploadModal(item);
    }

    async function deleteItem(id) {
      if (confirm("¿Seguro que querés eliminar esta obra del catálogo global?")) {
        catalog = catalog.filter(x => x.id != id);
        renderCatalog(document.getElementById('searchInput').value);
        await publishToGitHub();
      }
    }

    async function submitContent(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const newItem = {
        id: id ? parseInt(id) : Date.now(),
        type: document.getElementById('typeInput').value,
        title: document.getElementById('titleInput').value.trim(),
        genre: document.getElementById('genreInput').value.trim(),
        year: document.getElementById('yearInput').value,
        desc: document.getElementById('descInput').value.trim(),
        cover: document.getElementById('coverInput').value.trim(),
        video: document.getElementById('videoInput').value.trim()
      };

      if (id) {
        const idx = catalog.findIndex(x => x.id == id);
        if (idx !== -1) catalog[idx] = newItem;
      } else {
        catalog.unshift(newItem);
      }

      renderCatalog(document.getElementById('searchInput').value);
      closeModal('uploadModal');
      await publishToGitHub();
    }

    // Publicación automática a GitHub
    async function publishToGitHub() {
      let token = localStorage.getItem('naPlus_gh_token');
      if (!token) {
        token = prompt("Para publicar los cambios de forma PERMANENTE para todos los espectadores, ingresá tu Token de GitHub (ghp_...):");
        if (token && token.startsWith("ghp_")) {
          token = token.trim();
          localStorage.setItem('naPlus_gh_token', token);
        } else {
          alert("Los cambios se guardaron temporalmente en tu pantalla, pero los demás usuarios no los verán sin el Token de GitHub.");
          return;
        }
      }

      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) saveBtn.innerText = "Sincronizando...";

      try {
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`);
        const getData = await getRes.json();
        const sha = getData.sha;

        let fileText = new TextDecoder().decode(Uint8Array.from(atob(getData.content), c => c.charCodeAt(0)));
        const catalogJson = JSON.stringify(catalog, null, 2);
        fileText = fileText.replace(/let catalog = \[[\s\S]*?\];/, `let catalog = ${catalogJson};`);

        const updatedBase64 = btoa(unescape(encodeURIComponent(fileText)));

        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
