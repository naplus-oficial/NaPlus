<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaPlus - Plataforma de Streaming</title>
<style>
:root{--bg-dark:#0a0612;--card-bg:#140d24;--accent:#7c3aed;--accent-light:#c084fc;--text:#f8fafc;--text-muted:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:var(--bg-dark);color:var(--text);padding-top:70px;padding-bottom:50px}
header{position:fixed;top:0;left:0;right:0;height:65px;padding:0 20px;background:rgba(10,6,18,0.95);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;z-index:100;border-bottom:1px solid rgba(124,58,237,.3)}
.logo{font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,var(--accent-light),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header-btns{display:flex;gap:10px}
.btn-creator{background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:.85rem;font-weight:bold;cursor:pointer;transition:transform 0.2s}
.btn-creator:active{transform:scale(0.95)}
.btn-exit{background:transparent;border:1px solid var(--accent);display:none}
body.creator .btn-exit{display:inline-block}

.hero{padding:25px 20px;background:linear-gradient(180deg,#140d24 0%,#0a0612 100%);margin-bottom:20px;border-bottom:1px solid rgba(255,255,255,.05)}
.hero h1{font-size:1.9rem;margin-bottom:6px}
.hero p{font-size:.9rem;color:var(--text-muted)}
.searchbar{display:flex;gap:10px;margin-top:15px}
.searchbar input{flex:1;min-width:0;padding:12px;background:#0a0612;border:1px solid var(--accent);color:#fff;border-radius:8px;font-size:1rem}
.searchbar input:focus{outline:none;box-shadow:0 0 10px rgba(124,58,237,0.5)}

.section-title{font-size:1.25rem;margin:25px 20px 12px;color:var(--accent-light)}
#listSec,#searchSec{scroll-margin-top:80px}
.empty{color:var(--text-muted);font-size:.85rem;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;padding:0 20px}
.card{background:var(--card-bg);border-radius:10px;overflow:hidden;position:relative;border:1px solid rgba(124,58,237,0.2);cursor:pointer;transition:transform 0.2s}
.card:active{transform:scale(0.97)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#0a0612}
.card-info{padding:8px}
.card-title,.card-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{font-size:.85rem;font-weight:bold}
.card-sub{font-size:.7rem;color:var(--text-muted)}

.card-save{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,0.75);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card-save.on{background:var(--accent)}
.card-admin-btns{position:absolute;top:6px;right:6px;display:none;gap:6px}
body.creator .card-admin-btns{display:flex}
.card-admin-btns button{background:rgba(0,0,0,0.8);border:none;color:#fff;font-size:.85rem;width:30px;height:30px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Ventanas Modales */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);z-index:200;padding:15px;overflow-y:auto;align-items:center;justify-content:center}
.modal-content{background:var(--card-bg);padding:25px;border-radius:16px;width:100%;max-width:520px;border:1px solid var(--accent);margin:auto;position:relative;box-shadow:0 25px 50px rgba(0,0,0,0.9)}
.modal-content h3{margin-bottom:12px;padding-right:30px;font-size:1.3rem}

.btn-close-modal{position:absolute;top:15px;right:15px;background:rgba(255,255,255,0.1);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:1.1rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center}

.hint{color:var(--text-muted);font-size:.85rem;margin-bottom:15px;line-height:1.4}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.8rem;margin-bottom:5px;color:var(--text-muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;background:#0a0612;border:1px solid var(--accent);color:#fff;border-radius:8px;font-size:1rem}

.form-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;width:100%}
.btn-sec{background:rgba(255,255,255,0.08);color:var(--text);border:1px solid rgba(255,255,255,0.1);padding:10px 18px;border-radius:8px;cursor:pointer;font-size:.9rem;font-weight:600}
.btn-pri{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer}

/* Reproductor Premium Estético */
.video-container{width:100%;aspect-ratio:16/9;background:#000;margin-bottom:15px;border-radius:12px;overflow:hidden;position:relative;box-shadow:0 8px 25px rgba(0,0,0,0.7);border:1px solid rgba(124,58,237,0.4)}
.video-container video,.video-container iframe{width:100%;height:100%;border:none;object-fit:contain}
.video-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,18,0.9);color:var(--accent-light);font-size:0.85rem;gap:10px;z-index:2}
.spinner{width:40px;height:40px;border:3px solid rgba(124,58,237,0.3);border-top-color:var(--accent-light);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-size:.9rem;z-index:500;display:none;max-width:90%;text-align:center;box-shadow:0 5px 20px rgba(124,58,237,0.5)}
</style>
</head>
<body>

<header>
  <div class="logo">NaPlus</div>
  <div class="header-btns">
    <button class="btn-creator btn-exit" onclick="setCreator(false)">Salir</button>
    <button class="btn-creator" id="btnAdmin" onclick="toggleCreator()">Modo Creador</button>
  </div>
</header>

<div class="hero">
  <h1>NaPlus Streaming</h1>
  <p>Seleccioná cualquier título para reproducir o ver detalles.</p>
  <div class="searchbar">
    <input type="search" id="search" placeholder="Buscar películas y series..." oninput="render()">
    <button class="btn-creator" id="listBtn" onclick="goList()">🔖 Mi lista (0)</button>
  </div>
</div>

<div id="searchSec" style="display:none">
  <div class="section-title">Resultados</div>
  <div class="grid" id="resultsGrid"></div>
</div>
<div id="mainSecs">
  <div id="recentSec"><div class="section-title">Recientes</div><div class="grid" id="recentGrid"></div></div>
  <div id="listSec"><div class="section-title">Mi lista</div><div class="grid" id="listGrid"></div></div>
  <div class="section-title">Películas</div>
  <div class="grid" id="moviesGrid"></div>
  <div class="section-title">Series</div>
  <div class="grid" id="seriesGrid"></div>
</div>

<!-- Modal Detalle y Reproductor -->
<div class="modal" id="detailModal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-content">
    <button class="btn-close-modal" onclick="closeDetail()">✕</button>
    <div class="video-container" id="videoContainer">
      <div class="video-loading" id="videoLoading" style="display:none;">
        <div class="spinner"></div>
        <span>Cargando streaming...</span>
      </div>
    </div>
    <h3 id="detailTitle"></h3>
    <p id="detailMeta" style="color:var(--accent-light);font-size:.85rem;margin-bottom:8px"></p>
    <p id="detailDesc" style="color:var(--text-muted);font-size:.85rem;margin-bottom:18px;line-height:1.4"></p>
    <div class="form-btns" id="detailBtns"></div>
  </div>
</div>

<!-- Modal Clave Creador -->
<div class="modal" id="loginModal">
  <div class="modal-content" style="max-width:380px;">
    <button class="btn-close-modal" onclick="closeLogin()">✕</button>
    <h3>Modo Creador</h3>
    <p class="hint">Ingresá tu clave secreta de administrador:</p>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <input type="password" id="passInput" required autocomplete="current-password" placeholder="Clave...">
      </div>
      <div class="form-btns">
        <button type="button" class="btn-sec" onclick="closeLogin()">Cancelar</button>
        <button type="submit" class="btn-pri">Entrar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Formulario Subida / Edición -->
<div class="modal" id="adminModal">
  <div class="modal-content">
    <button class="btn-close-modal" onclick="closeAdmin()">✕</button>
    <h3 id="formTitle">Subir contenido</h3>
    <form onsubmit="saveData(event)">
      <input type="hidden" id="editId">
      <div class="form-group"><label>Tipo</label>
        <select id="type"><option value="movie">Película</option><option value="series">Serie</option></select></div>
      <div class="form-group"><label>Título</label><input type="text" id="title" required></div>
      <div class="form-group"><label>Género</label><input type="text" id="genre" required placeholder="Terror, Acción..."></div>
      <div class="form-group"><label>Año</label><input type="number" id="year" required placeholder="2026"></div>
      <div class="form-group"><label>Sinopsis</label><textarea id="desc" rows="3"></textarea></div>
      
      <div class="form-group">
        <label>Portada (Subir archivo de Galería)</label>
        <input type="file" id="coverFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>o Link URL de Imagen</label>
        <input type="url" id="coverUrl" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Link de Video (Google Drive directo, YouTube, MP4...)</label>
        <input type="url" id="video" placeholder="https://..." required>
      </div>
      <div class="form-btns">
        <button type="button" class="btn-sec" onclick="closeAdmin()">Cancelar</button>
        <button type="submit" class="btn-pri">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal de Confirmación -->
<div class="modal" id="dialogModal">
  <div class="modal-content" style="max-width:380px;">
    <h3 id="dlgTitle"></h3>
    <p id="dlgMsg" class="hint"></p>
    <div class="form-btns">
      <button class="btn-sec" id="dlgCancel">Cancelar</button>
      <button class="btn-pri" id="dlgOk" style="background:#ef4444;">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const NO_COVER = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='300'><rect width='100%' height='100%' fill='%23140d24'/><text x='50%' y='50%' fill='%2394a3b8' font-size='16' text-anchor='middle' font-family='sans-serif'>Sin portada</text></svg>";
const LIST_KEY = 'naPlus_list';
const DB_KEY = 'naPlus_db_v6';

let isCreator = false, currentId = null, saved = [], customCoverData = '';
try { saved = JSON.parse(localStorage.getItem(LIST_KEY)) || []; } catch (e) {}

let catalog = JSON.parse(localStorage.getItem(DB_KEY)) || [
  {
    id: 1,
    type: 'movie',
    title: 'Rec',
    genre: 'Terror',
    year: '2007',
    desc: 'Película de prueba optimizada.',
    cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400',
    video: 'https://lh3.googleusercontent.com/d/10-ff0lGCypXx4dHgmc7NaYEzI4hcMnr2=w1920'
  }
];

const isSaved = id => saved.some(x => x == id);

let toastTimer;
function toast(msg, ms = 3000) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', ms);
}

function confirmDialog(title, msg) {
  return new Promise(resolve => {
    $('dlgTitle').textContent = title; $('dlgMsg').textContent = msg;
    $('dialogModal').style.display = 'flex';
    const done = v => { $('dialogModal').style.display = 'none'; $('dlgOk').onclick =$('dlgCancel').onclick = null; resolve(v); };
    $('dlgOk').onclick = () => done(true);$('dlgCancel').onclick = () => done(false);
  });
}

function makeCard(item) {
  const div = document.createElement('div');
  div.className = 'card';
  const on = isSaved(item.id);
  div.innerHTML = `
    <button class="card-save${on ? ' on' : ''}" aria-label="Mi lista">${on ? '✓' : '＋'}</button>
    <div class="card-admin-btns">
      <button class="edit" aria-label="Editar" onclick="event.stopPropagation(); editItem(${item.id})">✏️</button>
      <button class="del" aria-label="Eliminar" onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
    </div>
    <img src="${esc(item.cover || NO_COVER)}" alt="Portada">
    <div class="card-info">
      <div class="card-title">${esc(item.title)}</div>
      <div class="card-sub">${esc(item.genre || 'General')} • ${esc(item.year)}</div>
    </div>`;
  div.querySelector('img').onerror = function () { this.onerror = null; this.src = NO_COVER; };
  div.onclick = () => showDetail(item.id);
  div.querySelector('.card-save').onclick = e => { e.stopPropagation(); toggleSaved(item.id); };
  return div;
}

function fillGrid(id, items, emptyMsg) {
  const g = $(id); g.innerHTML = '';
  items.forEach(i => g.appendChild(makeCard(i)));
  if (!items.length && emptyMsg) g.innerHTML = `<p class="empty">${emptyMsg}</p>`;
}

function render() {
  const q = norm($('search').value.trim());
  const sorted = catalog.slice().sort((a, b) => b.id - a.id);
  const savedItems = saved.map(id => catalog.find(x => x.id == id)).filter(Boolean);
  $('listBtn').textContent = `🔖 Mi lista (${savedItems.length})`;
  $('searchSec').style.display = q ? 'block' : 'none';
  $('mainSecs').style.display = q ? 'none' : 'block';
  
  if (q) {
    fillGrid('resultsGrid', sorted.filter(i => norm([i.title, i.genre, i.desc, i.year].join(' ')).includes(q)), 'No encontramos resultados.');
    return;
  }
  
  $('recentSec').style.display = sorted.length ? 'block' : 'none';
  fillGrid('recentGrid', sorted.slice(0, 10));
  $('listSec').style.display = savedItems.length ? 'block' : 'none';
  fillGrid('listGrid', savedItems);
  fillGrid('moviesGrid', sorted.filter(i => i.type === 'movie'), 'No hay películas cargadas.');
  fillGrid('seriesGrid', sorted.filter(i => i.type !== 'movie'), 'No hay series cargadas.');
}

function toggleSaved(id) {
  const i = saved.findIndex(x => x == id);
  if (i > -1) saved.splice(i, 1); else saved.push(id);
  try { localStorage.setItem(LIST_KEY, JSON.stringify(saved)); } catch (e) {}
  render(); updateDetailSave();
}

function updateDetailSave() {
  const b = $('detailSave');
  if (b && currentId != null) b.textContent = isSaved(currentId) ? '✓ En mi lista' : '＋ Mi lista';
}

function goList() {
  if (!saved.some(id => catalog.find(x => x.id == id))) { toast('Tu lista está vacía.'); return; }
  $('search').value = ''; render();$('listSec').scrollIntoView({ behavior: 'smooth' });
}

function setCreator(on) {
  isCreator = on;
  document.body.classList.toggle('creator', on);
  $('btnAdmin').textContent = on ? '+ Agregar' : 'Modo Creador';
}

function toggleCreator() {
  if (isCreator) { openAdmin(); return; }
  $('passInput').value = '';$('loginModal').style.display = 'flex';
}

function closeLogin() { $('loginModal').style.display = 'none'; }

function doLogin(e) {
  e.preventDefault();
  const pass = $('passInput').value.trim();
  if (pass === "9009") {
    closeLogin();
    setCreator(true);
    toast('Modo creador activado');
    render();
    openAdmin();
  } else {
    toast('Clave incorrecta');
  }
}

$('coverFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 500;
        const scaleSize = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scaleSize;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        customCoverData = canvas.toDataURL('image/jpeg', 0.85);
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  }
});

function openAdmin(item = null) {
  customCoverData = '';
  $('editId').value = item ? item.id : '';
  $('formTitle').textContent = item ? 'Editar contenido' : 'Subir contenido';
  $('type').value = item ? item.type : 'movie';
  $('title').value = item ? item.title : '';
  $('genre').value = item ? item.genre : '';
  $('year').value = item ? item.year : '2026';
  $('desc').value = item ? item.desc : '';
  $('coverUrl').value = item ? (item.cover.startsWith('data:') ? '' : item.cover) : '';
  $('coverFile').value = '';$('video').value = item ? item.video : '';
  $('adminModal').style.display = 'flex';
}

function closeAdmin() { $('adminModal').style.display = 'none'; }

function saveData(e) {
  e.preventDefault();
  const id = $('editId').value;
  const coverResult = customCoverData || $('coverUrl').value.trim() || NO_COVER;

  const newItem = {
    id: id ? parseInt(id) : Date.now(),
    type: $('type').value,
    title: $('title').value.trim(),
    genre: $('genre').value.trim() || 'General',
    year: $('year').value,
    desc: $('desc').value.trim(),
    cover: coverResult,
    video: $('video').value.trim()
  };

  if (id) {
    const idx = catalog.findIndex(x => x.id == id);
    if (idx !== -1) catalog[idx] = newItem;
  } else {
    catalog.unshift(newItem);
  }

  try { localStorage.setItem(DB_KEY, JSON.stringify(catalog)); } catch(e) {}
  render();
  closeAdmin();
  toast('Guardado con éxito');
}

function editItem(id) {
  const item = catalog.find(x => x.id == id);
  if (item) openAdmin(item);
}

async function deleteItem(id) {
  const item = catalog.find(x => x.id == id);
  if (!item) return;
  if (await confirmDialog('Eliminar contenido', `¿Eliminar "${item.title}"?`)) {
    catalog = catalog.filter(x => x.id != id);
    try { localStorage.setItem(DB_KEY, JSON.stringify(catalog)); } catch(e) {}
    render();
    toast('Contenido eliminado');
  }
}

function showDetail(id) {
  currentId = id;
  const item = catalog.find(x => x.id == id);
  if (!item) return;

  $('detailTitle').textContent = item.title;
  $('detailMeta').textContent = `${item.genre} • ${item.year}`;
  $('detailDesc').textContent = item.desc || 'Sin descripción disponible.';

  const container = $('videoContainer');
  container.innerHTML = `
    <div class="video-loading" id="videoLoading">
      <div class="spinner"></div>
      <span>Cargando reproductor...</span>
    </div>`;

  const vUrl = item.video || '';

  if (vUrl) {
    if (vUrl.includes('youtube.com') || vUrl.includes('youtu.be')) {
      let embed = vUrl.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
      container.innerHTML += `<iframe src="${embed}" allowfullscreen onload="$('videoLoading').style.display='none'"></iframe>`;
    } else {
      const vid = document.createElement('video');
      vid.src = vUrl;
      vid.controls = true;
      vid.autoplay = false;
      vid.playsInline = true;
      vid.poster = item.cover || NO_COVER;
      vid.onloadeddata = () => { $('videoLoading').style.display = 'none'; };
      vid.onerror = () => { 
        $('videoLoading').innerHTML = '<span style="color:#f87171; text-align:center; padding:0 15px;">Error cargando el video. Comprobá que el enlace de Google Drive sea público.</span>'; 
      };
      container.appendChild(vid);
    }
  } else {
    container.innerHTML += `<img src="${esc(item.cover || NO_COVER)}" alt="Portada">`;
    $('videoLoading').style.display = 'none';
  }

  const btnBox = $('detailBtns');
  btnBox.innerHTML = `
    <button class="btn-sec" id="detailSave"
